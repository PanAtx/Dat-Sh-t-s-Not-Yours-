<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, orientation=landscape">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Dat Sh!ts Not Yours!</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100vw; height:100vh; overflow:hidden; background:#0a0d12; user-select:none; -webkit-user-select:none; }
#game { position:fixed; inset:0; }
#game canvas { display:block; }
#haze { position:fixed; inset:0; z-index:5; pointer-events:none;
  background:linear-gradient(315deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,.07) 22%, transparent 45%); }
#scanlines { position:fixed; inset:0; z-index:6; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(6,10,14,.20) 0px, rgba(6,10,14,.20) 1px, transparent 1px, transparent 3px);
  animation:crt 4s steps(60) infinite; }
@keyframes crt { 0%,100% { opacity:.9 } 50% { opacity:.72 } }
#vignette { position:fixed; inset:0; z-index:7; pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%, transparent 52%, rgba(0,0,0,.42) 100%); }
#hud { position:fixed; inset:0; z-index:10; pointer-events:none; font-family:"Courier New", Courier, monospace; color:#eaf6ff; }
.hudbox { text-shadow:0 0 8px rgba(46,224,144,.55), 2px 2px 0 rgba(0,0,0,.85); }
#tl { position:absolute; top:16px; left:20px; font-size:20px; letter-spacing:2px; }
#tl .sub { font-size:14px; color:#9fe8b8; margin-top:4px; }
#route { position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
  border:2px solid rgba(46,224,144,.7); background:rgba(4,18,10,.66); padding:6px 22px;
  font-size:16px; letter-spacing:3px; color:#bfe9ff; white-space:nowrap; }
#tr { position:absolute; top:16px; right:20px; text-align:right; font-size:13px; letter-spacing:1px; }
#pips { margin-top:6px; }
.pip { display:inline-block; width:14px; height:14px; margin-left:6px; border:2px solid #ffb84d; transform:rotate(45deg); }
.pip.on { background:#ff3b3b; box-shadow:0 0 10px #ff3b3b; }
#carry { position:absolute; bottom:44px; left:50%; transform:translateX(-50%); font-size:18px; letter-spacing:2px; color:#7dff9e; white-space:nowrap; }
#flash { position:fixed; inset:0; z-index:9; pointer-events:none; background:rgba(255,40,40,.3); opacity:0; transition:opacity .5s; }
.modal { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; padding:10px; background:rgba(3,7,10,.82); }
.panel { border:3px solid #2ee090; background:linear-gradient(180deg, #07130d, #040a07);
  padding:clamp(14px,2.8vh,34px) clamp(16px,4vw,48px); text-align:center;
  box-shadow:0 0 34px rgba(46,224,144,.4), inset 0 0 60px rgba(0,0,0,.65);
  width:min(94vw,680px); max-width:94vw; max-height:calc(100vh - 24px); max-height:100%; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.panel h1 { font-family:"Courier New", monospace; font-size:clamp(18px,4.4vw,34px); letter-spacing:5px; color:#2ee090; text-shadow:0 0 14px rgba(46,224,144,.8); }
.title-text { font-family:"Arial Black", Impact, sans-serif; font-size:clamp(18px,4.4vw,36px); font-weight:bold; color:#ffffff; text-align:center; display:block; margin:0 auto clamp(6px,1.4vh,12px); line-height:1.1; letter-spacing:2px; }
.panel h2 { font-family:"Courier New", monospace; font-size:clamp(16px,4vw,26px); letter-spacing:4px; color:#ff5252; text-shadow:0 0 14px rgba(255,82,82,.8); }
.panel .tag { font-family:"Courier New", monospace; color:#9fe8b8; letter-spacing:2px; font-size:clamp(10px,1.7vw,13px); margin-top:8px; }
.panel .ctl { font-family:"Courier New", monospace; color:#cfe6ff; font-size:clamp(11px,1.8vw,14px); line-height:clamp(1.45,2.3vh,1.9); margin:clamp(10px,2vh,20px) 0; text-align:left; display:inline-block; }
.panel .score { font-family:"Courier New", monospace; font-size:clamp(14px,2.6vw,20px); color:#ffd66b; margin:clamp(8px,1.6vh,14px) 0 4px; letter-spacing:2px; }
#btnStart, #btnRestart { font-family:"Courier New", monospace; font-size:clamp(14px,2.6vw,20px); letter-spacing:4px; padding:clamp(10px,2vh,14px) clamp(28px,6vw,44px); margin-top:clamp(10px,2vh,18px); cursor:pointer;
  color:#04140c; background:#2ee090; border:none; box-shadow:0 0 18px rgba(46,224,144,.7); pointer-events:auto; }
#btnStart:hover, #btnRestart:hover { background:#5cf0ad; }
.hidden { display:none !important; }
.kbd { color:#7dff9e; }
/* ===== Menu logo screen ===== */
#menu .panel { background:none; border:none; box-shadow:none; padding:0; max-width:none; width:auto; }
.menu-logo-wrap { position:relative; display:inline-block; line-height:0; overflow:hidden;
  border:3px solid #2ee090; border-radius:14px;
  box-shadow:0 0 28px rgba(46,224,144,.55), 0 0 60px rgba(46,224,144,.2), 0 0 50px rgba(0,0,0,.8); }
.menu-logo-wrap img { max-width:82vw; max-height:84vh; width:auto; height:auto; display:block; }
/* Pinned to the VERY BOTTOM of the logo frame: START SHIFT with the NOW PLAYING
   widget docked just below it (flush with the frame's bottom edge, minimal footprint). */
.menu-bottom { position:absolute; bottom:0; left:0; right:0; text-align:center; padding:0;
  display:flex; flex-direction:column; align-items:center; gap:clamp(8px,1.4vh,14px); }
.menu-bottom .score { font-family:"Courier New",monospace; font-size:clamp(14px,3vw,24px); color:#fff; letter-spacing:3px;
  animation:hiGlow 2.2s ease-in-out infinite; }
@keyframes hiGlow {
  0%,100% { text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000, 0 0 8px rgba(255,255,255,.3); }
  50%      { text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000, 0 0 22px rgba(255,255,255,.95), 0 0 40px rgba(255,255,255,.4); }
}
#btnStart { font-family:"Arial Black",Impact,sans-serif; font-weight:bold; font-size:clamp(16px,2.8vw,24px); letter-spacing:5px;
  padding:clamp(12px,2.2vh,16px) clamp(32px,7vw,52px); cursor:pointer;
  color:#fff; text-shadow:1.5px 1.5px 0 #000,-1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px 1.5px 0 #000;
  border:2px solid rgba(46,224,144,.85); border-radius:4px;
  animation:btnPulse 2.4s ease-in-out infinite;
  pointer-events:auto; }
@keyframes btnPulse {
  0%,100% { background:rgba(46,224,144,.25); box-shadow:0 0 12px rgba(46,224,144,.25), 0 4px 14px rgba(0,0,0,.4); }
  50%      { background:rgba(46,224,144,.7);  box-shadow:0 0 30px rgba(46,224,144,.75), 0 4px 18px rgba(0,0,0,.4); }
}
#btnStart:hover { animation:none; color:#fff; background:rgba(92,240,173,.8); border-color:rgba(92,240,173,.95); box-shadow:0 0 32px rgba(46,224,144,.8), 0 4px 20px rgba(0,0,0,.4); }
/* ===== Security-camera DVR overlay (bottom-right, clears the HUD / score) ===== */
#camfeed { position:fixed; right:18px; bottom:calc(var(--act) + 82px); z-index:11; pointer-events:none;
  font-family:'Press Start 2P','Courier New',monospace; text-align:right; line-height:2.3;
  text-shadow:1px 1px 0 rgba(0,0,0,.95), 0 0 4px rgba(0,0,0,.7); }
#camfeed .rec { color:#ff3b3b; font-size:14px; text-shadow:1px 1px 0 rgba(0,0,0,.95), 0 0 10px rgba(255,59,59,.85);
  animation:recblink 1.15s infinite; }
#camfeed .dot { display:inline-block; width:11px; height:11px; background:#ff3b3b;
  box-shadow:0 0 10px #ff3b3b; margin-right:10px; vertical-align:-1px; }
#camfeed .cam { color:#eafff2; font-size:12px; }
#camfeed .ts { color:#bfeed4; font-size:11px; }
@keyframes recblink { 0%,50% { opacity:1; } 50.1%,100% { opacity:.12; } }
/* ===== Landscape-only / fullscreen gate (no portrait mode) ===== */
.rotate-overlay { position:fixed; inset:0; z-index:60; display:none; flex-direction:column;
  align-items:center; justify-content:center; gap:22px; background:rgba(3,7,10,.97);
  font-family:"Courier New",Courier,monospace; text-align:center; padding:24px; }
.rotate-overlay .icon { font-size:56px; line-height:1; animation:rotspin 2.2s ease-in-out infinite; }
.rotate-overlay .msg { font-size:22px; letter-spacing:3px; color:#2ee090; text-shadow:0 0 12px rgba(46,224,144,.7); }
.rotate-overlay .sub { font-size:14px; letter-spacing:2px; color:#9fe8b8; }
@keyframes rotspin { 0%,18% { transform:rotate(0deg); } 58%,100% { transform:rotate(90deg); } }
@media (orientation: portrait) { .rotate-overlay { display:flex !important; } }
/* ===== Animated reward popups (MONGO! / STREET CASH! / TREASURE!) ===== */
.popup { position:fixed; left:50%; top:26vh; z-index:55; pointer-events:none; white-space:nowrap; text-align:center;
  font-family:'Press Start 2P','Courier New',monospace; font-size:min(8.5vw,64px); font-weight:bold; letter-spacing:4px; }
.popup .pop-sub { display:inline-block; margin-top:16px; font-size:min(3vw,22px); letter-spacing:3px; color:#fff;
  background:rgba(0,0,0,.55); padding:6px 14px; border:2px solid rgba(255,255,255,.35); border-radius:4px; }
/* ===== Comic-strip speech bubbles (worker + NPC lines, ~2s each) ===== */
.bubble { position:fixed; z-index:50; pointer-events:none; transform:translate(-50%,-110%);
  background:#fffdf2; border:3px solid #14141a; border-radius:10px; padding:5px 8px 6px;
  font-family:'Press Start 2P','Courier New',monospace; font-size:9px; line-height:1.6; letter-spacing:0;
  color:#14141a; white-space:nowrap; box-shadow:4px 5px 0 rgba(0,0,0,.30); }
.bubble::after { content:''; position:absolute; left:50%; bottom:-10px; transform:translateX(-50%);
  width:0; height:0; border-left:7px solid transparent; border-right:7px solid transparent; border-top:10px solid #14141a; }
.pop-mongo    { color:#ffab45; text-shadow:4px 4px 0 rgba(0,0,0,.85), 0 0 22px rgba(255,160,60,.8); animation:popPunch 1.1s cubic-bezier(.2,1.5,.4,1) forwards; }
.pop-cash     { color:#54ff88; text-shadow:4px 4px 0 rgba(0,0,0,.85), 0 0 22px rgba(60,255,120,.8); animation:cashWobble 1.1s ease-out forwards; }
.pop-treasure { color:#ffd23a; text-shadow:4px 4px 0 rgba(0,0,0,.85), 0 0 28px rgba(255,210,60,.9); animation:treasureZoom 1.2s ease-out forwards; }
@keyframes popPunch {
  0% { transform:translateX(-50%) scale(.2); opacity:0; }
  30% { transform:translateX(-50%) scale(1.3); opacity:1; }
  50% { transform:translateX(-50%) scale(.94); }
  68% { transform:translateX(-50%) scale(1.1); }
  85% { transform:translateX(-50%) scale(1); opacity:1; }
  100% { transform:translateX(-50%) scale(1.02); opacity:0; }
}
@keyframes cashWobble {
  0% { transform:translateX(calc(-50% - 55vw)) rotate(-10deg); opacity:0; }
  38% { transform:translateX(-50%) rotate(6deg); opacity:1; }
  58% { transform:translateX(calc(-50% - 18px)) rotate(-4deg); }
  76% { transform:translateX(calc(-50% + 10px)) rotate(2deg); }
  100% { transform:translateX(-50%) rotate(0); opacity:0; }
}
@keyframes treasureZoom {
  0% { transform:translateX(-50%) scale(.1) rotate(-28deg); opacity:0; }
  42% { transform:translateX(-50%) scale(1.35) rotate(9deg); opacity:1; }
  64% { transform:translateX(-50%) scale(.97) rotate(-4deg); }
  84% { transform:translateX(-50%) scale(1.06) rotate(0); opacity:1; }
  100% { transform:translateX(-50%) scale(1) rotate(0); opacity:0; }
}
/* ===== Mobile virtual pad: 8-way joystick (bottom-left) + action button (bottom-right) =====
   Large translucent circle = travel radius, small translucent circle = the stick.
   Keyboard / gamepad input is mirrored onto this pad, so it also shows what's pressed on desktop. */
:root { --joy: min(36vh, 24vw, 200px); --act: min(24vh, 16vw, 132px); }
#vpad { position:fixed; inset:0; z-index:12; pointer-events:none; display:none; }
#vpad.on { display:block; }
#joy { position:absolute; left:max(56px, 7vw);
  bottom:56px; bottom:calc(56px + env(safe-area-inset-bottom, 0px));
  width:var(--joy); height:var(--joy); border-radius:50%;
  border:2px solid rgba(120,215,255,.35);
  background:radial-gradient(circle at 50% 42%, rgba(140,220,255,.10), rgba(140,220,255,.03) 72%);
  box-shadow:inset 0 0 22px rgba(90,190,255,.16), 0 4px 18px rgba(0,0,0,.35);
  pointer-events:auto; touch-action:none; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
#joy-stick { position:absolute; left:50%; top:50%; width:46%; height:46%;
  transform:translate(-50%,-50%); border-radius:50%;
  border:2px solid rgba(150,225,255,.55);
  background:radial-gradient(circle at 42% 38%, rgba(190,240,255,.30), rgba(120,200,255,.12) 78%);
  box-shadow:0 0 16px rgba(110,200,255,.4), inset 0 0 10px rgba(150,225,255,.35); }
#actbtn { position:absolute; right:max(56px, 7vw);
  bottom:56px; bottom:calc(56px + env(safe-area-inset-bottom, 0px));
  width:var(--act); height:var(--act); border-radius:50%;
  border:2px solid rgba(46,224,144,.5);
  background:radial-gradient(circle at 45% 40%, rgba(46,224,144,.22), rgba(46,224,144,.06) 78%);
  box-shadow:0 0 18px rgba(46,224,144,.25), 0 4px 18px rgba(0,0,0,.35), inset 0 0 14px rgba(46,224,144,.2);
  display:flex; align-items:center; justify-content:center;
  pointer-events:auto; touch-action:none; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
#actbtn span { font-family:"Courier New",monospace; font-size:calc(var(--act) * .19); letter-spacing:2px;
  color:rgba(210,255,225,.8); text-shadow:0 0 8px rgba(46,224,144,.85); pointer-events:none; }
#actbtn.pressed { border-color:rgba(140,255,190,.95);
  background:radial-gradient(circle at 45% 40%, rgba(140,255,190,.42), rgba(46,224,144,.2) 78%);
  box-shadow:0 0 30px rgba(46,224,144,.65), inset 0 0 20px rgba(140,255,190,.45); }
/* ===== Car-stereo NOW PLAYING widget: LED-pixel title + fake spectrum bars + MUTE / SKIP ===== */
/* z-index 30 sits the widget above the menu modal (z 20) and the touch pad (z 12),
   but below reward popups (z 55) and the rotate-to-landscape gate (z 60). It is a
   standalone fixed element (not inside #hud) so it shows on the START screen too,
   where it becomes the pre-game music player. */
#radio { position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:30; pointer-events:auto; cursor:pointer;
  display:flex; align-items:center; gap:9px; padding:7px 10px; border-radius:6px;
  border:2px solid rgba(46,224,144,.42);
  background:radial-gradient(rgba(60,255,138,.12) 1px, transparent 1.5px) 0 0/4px 4px, linear-gradient(180deg, rgba(3,12,8,.88), rgba(3,12,8,.78));
  box-shadow:inset 0 0 20px rgba(0,0,0,.75), 0 0 14px rgba(46,224,144,.18); }
/* Start screen: the widget DOCKS into the menu bar below START SHIFT (where the
   hi-score used to sit) and flows in document order; in play / on game-over it
   lives in the body as the top-center HUD slot, clear of joystick + action pad. */
#radio.in-menu { position:static; transform:none; }
/* The WHOLE widget bar is a tap target for "tune in" — MUTE / SKIP keep their own
   handlers (the click listener skips e.target.closest('button')). */
#radio-title { pointer-events:auto; cursor:pointer; }
#radio-bars { pointer-events:auto; }
#radio-bars { display:flex; align-items:flex-end; gap:2px; height:16px; width:27px; flex:none; }
#radio-bars i { flex:1; height:18%; border-radius:1px; background:#39f78e; box-shadow:0 0 6px rgba(60,255,138,.85); opacity:.9; }
#radio.on #radio-bars i { animation:eq 1s ease-in-out infinite; }
#radio.on #radio-bars i:nth-child(1){ animation-duration:1.1s; }
#radio.on #radio-bars i:nth-child(2){ animation-duration:.72s; animation-delay:-.35s; }
#radio.on #radio-bars i:nth-child(3){ animation-duration:.95s; animation-delay:-.15s; }
#radio.on #radio-bars i:nth-child(4){ animation-duration:.66s; animation-delay:-.5s; }
#radio.on #radio-bars i:nth-child(5){ animation-duration:1.05s; animation-delay:-.28s; }
#radio.on #radio-bars i:nth-child(6){ animation-duration:.8s; animation-delay:-.62s; }
#radio.on #radio-bars i:nth-child(7){ animation-duration:.9s; animation-delay:-.1s; }
@keyframes eq { 0%,100% { height:16%; } 50% { height:100%; } }
#radio-title { font-family:'Press Start 2P','Courier New',monospace; font-size:9px; letter-spacing:1px; line-height:1.5;
  color:#54ff9c; text-shadow:0 0 8px rgba(60,255,138,.85), 1px 1px 0 rgba(0,0,0,.9);
  width:168px; flex:none; white-space:nowrap; overflow:hidden; text-transform:uppercase; }
/* explicit line-height: docked in the menu the widget inherits line-height:0 from
   .menu-logo-wrap, which would clip the title text to invisible */
/* The widget is a FIXED size: short titles just sit there; when a title is too
   wide it ticker-scrolls inside the box instead of stretching the widget. */
#radio-title .tk { display:inline-block; white-space:nowrap; will-change:transform; }
#radio.tick #radio-title .tk { padding-left:100%; animation:radio-tick 9s linear infinite; }
@keyframes radio-tick { to { transform:translateX(-100%); } }
#radio.muted #radio-title { color:rgba(110,130,120,.6); text-shadow:none; }
#radio.muted #radio-bars i { background:rgba(90,120,105,.5); box-shadow:none; animation:none; height:18%; } /* muted = spectrum frozen */
.radio-btn { pointer-events:auto; font-family:'Press Start 2P','Courier New',monospace; font-size:8px; letter-spacing:1px;
  color:#04140c; background:#39f78e; border:1px solid rgba(190,255,220,.8); border-radius:3px;
  padding:5px 7px; cursor:pointer; box-shadow:0 0 9px rgba(60,255,138,.5); -webkit-tap-highlight-color:transparent; }
.radio-btn:active { transform:scale(.93); }
#btnMute.off { background:rgba(30,46,38,.9); color:#54ff9c; box-shadow:none; }
</style>

<body>
<div id="game"></div>
<div id="haze"></div>
<div id="scanlines"></div>
<div id="vignette"></div>
<div id="flash"></div>
<div id="hud">
  <div id="tl" class="hudbox"><div>SCORE $<span id="score">000000</span></div><div class="sub">STREET CASH $<span id="bonus">000000</span></div></div>
  <div id="route" class="hudbox">ROUTE 1 - MANHATTAN UPTOWN</div>
  <div id="tr" class="hudbox"><div>SUPERVISOR WRITE-UPS</div><div id="pips"><span class="pip"></span><span class="pip"></span><span class="pip"></span></div></div>
  <div id="carry" class="hudbox">HANDS FREE</div>
</div>
<!-- Car-stereo NOW PLAYING widget. Standalone fixed element (NOT inside #hud) so it
     shows on the START screen too, where it acts as the pre-game music player.
     Same widget, same scrolling LED title, same MUTE / SKIP, same audio element as
     in-game — so the song keeps playing seamlessly when the shift starts. -->
<div id="radio">
    <div id="radio-bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div id="radio-title"><span class="tk">TAP TO TUNE IN</span></div>
    <button id="btnMute" class="radio-btn">MUTE</button>
    <button id="btnSkip" class="radio-btn">SKIP »</button>
  </div>
<div id="camfeed">
  <div class="rec"><span class="dot"></span>REC</div>
  <div class="cam">FIAT CAM 01</div>
  <div class="ts" id="camdate">--/--/----</div>
  <div class="ts" id="camtime">--:--:--</div>
</div>
<div id="vpad">
  <div id="joy"><div id="joy-stick"></div></div>
  <div id="actbtn"><span>ACT</span></div>
</div>
<div class="rotate-overlay">
  <div class="icon">&#128241;</div>
  <div class="msg">ROTATE YOUR DEVICE</div>
  <div class="sub">PLAY IN LANDSCAPE &middot; FULLSCREEN</div>
</div>
<div id="menu" class="modal"><div class="panel">
  <div class="menu-logo-wrap">
    <img src="dsnylogo.jpg" alt="Dat Sh!t's Not Yours!">
    <div class="menu-bottom" id="menu-bottom">
      <button id="btnStart">START SHIFT</button>
      <!-- The NOW PLAYING widget (#radio) docks in here on the start screen:
           below START SHIFT, exactly where the hi-score used to sit -->
    </div>
  </div>
</div></div>
<div id="over" class="modal hidden"><div class="panel">
  <h2>SUSPENDED BY DSNY</h2>
  <div class="tag">3 WRITE-UPS - SHIFT TERMINATED</div>
  <div class="score">FINAL SCORE $<span id="finalscore">000000</span></div>
  <div class="score">HI-SCORE $<span id="hiscore2">000000</span></div>
  <button id="btnRestart">RESTART SHIFT</button>
</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="fflate.min.js"></script>
<script src="FBXLoader.js"></script>
<script src="GLTFLoader.js"></script>
<script>
'use strict';
// ==================== HELPERS & CORE STATE ====================
const $ = id => document.getElementById(id);
const R = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const dist = (x, y) => Math.hypot(x - p.wx, y - p.wy);
const pad = n => String(Math.max(0, Math.floor(n))).padStart(6, '0');
const TILE = 144, NB = 18, BW = 8;
const RUN_SPEED = 8.5;    // worker speed while W / UP / stick is held (no input = stands still)

// ===== Landscape-only / fullscreen gate: enter on START (a user gesture). =====
// Fullscreen is requested first; the orientation lock is attempted after it is granted
// (and falls back to the older API). All calls are best-effort: iOS/Safari can't lock
// orientation from the web, so we also rely on the viewport hint + the portrait overlay.
function enterLandscapeFullscreen(){
  function tryLock(){
    const o = (typeof screen !== 'undefined' && screen.orientation) ? screen.orientation : null;
    if (o) {
      if (typeof o.lock === 'function') { try { o.lock('landscape').catch(function(){}); } catch (e) {} }
      else if (typeof o.requestLock === 'function') { try { o.requestLock('landscape').catch(function(){}); } catch (e) {} }
    }
    try { window.focus(); } catch (e) {}
  }
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (req) {
    try {
      const r = req.call(el);
      if (r && typeof r.then === 'function') r.then(tryLock).catch(tryLock); else tryLock();
    } catch (e) { tryLock(); }
  } else {
    tryLock();
  }
}

// ==================== THREE SETUP (diagonal top-right matrix) ====================
function makeFrustum(){
  const a = innerWidth / innerHeight;
  const s = 4.5;
  if (a >= 1) return { l: -s * a, r: s * a, t: s, b: -s };
  return { l: -s, r: s, t: s / a, b: -s / a };
}
function initThree(){
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  $('game').appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9fb6c9);
  scene.fog = new THREE.Fog(0x9fb6c9, 60, 160); // NYC haze with real depth falloff

  const f = makeFrustum();
  camera = new THREE.OrthographicCamera(f.l, f.r, f.t, f.b, 1, 400);
  camera.up.set(0, 0, 1); // world vertical is the screen-up axis
  scene.add(camera); // root-level camera: its position is computed explicitly every frame

  scene.add(new THREE.AmbientLight(0xffffff, 0.78));
  dirLight = new THREE.DirectionalLight(0xfff2dd, 0.75);
  dirLight.position.set(-25, 28, 58);
  dirLight.castShadow = true;
  dirLight.shadow.bias = -0.0006;
  dirLight.shadow.mapSize.set(2048, 2048);
  const sc = dirLight.shadow.camera;
  sc.left = -45; sc.right = 45; sc.top = 45; sc.bottom = -45; sc.near = 1; sc.far = 220;
  scene.add(dirLight); scene.add(dirLight.target);

  // Rotate the whole world +45deg so local +X (route forward) points to the
  // TOP-RIGHT of the screen: the classic Paperboy diagonal axis.
  worldGroup = new THREE.Group();
  worldGroup.rotation.z = Math.PI / 4;
  scene.add(worldGroup);
  dynamicGroup = new THREE.Group();
  worldGroup.add(dynamicGroup);
  groundGroup = new THREE.Group();
  worldGroup.add(groundGroup);
  buildGround();
}

const SFX = {
  ctx: null, master: null,
  // ---- RADIO: endless random rotation of music/*.mp3, 2s pause between tracks ----
  // The browser can't enumerate folders, so at game start we scan the folder two ways:
  //  1) HTTP directory listing (autoindex — works on VS Code Live Server, python http.server,
  //     Apache/nginx autoindex, Caddy: adding/removing .mp3 files "just works")
  //  2) fallback: music/manifest.json (for hosts with no directory listing, e.g. GitHub Pages)
  radioEl: null, radioList: [], radioBag: [], radioTimer: null, radioStarting: false, radioMuted: false, radioGen: 0,
  ensure(){
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.5;
    this.master.connect(this.ctx.destination);
  },
  tone(type, f0, f1, dur, gain, when){
    if (!this.ctx) return;
    const t = this.ctx.currentTime + (when || 0);
    const o = this.ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(1, f0), t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, type, freq, gain, when){
    if (!this.ctx) return;
    const t = this.ctx.currentTime + (when || 0);
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const f = this.ctx.createBiquadFilter();
    f.type = type; f.frequency.value = freq; f.Q.value = 1;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur);
  },
  playTossSound(){      this.ensure(); this.noise(0.32, 'lowpass', 260, 0.9); this.tone('sine', 110, 52, 0.26, 0.7); },
  playCanDropSound(){   this.ensure(); this.tone('square', 520, 170, 0.12, 0.5); this.tone('square', 940, 300, 0.1, 0.3, 0.03); this.noise(0.16, 'highpass', 2400, 0.4); },
  playBonusTone(){      this.ensure(); const seq = [660, 880, 1320, 1760]; for (let i = 0; i < seq.length; i++) this.tone('sine', seq[i], seq[i], 0.13, 0.35, i * 0.07); },
  // --- Bonus pickup sounds (one distinct sound per item type) ---
  playKaChing(){        this.ensure(); this.tone('sine', 1975, 1975, 0.16, 0.5, 0.0); this.tone('triangle', 2637, 2637, 0.2, 0.32, 0.02); this.noise(0.09, 'highpass', 6000, 0.22, 0.0); },
  playMoneySound(){     this.ensure(); this.tone('square', 1568, 1245, 0.09, 0.38, 0.0); this.tone('square', 2093, 1760, 0.12, 0.34, 0.08); this.tone('sine', 3136, 3136, 0.15, 0.22, 0.08); this.noise(0.1, 'highpass', 5200, 0.28, 0.0); this.noise(0.09, 'highpass', 6800, 0.24, 0.08); },
  playTreasureJingle(){ this.ensure(); const seq = [523.25, 659.25, 783.99, 1046.5, 1318.5]; for (let i = 0; i < seq.length; i++){ this.tone('triangle', seq[i], seq[i], 0.16, 0.4, i * 0.08); this.tone('sine', seq[i] * 2, seq[i] * 2, 0.12, 0.15, i * 0.08); } this.tone('square', 1568, 1568, 0.22, 0.18, seq.length * 0.08); },
  playTripSound(){      this.ensure(); this.tone('sine', 82, 40, 0.3, 0.8); this.noise(0.26, 'lowpass', 200, 0.5); },
  playStun(){           this.ensure(); this.tone('square', 150, 55, 0.22, 0.5); this.noise(0.2, 'bandpass', 700, 0.4); },
  playPickupSound(){    this.ensure(); this.tone('triangle', 300, 520, 0.09, 0.4); },
  playDropSound(){      this.ensure(); this.tone('sine', 150, 55, 0.18, 0.5); this.noise(0.16, 'lowpass', 420, 0.4); },
  playComplaintSound(){ this.ensure(); this.tone('sawtooth', 210, 185, 0.22, 0.35); this.tone('sawtooth', 210, 185, 0.22, 0.35, 0.3); },
  playShooSound(){      this.ensure(); this.tone('triangle', 500, 900, 0.1, 0.25); },
  playHopperJingle(){   this.ensure(); const seq = [523.25, 659.25, 783.99, 1046.5]; for (let i = 0; i < seq.length; i++){ this.tone('triangle', seq[i], seq[i], 0.14, 0.4, i * 0.09); this.tone('sine', seq[i] * 2, seq[i] * 2, 0.1, 0.14, i * 0.09); } this.tone('sine', 140, 55, 0.34, 0.7, 0.0); this.noise(0.3, 'lowpass', 320, 0.5, 0.0); this.tone('square', 1568, 1568, 0.18, 0.22, seq.length * 0.09); },
  playGameOver(){       this.ensure(); const seq = [440, 330, 220, 110]; for (let i = 0; i < seq.length; i++) this.tone('square', seq[i], seq[i] * 0.96, 0.3, 0.3, i * 0.22); },
  // --- RADIO STATION: scan music/ for .mp3 files, then play them one after another
  //     in random order (shuffled bag — every song airs exactly once before any song
  //     repeats; the bag reshuffles only when fully consumed), with a ~2 second pause between
  //     tracks. Runs forever, like a radio station. Hardened so the rotation can never
  //     degrade into "the same few songs on repeat": the playlist is the deduped UNION of
  //     the directory listing AND the manifest, and every "advance" event (ended / error /
  //     autoplay-reject / SKIP) funnels through ONE pending slot (_radioSchedule), so stale
  //     aborted-load events can't queue up a skip-cascade that eats the bag early. ---
  async radioScan(){
    const isMp3 = n => /\.mp3$/i.test(n);
    const found = [];
    const add = n => { if (n && isMp3(n) && found.indexOf(n) < 0) found.push(n); };
    // 1) HTTP directory listing of music/ (autoindex / python http.server / VS Code Live
    //    Server / Apache / nginx / Caddy: adding/removing .mp3 files "just works")
    try {
      const r = await fetch('music/', { cache: 'no-cache' });
      if (r.ok){
        const txt = await r.text();
        const re = /href=["']([^"'\?#<>]+\.mp3)["']/gi;
        let m;
        while ((m = re.exec(txt))){
          try { add(decodeURIComponent(m[1].split('/').pop())); } catch (e) {}
        }
      }
    } catch (e) {}
    // 2) manifest.json (for hosts with no directory listing, e.g. GitHub Pages), unioned
    //    with the listing above so the playlist is always the full set.
    try {
      const r = await fetch('music/manifest.json', { cache: 'no-cache' });
      if (r.ok){
        const j = await r.json();
        const arr = Array.isArray(j) ? j : (j && Array.isArray(j.files) ? j.files : []);
        for (let i = 0; i < arr.length; i++) add(arr[i]);
      }
    } catch (e) {}
    return found;
  },
  _radioSchedule(delay){ // single pending "advance" slot: replaces any earlier one
    if (this.radioTimer) clearTimeout(this.radioTimer);
    this.radioTimer = setTimeout(() => { this.radioTimer = null; this.radioNext(); }, delay);
  },
  _radioCancel(){
    if (this.radioTimer){ clearTimeout(this.radioTimer); this.radioTimer = null; }
  },
  radioNext(){
    if (!this.radioEl || !this.radioList.length) return;
    if (!this.radioBag.length){
      this.radioBag = this.radioList.slice();
      for (let i = this.radioBag.length - 1; i > 0; i--){ const j = (Math.random() * (i + 1)) | 0; const t = this.radioBag[i]; this.radioBag[i] = this.radioBag[j]; this.radioBag[j] = t; }
    }
    const name = this.radioBag.pop();
    this.radioGen++;        // new current track: pending events from abandoned loads are stale
    this._radioCancel();    // never double-advance from a leftover timer
    try { radioSetTitle(name); } catch (e) {} // update the NOW PLAYING LED title
    this.radioEl.src = 'music/' + encodeURIComponent(name);
    const p = this.radioEl.play();
    if (p && p.catch) p.catch(() => this._radioSchedule(250)); // blocked/failed track: skip ahead
  },
  async radioStart(){
    if (this.radioEl) return; // already on air — restarting the game must not double-start
    if (this.radioStarting) return;
    this.radioStarting = true;
    let list = [];
    try { list = await this.radioScan(); } catch (e) {}
    this.radioStarting = false;
    if (!list.length) return; // no songs found: stay silent, never break the game
    this.radioList = list;    // radioScan() already dedupes
    try { console.log('[radio] ' + list.length + ' tracks on the rotation: ' + list.join(' | ')); } catch (e) {}
    const el = this.radioEl = new Audio();
    el.volume = this.radioMuted ? 0 : 0.9; // honor a mute set before the station came on air
    el.addEventListener('ended', () => this._radioSchedule(2000)); // song finished → 2s of air → next song
    el.addEventListener('error', () => this._radioSchedule(300));  // bad/missing file → skip it right away
    this.radioNext();
  },
  radioSkip(){ // SKIP button: jump to the next song right now (no 2-second gap)
    if (!this.radioEl || !this.radioList.length) return;
    this._radioCancel();
    this.radioNext();
  }
};

// ---- Start-screen music player: the SAME widget + SAME audio element, so the song
//      is continuous from the menu straight into the game (radioStart() is
//      idempotent — it never restarts a track that is already on air). ----
// Tapping the widget body (NOT the MUTE / SKIP buttons) brings the station on air.
// This is a user gesture, which is exactly what the browser requires to unlock
// audio — so we can start music on the menu without ever touching the game sim.
radioBox.addEventListener('click', function(e){
  if (e && e.target && e.target.closest && e.target.closest('button')) return; // MUTE / SKIP own their click
  if (SFX.ctx && SFX.ctx.state === 'suspended') { try { SFX.ctx.resume(); } catch (err) {} }
  SFX.radioStart(); // idempotent: a no-op once the station is already on air

// ==================== VOICE SYNTHESIS (queue-managed) ====================
// Every NPC speaks with a GENDERED American (en-US) voice: male voices for the
// worker and the male NPCs, female voices for the ladies. Browsers ship a handful
// of voices (no true "NYC" voice exists in Web TTS), so we pick en-US voices and
// lean on phonetic New York phrasing for the flavor. When a device only has a
// single voice, we fall back to it and nudge the pitch so genders still read.
const WORKER_GENDER = 'male';   // the sanitation worker is a guy
const Voice = {
  enabled: typeof window !== 'undefined' && 'speechSynthesis' in window,
  busy: false, queue: [], last: {},
  _male: [], _female: [], _any: [],
  maleSel: 'auto', femaleSel: 'auto',   // player-picked voice names ('auto' = pick by gender)
  // NOTE: (text, gap, pitch, bx, by, gender) — speaker coords stay 4th/5th so every
  // pre-existing call site keeps working; the 6th arg (gender) is optional.
  say(text, gap, pitch, bx, by, gender){
    if (!this.enabled) return;
    const now = performance.now();
    gap = gap || 1.4;
    if (this.last[text] && now - this.last[text] < gap * 1000) return;
    this.last[text] = now;
    // Most-recent action wins: if something is speaking, cut it off and drop the
    // queued backlog so the new line starts immediately instead of playing last.
    const interrupt = this.busy;
    if (interrupt){
      this.busy = false;
      this.queue.length = 0;
      try { window.speechSynthesis.cancel(); } catch (e) {}
    }
    this.queue.push({ text: text, pitch: pitch || 0.8, bx: bx, by: by, gender: gender || null });
    if (interrupt) setTimeout(() => this.pump(), 60); // delay dodges the Chrome cancel/speak race that can double-play a line
    else this.pump();
  },
  // Classify an en-US voice by gender from common TTS voice names (the Web Speech
  // API exposes no gender property, so the name is the only reliable signal).
  _classify(v){
    const n = (v && v.name ? v.name : '').toLowerCase();
    if (!n) return 'neutral';
    const MALE = ['david','mark','george','james','alex','guy','eric','fred','matt','andrew','brian','thomas','william','harry','oliver','noah','liam','ethan','daniel','matthew','joseph','charles','henry','edward','benjamin','samuel','nathan','rishi','ravi','arun','dave','stewart','ryan','nicky','christopher','jason','kevin','bryan'];
    const FEMALE = ['zira','susan','samantha','moira','tessa','karen','celia','fiona','victoria','heera','jenny','kate','linda','hazel','lucy','siri','aria','zoe','ivy','bella','laura','clara','emily','olivia','ava','chloe','michelle','jessica','elizabeth','catherine','diana','maria','sarah','jennifer','amanda','rebecca','carol','donna','gail','june','norma','penny','rosetta','yana','salli','kathy','amy','emma','grace','heather','julia','kelly','megan','nicole','patricia','rachel'];
    for (let i = 0; i < MALE.length; i++) if (n.indexOf(MALE[i]) >= 0) return 'male';
    for (let i = 0; i < FEMALE.length; i++) if (n.indexOf(FEMALE[i]) >= 0) return 'female';
    return 'neutral';
  },
  // Build the gendered pools from whatever American voices this device exposes.
  _refresh(){
    let vs = [];
    try { vs = window.speechSynthesis.getVoices() || []; } catch (e) {}
    const am = vs.filter(v => v.lang && (v.lang.indexOf('en-US') === 0 || v.lang.indexOf('en_US') === 0));
    const en = vs.filter(v => v.lang && v.lang.indexOf('en') === 0);
    const pool = am.length ? am : en;      // prefer American; fall back to any English
    this._male = []; this._female = []; this._any = pool.slice(0, 1);
    for (let i = 0; i < pool.length; i++){
      const g = this._classify(pool[i]);
      if (g === 'male') this._male.push(pool[i]);
      else if (g === 'female') this._female.push(pool[i]);
    }
  },
  // Player voice preferences (persisted) — the VOICE panel lets anyone pick the
  // exact voice each gender uses, on any machine.
  _loadPrefs(){
    this.maleSel = 'auto'; this.femaleSel = 'auto';
    try {
      if (typeof localStorage === 'undefined') return;
      const j = JSON.parse(localStorage.getItem('dsnboy.voice') || '{}');
      if (j && j.male) this.maleSel = j.male;
      if (j && j.female) this.femaleSel = j.female;
    } catch (e) {}
  },
  _savePrefs(){
    try { if (typeof localStorage !== 'undefined') localStorage.setItem('dsnboy.voice', JSON.stringify({ male: this.maleSel, female: this.femaleSel })); } catch (e) {}
  },
  setMale(name){ this.maleSel = name || 'auto'; this._savePrefs(); },
  setFemale(name){ this.femaleSel = name || 'auto'; this._savePrefs(); },
  _pickVoice(gender){
    // An explicit player pick always wins; a voice no longer on the machine falls through to auto.
    if (gender === 'male' || gender === 'female'){
      const sel = (gender === 'male' ? this.maleSel : this.femaleSel);
      if (sel && sel !== 'auto'){
        let all = [];
        try { all = window.speechSynthesis.getVoices() || []; } catch (e) {}
        const v = all.find(x => x.name === sel);
        if (v) return { v: v, matched: this._classify(v) === gender };   // mismatched gender still gets the deep/high pitch
      }
    }
    if (gender === 'male' && this._male.length) return { v: this._male[0], matched: true };
    if (gender === 'female' && this._female.length) return { v: this._female[0], matched: true };
    return { v: (this._any[0] || null), matched: false };
  },
  pump(){
    if (this.busy || !this.queue.length || !this.enabled) return;
    const item = this.queue.shift();
    this._refresh();
    const u = new SpeechSynthesisUtterance(item.text);
    const callerPitch = item.pitch;
    const sel = this._pickVoice(item.gender);
    if (sel.v) u.voice = sel.v;
    // No matching-gender voice (or a deliberately mismatched manual pick)? Bend the
    // pitch hard: male lines drop to a clearly deeper range, female lines rise.
    u.pitch = (item.gender && !sel.matched)
      ? (item.gender === 'male' ? Math.max(0.5, callerPitch * 0.7) : Math.min(2, callerPitch * 1.22))
      : callerPitch;
    u.rate = 1.08; // fixed, sane rate — never trust caller-supplied values (Chrome stutters/repeats at bad rates)
    // Duck the synthesized voice under the radio when the station is on air and NOT muted;
    // with the radio muted (or off) the voice plays at full volume.
    u.volume = (SFX.radioEl && !SFX.radioEl.paused && !SFX.radioMuted) ? 0.42 : 0.95;
    u.onend = () => { this.busy = false; setTimeout(() => this.pump(), 140); };
    u.onerror = () => { this.busy = false; setTimeout(() => this.pump(), 140); };
    this.busy = true;
    try {
      window.speechSynthesis.speak(u);
      if (item.bx !== undefined) spawnBubble(item.text, item.bx, item.by); // comic bubble over the speaker
    } catch (e) { this.busy = false; }
  },
  cancel(){
    this.queue.length = 0;
    this.busy = false;
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }
};

// ==================== FBX 3D ASSET PIPELINE (DSNY truck / can / bag) ====================
// truck.fbx is a POSED asset: it is NOT axis-aligned in native space, so instead of a fixed axis
// permutation we SOLVE each asset's orientation from its own geometry (wheels / lid / base) at load
// time and store a per-asset rotation matrix on the template (tpl.orient). The game uses X = route
// (front +X, rear -X), Y = lateral, Z = up. Verified in node against the real truck.fbx: the truck
// stands upright (L 7.33 > H 2.99), grounded, hopper at -X (rear), front at +X.
const TRUCK_SCALE = 0.4394, CAN_SCALE = 0.325, BAG_SCALE = 0.24;
let FBX_TPL = { truck: null, can: null, bag: null };

function fbxFind(root, re){ let r = null; root.traverse(o => { if (o.name && re.test(o.name) && (!r || r.name.length < o.name.length)) r = o; }); return r; }

function partBox(obj, re){
  const o = fbxFind(obj, re);
  if (!o) return null;
  o.updateWorldMatrix(true, true);
  return new THREE.Box3().setFromObject(o);
}
function partCenter(obj, re){ const b = partBox(obj, re); return b ? b.getCenter(new THREE.Vector3()) : null; }

// Rotation matrix (native->game) mapping native 'front'->+X, 'right'->+Y, 'up'->+Z (as rows, det +1).
function rotFromUpFront(up, front){
  up = up.clone().normalize();
  front = front ? front.clone() : new THREE.Vector3();
  if (front.lengthSq() > 1e-10) front.addScaledVector(up, -up.dot(front)); // drop the up component
  if (front.lengthSq() < 1e-10){
    const a = Math.abs(up.y) < 0.99 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
    front.crossVectors(up, a);
  }
  front.normalize();
  const right = new THREE.Vector3().crossVectors(up, front).normalize();
  return new THREE.Matrix4().set(
    front.x, front.y, front.z, 0,
    right.x, right.y, right.z, 0,
    up.x, up.y, up.z, 0,
    0, 0, 0, 1
  );
}
// Generic fallback: UP = the asset's longest axis (used for the bag and any part-less asset).
function defaultOrient(tpl){
  tpl.updateWorldMatrix(true, true);
  const s = new THREE.Box3().setFromObject(tpl).getSize(new THREE.Vector3());
  const up = new THREE.Vector3(); up.setComponent([s.x, s.y, s.z].indexOf(Math.max(s.x, s.y, s.z)), 1);
  return rotFromUpFront(up, null);
}
// TRUCK: UP = thinnest axis of the wheel cloud; FRONT = centroid(front wheels) - centroid(rear wheels).
function orientTruck(tpl){
  const wheels = [];
  tpl.updateWorldMatrix(true, true);
  tpl.traverse(o => { if (o.isMesh && o.name && /wheel/i.test(o.name)) wheels.push(o); });
  if (wheels.length){
    const box = new THREE.Box3();
    wheels.forEach(w => { w.updateWorldMatrix(true, true); box.union(new THREE.Box3().setFromObject(w)); });
    const sp = [box.max.x - box.min.x, box.max.y - box.min.y, box.max.z - box.min.z];
    const up = new THREE.Vector3(); up.setComponent(sp.indexOf(Math.min(...sp)), 1);
    let F = new THREE.Vector3(), R = new THREE.Vector3(), nf = 0, nr = 0;
    wheels.forEach(w => {
      const c = new THREE.Box3().setFromObject(w).getCenter(new THREE.Vector3());
      if (/front/i.test(w.name)){ F.add(c); nf++; }
      else if (/rear/i.test(w.name)){ R.add(c); nr++; }
    });
    if (nf) F.multiplyScalar(1/nf);
    if (nr) R.multiplyScalar(1/nr);
    return rotFromUpFront(up, (nf && nr) ? F.sub(R) : null);
  }
  return defaultOrient(tpl);
}
// CAN: UP = lid center - base center (a bin standing on its base).
function orientCan(tpl){
  const lid = partCenter(tpl, /lid/i);
  const base = partCenter(tpl, /bin_base/i);
  if (lid && base) return rotFromUpFront(lid.clone().sub(base), null);
  return defaultOrient(tpl);
}

// Deep-clone a group into a fully independent, self-contained copy (own geo + materials),
// baking its FULL world transform so it has no dependency on the source scene graph.
function fbxExtract(src){
  src.updateWorldMatrix(true, true);
  const world = new THREE.Matrix4().copy(src.matrixWorld);
  const c = src.clone();
  c.position.setFromMatrixPosition(world);
  c.quaternion.setFromRotationMatrix(world);
  c.scale.setFromMatrixScale(world);
  c.traverse(o => {
    if (!o.isMesh) return;
    if (o.geometry) o.geometry = o.geometry.clone();
    if (o.material){ const ms = Array.isArray(o.material) ? o.material : [o.material]; o.material = (ms.length === 1 ? ms[0].clone() : ms.map(m => m.clone())); }
  });
  return c;
}

// Turn a template into an independent, oriented, grounded, game-sized instance (origin at
// center-bottom, local z=0 at the ground). Every mesh gets its own geometry+material so
// disposeObj() on this instance never touches the shared template.
function fbxInstance(tpl, scale){
  const c = tpl.clone();
  const rotGrp = new THREE.Group();
  rotGrp.quaternion.setFromRotationMatrix(tpl.orient || new THREE.Matrix4());
  rotGrp.scale.setScalar(scale);
  rotGrp.add(c);
  const holder = new THREE.Group();
  holder.add(rotGrp);
  holder.updateWorldMatrix(true, true);
  const box = new THREE.Box3().setFromObject(rotGrp);
  const ctr = box.getCenter(new THREE.Vector3());
  rotGrp.position.set(-ctr.x, -ctr.y, -box.min.z); // center XY, bottom -> local z=0
  holder.updateWorldMatrix(true, true);
  holder.traverse(o => {
    if (!o.isMesh) return;
    if (o.geometry) o.geometry = o.geometry.clone();
    if (o.material){ const ms = Array.isArray(o.material) ? o.material : [o.material]; o.material = (ms.length === 1 ? ms[0].clone() : ms.map(m => m.clone())); }
    o.castShadow = true; o.receiveShadow = true;
  });
  return holder;
}

// Load truck.fbx once and extract the three named asset groups into FBX_TPL.
function loadFbxTemplates(){
  if (FBX_TPL.truck) return Promise.resolve(true);
  if (typeof THREE.FBXLoader === 'undefined') return Promise.reject(new Error('FBXLoader not available'));
  return new Promise((resolve, reject) => {
    new THREE.FBXLoader().load('truck.fbx', (root) => {
      try {
        const truck = fbxFind(root, /garbageTruck_geo_grp/i);
        const can   = fbxFind(root, /garbageBin_geo_grp/i);
        const bag   = fbxFind(root, /truck_trash_grp/i) || fbxFind(root, /trash_bag_side_ply$/i);
        if (!truck || !can || !bag) throw new Error('FBX asset groups not found');
        FBX_TPL.truck = fbxExtract(truck); FBX_TPL.truck.orient = orientTruck(FBX_TPL.truck);
        FBX_TPL.can   = fbxExtract(can);   FBX_TPL.can.orient   = orientCan(FBX_TPL.can);
        FBX_TPL.bag   = fbxExtract(bag);   FBX_TPL.bag.orient   = defaultOrient(FBX_TPL.bag);
        root.traverse(o => { if (o.isMesh && o.geometry) o.geometry.dispose(); });
        resolve(true);
      } catch (e){ console.error('[FBX] template build failed:', e); reject(e); }
    }, undefined, (err) => { console.error('[FBX] load failed:', err); reject(err); });
  });
}
// ==================== GLTF 3D TRAFFIC CAR PIPELINE (car.glb) ====================

// X = route forward, Y = lateral, Z = up, so a +90° rotation about Z

function loadCarGltf(){
  if (CAR_TPL) return Promise.resolve(true);
  if (typeof THREE.GLTFLoader === 'undefined') return Promise.reject(new Error('GLTFLoader not available'));
  return new Promise((resolve, reject) => {
    new THREE.GLTFLoader().load('car.glb', (gltf) => {
      try {
        const model = gltf.scene;
        model.traverse(o => {

            mats.forEach(m => { m.metalness = 0.15; m.roughness = 0.5; }); // tame the metallic PBR defaults

function makeCarGltf(colorHex){
  const g = new THREE.Group();
  const model = CAR_TPL.template.clone(true);
  model.traverse(o => {
    if (o.isMesh && o.material && o.material.name === 'Body'){
      // clone so every car keeps its OWN paint color (instances share the template otherwise)
      o.material = o.material.clone();
      o.material.color.setHex(colorHex);
    }
  });
  model.rotation.z = Math.PI / 2; // native front (-Y) → game forward (+X), rear → -X, Z stays up
  model.scale.setScalar(CAR_SCALE);
  g.add(model);
  g.userData.isGltfCar = true;
  return g;
}
function rebuildCarsFromGltf(){
  if (!CAR_TPL) return;
  for (let i = 0; i < creatures.length; i++){
    const c = creatures[i];
    if (c.type !== 'car' || !c.g) continue;
    const old = c.g;
    if (old.parent) old.parent.remove(old);
    if (!old.userData.isGltfCar) disposeObj(old); // procedural fallback had private geometry; GLTF shares template resources
    c.g = makeCarGltf(c.colorHex || pick(CAR_COLORS));
    c.g.position.set(c.wx, c.wy, GZ);

// ==================== DSNY COLLECTION TRUCK ====================
function buildTruck(){

  if (FBX_TPL.truck){
    const g = fbxInstance(FBX_TPL.truck, TRUCK_SCALE);

    // (world-space vertices), not from the loose outer bounding box:
    //  - boxL: full x-extent (front bumper -> rear scoop)
    //  - boxW: the solid BODY's lateral reach at street height (z < 1.6). The cab
    //    mirrors overhang to ~2.7 but float at z 1.5-2.5; using the outer box put an
    //    invisible collision wall ~0.7u out in the road, stopping the worker and the
    //    curb-side cars long before they reached the truck's real 3D side.
    //    Measured from truck.fbx: street-height body reach ≈ 2.25 (outer box ≈ 2.93).
    let tMaxX = 0, tMinX = 0, tStreet = 0;

      if (!o.isMesh || !o.geometry || !o.geometry.attributes.position) return;
      const pos = o.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++){
        _v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
        if (_v.x > tMaxX) tMaxX = _v.x;
        if (_v.x < tMinX) tMinX = _v.x;

    const hopperY = -0.5;           // nudged to the right side of the scoop

  const grille = BX(0.12, 1.1, 0.55, M(0x2b3036)); grille.position.set(3.13, 0, 0.65); g.add(grille);
  const mir1 = BX(0.06, 0.22, 0.3, M(0x33383e)); mir1.position.set(2.85, 0, 1.72); g.add(mir1);
  const mir2 = BX(0.06, 0.22, 0.3, M(0x33383e)); mir2.position.set(2.85, 0, -1.72); g.add(mir2);
  const body = BX(5.4, 2.0, 1.9, M(0xdfe5ea)); body.position.set(-1.3, 0, 1.25); g.add(body);
  const bstripe = BX(5.44, 1.94, 0.3, green); bstripe.position.set(-1.3, 0, 0.62); g.add(bstripe);
  // rear hopper (collection trigger zone at the back bumper)
  const hopper = BX(1.5, 1.3, 1.65, M(0x23262b)); hopper.position.set(-4.3, 0, 1.35); g.add(hopper);
  const rim = BX(1.55, 1.7, 0.2, M(0x99a3ac)); rim.position.set(-4.3, 0, 2.02); g.add(rim);
  const blade = BX(0.35, 1.0, 1.35, M(0x59616a)); blade.position.set(-4.7, 0, 1.05); g.add(blade); // hydraulic packer blade
  const wheelM = M(0x14171a);

// ==================== HOPPER TRASH PILE & CYCLE ====================
// The truck is heavy: it never bounces when loaded. Instead, each deposited bag/can
// visibly piles up in the rear hopper. After HOPPER_CYCLE_AT items the hopper "cycles" —
// the pile shrinks + fades away (compacted/loaded), the worker scores a bonus, jingle plays.
const HOPPER_CYCLE_AT = 5, HOPPER_CYCLE_DUR = 0.75, HOPPER_CYCLE_BONUS = 200;
function hopperWorldX(){ return truck.wx + (truck.hopperOff != null ? truck.hopperOff : -4.3); }
function hopperWorldY(){ return -4.5 + (truck.hopperY != null ? truck.hopperY : 0); }
function hopperTopZ(){ return (truck.hopperZ != null ? truck.hopperZ : 2.4); }
function addHopperLump(){
  if (!hopperTrash){ hopperTrash = new THREE.Group(); worldGroup.add(hopperTrash); }
  const idx = hopperLoad; // 1..HOPPER_CYCLE_AT
  const palette = [0x23272e, 0x1b1f24, 0x2c3138, 0x30363d, 0x3a4048, 0x454b52];
  const mat = M(palette[(Math.random() * palette.length) | 0], { transparent: true, opacity: 1 });
  const g = new THREE.Group();
  const body = SP(0.4, mat); body.scale.set(1.1, 0.9, 1.2); g.add(body);
  const neck = CY(0.14, 0.19, 0.22, mat); neck.position.z = 0.44; g.add(neck);
  const knot = SP(0.13, mat, 6); knot.position.z = 0.58; g.add(knot);
  // Pile the bag INSIDE the open rear scoop (not on the roof): low base height,
  // spreading out and stacking a little higher with each deposit.
  const localX = R(-0.3, 0.5);
  const localY = R(-0.5, 0.5);
  const localZ = hopperTopZ() + Math.min(idx, HOPPER_CYCLE_AT) * 0.22 + R(-0.05, 0.05);
  g.position.set(localX, localY, localZ);
  g.rotation.z = R(-0.5, 0.5);
  const baseScale = R(0.9, 1.2);
  g.scale.setScalar(baseScale);
  hopperTrash.add(g);
  hopperLumps.push({ g: g, mat: mat, baseScale: baseScale, baseX: localX, baseZ: localZ });
}
function hopperDeposit(){
  if (hopperCycling) return; // mid-cycle (emptying) — skip buildup this time
  hopperLoad++;
  addHopperLump();
  if (hopperLoad >= HOPPER_CYCLE_AT){ hopperCycling = true; hopperCycleT = HOPPER_CYCLE_DUR; }
}
function clearHopperTrash(){
  if (!hopperTrash){ hopperLumps.length = 0; return; } // nothing has been deposited yet
  if (hopperTrash.parent) hopperTrash.parent.remove(hopperTrash);
  disposeObj(hopperTrash);
  hopperTrash = null;
  hopperLumps.length = 0;
}
function finishHopperCycle(){
  clearHopperTrash();
  hopperLoad = 0;
  hopperCycling = false;
  addScore(HOPPER_CYCLE_BONUS, true);
  SFX.playHopperJingle();
  Voice.say('Hopper full, compacting!', 2.5, 0.9, p.wx, p.wy, WORKER_GENDER);
}
function updateHopperTrash(dt){
  if (!hopperTrash || hopperLumps.length === 0) return;
  hopperTrash.position.set(hopperWorldX(), hopperWorldY(), GZ); // keep the pile planted in the rear hopper
  if (hopperCycling){
    hopperCycleT -= dt;
    const k = Math.max(0, hopperCycleT / HOPPER_CYCLE_DUR); // 1 -> 0
    for (let i = 0; i < hopperLumps.length; i++){
      const L = hopperLumps[i];
      L.g.scale.setScalar(Math.max(0.0001, L.baseScale * k));   // get smaller
      L.g.position.z = L.baseZ * (0.5 + 0.5 * k);               // sink toward the floor
      L.g.position.x = L.baseX + (1 - k) * 0.5;                 // slide forward into the compactor
      L.mat.opacity = k;                                        // fade out
    }
    if (hopperCycleT <= 0) finishHopperCycle();
  }
}

function addCreature(type){
  const c = { type: type, wx: R(-58, 58), wy: 6, vx: 1, phase: R(0, 6.28), cd: R(1, 4), flee: 0, data: null };
  // Gender of the voice used when this NPC speaks (male/female/neutral):
  //   ped=man, lady=woman, breaker=man, yeller=man, jacker/skater/escooter=men,
  //   hooker=woman, dogwalker=mixed, car/moto/bike/ebike/tric/rc = the
  //   driver/rider (mixed), animals = neutral
  const MIXED = () => (Math.random() < 0.5 ? 'male' : 'female');
  if (type === 'lady' || type === 'hooker') c.gender = 'female';
  else if (type === 'ped' || type === 'breaker' || type === 'yeller' || type === 'jacker' || type === 'skater' || type === 'escooter') c.gender = 'male';
  else if (type === 'dogwalker' || type === 'car' || type === 'moto' || type === 'bike' || type === 'ebike' || type === 'tric' || type === 'rc') c.gender = MIXED();
  else c.gender = null; // animals & birds (incl. the leashed dog): no human gender
  switch (type){
    case 'ped':   c.wy = R(1, 4); c.sp = R(1.0, 2.2); c.data = makePerson({ shirt: pick(SHIRTS), pants: pick(PANTS), hair: pick(HAIRS) }); break;
    case 'lady':  c.wy = R(1, 4); c.sp = R(1.2, 2.4); c.data = makePerson({ skirt: true, shirt: pick(DRESSES), hair: pick(HAIRS) }); break;
    case 'rat':   c.wy = R(0.6, 1.8); c.sp = R(4.5, 6); c.dir = Math.random() < 0.5 ? -1 : 1; c.data = makeRat(); break;
    case 'raccoon': c.wy = R(1, 7); c.sp = 3.2; c.t = 0; c.tx = c.wx + 5; c.ty = R(1, 7.5); c.data = makeRaccoon(); break;
    case 'squirrel': c.wy = 6.5; c.sp = R(4, 5.5); c.data = makeSquirrel(); break;
    case 'pigeon': c.peck = R(0, 6.28); c.gz = 0; c.flyT = 0; c.fleeAng = 0;
                   c.data = makePigeon(); c.wingL = c.data.userData.wingL; c.wingR = c.data.userData.wingR; break;
    case 'tric':  c.wy = R(1.2, 4.2); c.sp = R(1.5, 2.5); c.stop = R(0, 4); c.curSp = 0; c.targetWy = c.wy;
                  c.boxW = 0.38; c.boxL = 0.7; c.data = makeTricycle(); break;
    case 'dogwalker': c.wy = R(1.0, 4.0); c.sp = R(0.9, 1.8); c.data = makeDogWalker(); break;
    case 'rc':    c.wy = R(1, 4); c.sp = R(6, 9); c.dir = 1; c.flip = R(0.4, 1); c.curSp = 0; c.targetWy = c.wy;
                  c.boxW = 0.25; c.boxL = 0.3; c.data = makeRC(); break;
    case 'bike':  c.wy = R(-2.4, -0.3); c.sp = R(8, 9.5); c.curSp = 0; c.targetWy = c.wy; c._naturalLane = (c.wy > -1.2) ? 0.5 : -8.5;
                  c.boxW = 0.25; c.boxL = 0.6; c.data = makeBicycle(false); break;
    case 'ebike': c.wy = R(-2.4, -0.3); c.sp = R(10, 12); c.curSp = 0; c.targetWy = c.wy;
                  // Assign lateral spread target based on initial Y to prevent bunching
                  c._naturalLane = (c.wy > -1.2) ? 0.5 : -8.5; // curb side vs outer road lane
                  c.boxW = 0.25; c.boxL = 0.6; c.data = makeBicycle(true); break;
    case 'moto':  c.wy = R(-6.5, -3.5); c.sp = R(12, 14); c.curSp = 0; c.targetWy = c.wy;
                  c.boxW = 0.35; c.boxL = 0.9; c.data = makeMoto(); break;
    case 'car':   c.wy = R(-3, -7.5); c.sp = R(10, 13); c.sway = R(0, 6.28); c.curSp = 0; c.targetWy = c.wy;
                  c.boxW = 1.19; c.boxL = 2.66; c.colorHex = pick(CAR_COLORS); c.data = makeCar(c.colorHex); break;
    case 'breaker': c.wy = R(1.2, 4.2); c.spin = 0; c.rest = R(0, 1.5); c.data = makePerson({ shirt: pick(SHIRTS), pants: 0x23262b, cap: true, hair: pick(HAIRS) }); break;
    case 'yeller': c.wy = R(1.2, 4.2); c.sp = R(0.25, 0.4); c.shout = R(2, 8); c.data = makePerson({ shirt: pick(SHIRTS), hoodie: true, hair: pick(HAIRS), fold: 1.05 }); break; // VERY slow shamble (pedestrians are 1.0-2.2); fold: chest folds ~60° forward at the hips
    case 'jacker': c.wy = R(1.2, 4.2); c.hamT = R(0, 6.28); c.gravCd = R(0.3, 0.8);
                 c.data = makeJacker(); c.hammer = c.data.userData.hammer; break;
    case 'hooker': c.wy = R(1.2, 4.2); c.swayT = R(0, 6.28); c.data = makeHooker(); break;
    case 'skater': c.wy = R(4.3, 4.9); c.trickT = R(0.4, 1.4); c.flipT = 0; // curb edge, out of the main walking line
                 c.data = makeSkater(); c.board = c.data.userData.board; break;
    case 'escooter': c.wy = R(1.4, 3.8); c.sp = R(2.4, 3.4);
                 c.data = makeEScooter(); c.wheelF = c.data.userData.wheelF; c.wheelR = c.data.userData.wheelR; break;
    case 'leashdog':{
      // dog + doghouse + chain: the anchor is the stake at the doghouse (front
      // lawn, in front of a house). spawnWorld re-places it right after.
      const dg = makeHighPolyDog();
      c.data = dg;
      c.houseG = makeDogHouse();
      c.chain = new THREE.Mesh(new THREE.BoxGeometry(1, 0.07, 0.05), MS(0xb0b8c0)); // chunky metal chain - must read at distance
      c.chainR = 2.3;
      c.anchorX = 0; c.anchorY = 7.6;
      c.homeX = 0.6; c.homeY = 6.3;
      c.wx = c.homeX; c.wy = c.homeY;
      c.agro = 0; c.barkCd = 0;
      break;
    }
  }
  const isPerson = c.data && c.data.g && c.data.legL;
  c.vcd = 0; // voice cooldown — MUST start at 0 (undefined would make "c.vcd <= 0" always false and mute all bump lines)
  c.g = isPerson ? c.data.g : c.data;
  c.parts = c.g.userData && c.g.userData.parts ? c.g.userData.parts : null;
  c.dogParts = c.g.userData && c.g.userData.dog ? c.g.userData.dog : null;
  // fentanyl addict: legs stand UPRIGHT, the chest folds ~60° forward at the hips
  // (baked into makePerson via fold), and the arms are counter-rotated so they
  // hang STRAIGHT DOWN to the knees (re-applied every frame in the yeller update
  // case, because the shuffling leg-swing would otherwise reset the arms)
  if (c.parts && (type === 'yeller')){ c.parts.armL.rotation.y = -1.05; c.parts.armR.rotation.y = -1.05; }
  // new sidewalk regulars: set their idle facing (jacker grinds at an angle,
  // hooker stands facing the street)
  if (type === 'jacker') c.g.rotation.z = R(-0.55, 0.55);
  if (type === 'hooker') c.g.rotation.z = -Math.PI / 2;
  c.g.position.set(c.wx, c.wy, GZ);
  dynamicGroup.add(c.g);
  if (c.seed) dynamicGroup.add(c.seed); // the pigeon's seed scatter stays with the world
  creatures.push(c);
  return c; // callers (e.g. the pigeon-flock spawner) reposition the creature right after
}

function makeBlockContents(b, baseX){

  b.hazards = [];

  hg.position.y = 10.5;
  b.group.add(hg);
  const house = { serviced: false, lamp: hg.userData.lamp, bags: [], can: null };
  b.house = house;
  // curb trash layout (every house has something to collect)
  const r = Math.random();
  let nBags = 0, hasCan = false;
  if (r < 0.40) nBags = 1;
  else if (r < 0.70) nBags = 2;
  else if (r < 0.86){ nBags = 1; hasCan = true; }
  else hasCan = true;
  if (nBags === 2){
    makeCurbBag(baseX + R(1.5, 3), R(1.0, 2.4), house);
    makeCurbBag(baseX + R(4.8, 6.6), R(1.0, 2.4), house);
  } else if (nBags === 1){
    makeCurbBag(baseX + R(2, 6), R(1.0, 2.4), house);
  }
  if (hasCan) house.can = makeCurbCan(baseX + R(2, 6), R(1.0, 2.2), house);
  // pre-spawned bonus (copper / street cash / treasure) placed in the world from the start
  if (Math.random() < 0.40) spawnBonus(baseX + R(1.5, 6.0), R(-1.0, 1.5));
  // lane markings & sidewalk joints (scroll with the block)
  const dashM = M(0xcfd5da);
  for (let i = 0; i < 2; i++){

    dash.position.set(2 + i * 4, -4.5, 0.31);
    b.group.add(dash);
  }
  // sidewalk expansion joint — must stay ON the concrete (wy 0.5..5.0);
  // the old 7.6u length spilled out into the street AND the grass
  const joint = new THREE.Mesh(new THREE.BoxGeometry(0.1, 4.4, 0.03), M(0x79818a));
  joint.position.set(0.2, 2.75, 0.31);
  b.group.add(joint);
  // static hazards

  if (hr < 0.28) addBottles(b, baseX + R(1, 6), R(1.5, 4.5));
  else if (hr < 0.46) addPothole(b, baseX + R(1.5, 6), R(-8, -3));
  else if (hr < 0.58) addHydrant(b, baseX + R(1.5, 6), 0.8);
  else if (hr < 0.68) addManhole(b, baseX + R(1.5, 6), R(-7.5, -3.5));
  // loose food wrappers on the street next to the sidewalk (litter dressing)
  if (Math.random() < 0.65) addWrapper(b, baseX + R(1, 6), R(-2.5, -0.7));
  // random dog shit piles on the sidewalk (kept RARE; on the concrete only)
  if (Math.random() < 0.15) addDogShit(b, baseX + R(1, 6), R(1.2, 4.8));
  // sidewalk trees
  if (Math.random() < 0.5){
    const t = makeTree();
    t.position.set(R(1, 6), R(6, 7.5), 0);
    b.group.add(t);
  }
}
function spawnWorld(){
  for (let i = 0; i < NB; i++){
    const g = new THREE.Group();
    const worldX = p.wx - TILE / 2 + i * BW;
    const b = { group: g, worldX: worldX, house: null, hazards: [] };
    g.position.x = worldX;
    dynamicGroup.add(g);
    makeBlockContents(b, worldX);
    blocks.push(b);
  }
  const counts = { ped: 2, lady: 1, rat: 5, raccoon: 1, squirrel: 2, tric: 2, rc: 1, bike: 1, ebike: 1, moto: 1, car: 2, breaker: 2, yeller: 2, dogwalker: 2, jacker: 1, hooker: 1, skater: 1, escooter: 1 };
  for (const t in counts) for (let i = 0; i < counts[t]; i++) addCreature(t);
  // Leashed dog: the doghouse sits on the front lawn, right in front of a house.
  // The dog barks and lunges at the worker but the chain limits how far it gets.
  const ld = addCreature('leashdog');
  {
    const b = blocks[(Math.random() * blocks.length) | 0];
    ld.anchorX = b.worldX + R(-1.0, 2.0);   // lawn strip (y 5..8.5), house front is y 10.5
    ld.anchorY = R(7.4, 8.2);
    ld.homeX = ld.anchorX + R(-0.4, 0.8);
    ld.homeY = ld.anchorY - R(0.9, 1.5);
    ld.wx = ld.homeX; ld.wy = ld.homeY;
    ld.houseG.position.set(ld.anchorX, ld.anchorY, GZ);
    dynamicGroup.add(ld.houseG);
    const cl0 = Math.sqrt((ld.anchorX - ld.wx) ** 2 + (ld.anchorY - ld.wy) ** 2);
    ld.chain.scale.x = Math.max(0.02, cl0);
    ld.chain.position.set((ld.anchorX + ld.wx) / 2, (ld.anchorY + ld.wy) / 2, 0.38); // above the grass surface
    ld.chain.rotation.z = Math.atan2(ld.anchorY - ld.wy, ld.anchorX - ld.wx);
    dynamicGroup.add(ld.chain);
    ld.g.rotation.z = Math.atan2(ld.homeY - ld.anchorY, ld.homeX - ld.anchorX); // resting, street-facing
  }
  // pigeon flocks: TWO flocks, 1-3 birds each (random), each clustered on its own
  // shared seed spot; every bird scatters on its own random heading when shooed
  for (let fI = 0; fI < 2; fI++){
    const flock = 1 + ((Math.random() * 3) | 0);
    const fpx = R(-45, 55), fpy = R(1.5, 4.4);
    const fsd = makeSeedScatter();
    fsd.position.set(fpx, fpy, GZ);
    dynamicGroup.add(fsd);
    for (let bI = 0; bI < flock; bI++){
      const c = addCreature('pigeon');
      c.wx = fpx + R(-0.55, 0.55); c.wy = fpy + R(-0.4, 0.4);
      c.g.position.set(c.wx, c.wy, GZ);
    }
  }
}
function recycleBlock(b){
  const h = b.house;
  if (h && !h.serviced){
    const inFlight = h.bags.some(x => x.state === 'carried') || (h.can && (h.can.state === 'carried' || h.can.state === 'carriedEmpty'));
    if (inFlight){ h.pending = 1; pendingHouses.push(h); }
    else addWriteUp();
  }
  if (h){
    for (let i = 0; i < h.bags.length; i++){
      const bag = h.bags[i];
      if (bag.state === 'curb' && bag.g.parent){ bag.g.parent.remove(bag.g); disposeObj(bag.g); }
    }
    if (h.can && (h.can.state === 'curb' || h.can.state === 'droppedEmpty') && h.can.g && h.can.g.parent){
      h.can.g.parent.remove(h.can.g);
      disposeObj(h.can.g);
    }
  }
}
function updateBlocks(dt){
  for (let i = 0; i < blocks.length; i++){
    const b = blocks[i];
    if (b.worldX - p.wx < -TILE / 2){
      recycleBlock(b);
      b.worldX += TILE;
      b.group.position.x = b.worldX;
      makeBlockContents(b, b.worldX);
    }
  }
  for (let i = pendingHouses.length - 1; i >= 0; i--){
    const h = pendingHouses[i];
    if (h.serviced){ pendingHouses.splice(i, 1); continue; }
    h.pending--;
    if (h.pending <= 0){ pendingHouses.splice(i, 1); addWriteUp(); }
  }
}
// ==================== CLEAN UP LANDED CANS (OFF-SCREEN RECYCLING) ====================
function cleanupLandedCans(){
  for (let i = landedCans.length - 1; i >= 0; i--){
    const lc = landedCans[i];
    if (!lc.g || !lc.g.parent) { 
      // already disposed - remove from array to prevent memory leak
      landedCans.splice(i, 1); 
      continue; 
    }
    // Off-screen behind player
    if (lc.wx < p.wx - 70){
      lc.g.parent.remove(lc.g); disposeObj(lc.g);
      landedCans.splice(i, 1);
    }
    // Off-screen far ahead (shouldn't happen normally, but safety net)
    else if (lc.wx > p.wx + 80){
      lc.g.parent.remove(lc.g); disposeObj(lc.g);
      landedCans.splice(i, 1);
    }
  }
}

  blocks = []; creatures = [];
  spawnWorld();
  truck.wx = p.wx - 8; truck.hidden = 0; truck.g.visible = true;  // start close behind the worker at the route beginning
  $('route').textContent = ROUTES[0];

// ==================== FLYING CAN SYSTEM ====================
function spawnDustEffect(wx, wy){
  const count = 14;
  for (let i = 0; i < count; i++){
    const angle = (i / count) * Math.PI * 2 + R(-0.3, 0.3);
    const speed = 0.6 + R(0, 1.8);
    const g = new THREE.Group();
    // Create small flat dust particles
    const pGeo = new THREE.PlaneGeometry(0.15, 0.15);
    const pMat = new THREE.MeshLambertMaterial({ color: 0x9a9a8a, transparent: true, opacity: 0.7, side: THREE.DoubleSide });
    const pMesh = new THREE.Mesh(pGeo, pMat);
    g.add(pMesh);
    dynamicGroup.add(g);
    dustParticles.push({
      g: g,
      wx: wx,
      wy: wy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      vz: 0.3 + R(0, 1.2), // initial upward velocity
      life: 1.0,
      decay: 0.8 + R(0, 0.6),
      rotSpeed: R(-6, 6)
    });
  }
}
// ==================== CONCRETE GRIT (jackhammer chipping the sidewalk) ====================
function spawnGravelBits(wx, wy){
  // A small shower of concrete fragments at the chisel tip: lots of TINY bits,
  // low and quick, so it reads as the hammer breaking up the concrete without
  // turning into a fireworks show. Rides the dust-particle pipeline.
  const count = 4 + ((Math.random() * 3) | 0);
  for (let i = 0; i < count; i++){
    const size = 0.025 + Math.random() * 0.04;
    const g = new THREE.Group();
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(size, size, size),
      new THREE.MeshLambertMaterial({ color: pick([0x9aa0a8, 0x858b93, 0xb0b6bd]), transparent: true, opacity: 0.95 }));
    g.add(mesh);
    dynamicGroup.add(g);
    dustParticles.push({
      g: g,
      wx: wx, wy: wy,
      vx: R(-1.1, 1.1), vy: R(-1.1, 1.1),
      vz: 0.4 + Math.random() * 1.0,
      life: 0.5 + Math.random() * 0.3,
      decay: 1.5,
      rotSpeed: R(-16, 16) // tumbly little chunks
    });
  }
}
function updateFlyingCans(dt){
  for (let i = flyingCans.length - 1; i >= 0; i--){
    const fc = flyingCans[i];
    fc.progress += dt / fc.duration;
    if (fc.progress >= 1){
      // Landed - check NPC collision and spawn dust at target position
      const hitNPC = checkFlyingCanNpcHit(fc.tx, fc.ty);
      if (hitNPC){
        // Can hits an NPC - they react with a random complaint
        const npcVoices = [
          'Hey! Watch it!',
          'Ow! That hurt!',
          "I'm calling 3-1-1!"
        ];
        Voice.say(npcVoices[(Math.random() * npcVoices.length) | 0], 2.5, 1.1, hitNPC.wx, hitNPC.wy, hitNPC.gender);
        hitNPC.vcd = 3; // longer cooldown so they don't repeat immediately
      } else {
        // Spawn dust effect at landing spot
        spawnDustEffect(fc.tx, fc.ty);
      }
      
      // Mark house as serviced (in case not already done)
      checkHouse(fc.h);
      
      // Lay the can sideways on the sidewalk and make it a persistent solid obstacle
      if (fc.g){
        // GZ + 0.43 raises the group center so the cylinder bottom (at center - 0.425) 
        // rests exactly on the sidewalk surface at GZ, preventing ground clipping
        fc.g.position.set(fc.tx, fc.ty, GZ + 0.43);
        fc.g.rotation.z = R(-0.1, 0.1); // slight random tilt for natural look
        fc.g.rotation.x = Math.PI / 2; // lay flat sideways
        fc.g.visible = true;
      }
      
      // Add to landed cans array for collision
      landedCans.push({ wx: fc.tx, wy: fc.ty, g: fc.g });
      
      // Remove from flyingCans immediately — can persists on sidewalk as solid obstacle
      flyingCans.splice(i, 1);
    } else {
      // Interpolate along parabolic arc from start to target
      const t = fc.progress;
      const easeT = -Math.cos(t * Math.PI) * 0.5 + 0.5; // ease in-out
      const curX = fc.sx + (fc.tx - fc.sx) * easeT;
      const curY = fc.sy + (fc.ty - fc.sy) * easeT;
      // Arc height: peaks at midpoint
      const arcHeight = Math.sin(t * Math.PI) * 3.5;
      if (fc.g){
        fc.g.position.set(curX, curY, GZ + arcHeight);
        // Spin the can during flight
        fc.g.rotation.z += dt * 8;
        fc.g.rotation.x += dt * 3;
        
        // Mid-air NPC collision check
        if (!fc.landed && Math.sin(t * Math.PI) > 0.1){
          const hitNPC = checkFlyingCanNpcHit(curX, curY);
          if (hitNPC){
            const npcVoices = ['Hey! Watch it!', 'Ow! That hurt!', "I'm calling 3-1-1!"];
            Voice.say(npcVoices[(Math.random() * npcVoices.length) | 0], 2.5, 1.1, hitNPC.wx, hitNPC.wy, hitNPC.gender);
            hitNPC.vcd = 3;
          }
        }
      }
    }
  }
}
function checkFlyingCanNpcHit(fcx, fcy){
  for (let i = creatures.length - 1; i >= 0; i--){
    const c = creatures[i];
    if (c.type === 'ped' || c.type === 'lady' || c.type === 'breaker' || c.type === 'yeller' || c.type === 'dogwalker' ||
        c.type === 'jacker' || c.type === 'hooker' || c.type === 'skater' || c.type === 'escooter'){
      const dx = fcx - c.wx, dy = fcy - c.wy;
      if (dx * dx + dy * dy < 0.8){
        return c;
      }
    }
  }
  return null;
}
// ==================== DUST PARTICLE SYSTEM ====================
function updateDustParticles(dt){
  for (let i = dustParticles.length - 1; i >= 0; i--){
    const p = dustParticles[i];
    p.life -= dt * p.decay;
    if (p.life <= 0){
      if (p.g.parent) { p.g.parent.remove(p.g); disposeObj(p.g); }
      dustParticles.splice(i, 1);
      continue;
    }
    p.wx += p.vx * dt;
    p.wy += p.vy * dt;
    p.vz -= dt * 2.5; // gravity pulls dust down
    if (p.g){
      p.g.position.set(p.wx, p.wy, GZ + Math.max(0, p.vz));
      p.g.scale.setScalar(Math.max(0.1, 1 - p.life * 0.5) * (2 - p.life));
      // Fade opacity
      const mesh = p.g.children[0];
      if (mesh && mesh.material){
        mesh.material.opacity = p.life * 0.7;
        mesh.rotation.z += p.rotSpeed * dt;
      }
    }
  }
}
function checkHouse(h){
  if (!h || h.serviced) return;
  const bagsOK = h.bags.every(b => b.state === 'dumped');
  const canOK = !h.can || h.can.state === 'returned' || h.can.state === 'dumped';
  if (bagsOK && canOK){
    h.serviced = true;
    addScore(50);
    if (h.lamp && h.lamp.material){
      h.lamp.material.color.set(0x4dff88);
      h.lamp.material.emissive.set(0x1f7a44);
    }
  }
}

function dropCarried(){

function tryInteract(){
  if (state !== 'play' || p.stunT > 0) return;
  if (nearHopper()){
    if (carry === 'bag') return tossBag(carried);
    if (carry === 'canFull') return dumpCan();
  }
  if (carry === 'none'){
    let best = null, bd = 2.4;
    for (let i = 0; i < blocks.length; i++){
      for (const bag of blocks[i].house.bags){
        if (bag.state !== 'curb') continue;
        const d = dist(bag.wx, bag.wy);
        if (d < bd){ bd = d; best = bag; }
      }
      const c = blocks[i].house.can;
      if (c && (c.state === 'curb' || c.state === 'droppedEmpty')){
        const d = dist(c.wx, c.wy);
        if (d < bd){ bd = d; best = c; }
      }
    }
    if (best) return pickUp(best);
  }
  // shoo nearby critters
  let shooed = false;
  for (let i = 0; i < creatures.length; i++){
    const c = creatures[i];
    if ((c.type === 'rat' || c.type === 'raccoon' || c.type === 'squirrel') && dist(c.wx, c.wy) < 2.8){
      c.flee = 1.6;
      if (c.dir !== undefined) c.dir = c.wx >= p.wx ? 1 : -1;
      shooed = true;
