// ==================== STUN & COLLISION ====================
function doStun(dur, type){
  if (p.stunT > 0) return;
  p.stunT = dur;
  p.stunDur = dur;
  if (type === 'hit'){ SFX.playStun(); p.shake = 0.5; }
  else SFX.playTripSound();
}
function collideStatic(dt){
  if (state !== 'play' || p.invuln > 0 || p.stunT > 0) return;
  for (let i = 0; i < blocks.length; i++){
    for (const hz of blocks[i].hazards){
      hz.cd -= dt;
      if (hz.cd > 0) continue;
      const dx = hz.wx - p.wx, dy = hz.wy - p.wy;
      if (dx * dx + dy * dy > hz.r * hz.r) continue;
      hz.cd = 1.4;
      if (hz.type === 'poop'){
        Voice.say('dog shit!', 2.5, 0.9, p.wx, p.wy, WORKER_GENDER);
        p.poopSteps = 16; footDist = 0; // the worker leaves a brown footprint trail for a while
      } else if (hz.type === 'hit'){
        p.wx -= 0.7;
        doStun(0.8, 'hit');
        Voice.say('OW! My shin!', 3, 0.9, p.wx, p.wy, WORKER_GENDER);
      } else {
        doStun(0.8, 'trip');
        if (hz.yellow) Voice.say('Yuck! Piss bottle!', 3, 0.9, p.wx, p.wy, WORKER_GENDER);
        if (hz.drop > 0 && carry !== 'none' && Math.random() < hz.drop) dropCarried();
      }
      return;
    }
  }
}
// ==================== LANDED CAN COLLISION (SOLID OBSTACLE) ====================
function collideLandedCans(){
  if (state !== 'play' || p.invuln > 0 || p.stunT > 0) return;
  for (let i = landedCans.length - 1; i >= 0; i--){
    const lc = landedCans[i];
    const dx = lc.wx - p.wx, dy = lc.wy - p.wy;
    const d2 = dx * dx + dy * dy;
    if (d2 > 0.85) continue; // collision radius ~0.92
    const d = Math.sqrt(d2) || 0.001;
    const nx = -dx / d, ny = -dy / d; // push outward
    const pen = Math.sqrt(0.85) - d;
    p.wx += nx * (pen + 0.05);
    p.wy = clamp(p.wy + ny * (pen + 0.05), -9.4, 4.5);
  }
}
function collideCreatures(){
  if (state !== 'play' || p.invuln > 0 || p.stunT > 0) return;
  for (let i = 0; i < creatures.length; i++){
    const c = creatures[i];
    if (c.type === 'pigeon') continue; // pigeons scatter and fly away before any contact — no bump collision
    if (c.type === 'leashdog') continue; // chained to its lawn; the worker's lane never reaches it
    const dx = c.wx - p.wx, dy = c.wy - p.wy;
    const d2 = dx * dx + dy * dy;
    let rad = 1.0;
    if (c.type === 'rat' || c.type === 'squirrel') rad = 0.9;
    else if (c.type === 'raccoon') rad = 1.0;
    else if (c.type === 'rc') rad = 0.7;
    else if (c.type === 'tric' || c.type === 'bike') rad = 1.1;
    else if (c.type === 'ebike' || c.type === 'moto') rad = 1.3;
    else if (c.type === 'car') rad = 2.85; // scaled with the 1.124 car.glb model (5% smaller)
    else if (c.type === 'ped' || c.type === 'lady') rad = 0.85;
    else if (c.type === 'dogwalker') rad = 0.95;
    else if (c.type === 'breaker') rad = 1.2;
    else if (c.type === 'yeller') rad = 0.95;
    else if (c.type === 'jacker') rad = 0.95;
    else if (c.type === 'hooker' || c.type === 'skater') rad = 0.85;
    else if (c.type === 'escooter') rad = 1.0;
    if (d2 > rad * rad) continue;
    if ((c.type === 'ped' || c.type === 'lady' || c.type === 'breaker' || c.type === 'yeller' || c.type === 'dogwalker' ||
        c.type === 'jacker' || c.type === 'hooker' || c.type === 'skater' || c.type === 'escooter')){
      // People are SOLID: push the worker out so they can't walk through, but NEVER stun
      // (a stun here caused an infinite stun-lock loop when the worker was stuck against them)
      const d = Math.sqrt(d2) || 0.001;
      const nx = -dx / d, ny = -dy / d; // from person toward worker
      const pen = rad - d;             // push out to just touching (small gap)
      p.wx += nx * (pen + 0.05);
      p.wy = clamp(p.wy + ny * (pen + 0.05), -9.4, 4.5);
      if (c.vcd <= 0){
        c.vcd = 2.5;
        if (c.type === 'dogwalker'){ c.bark = 2.2; Voice.say('WOOF! WOOF! WOOF!', 2.5, 1.0, c.wx, c.wy); }
        else if (c.type === 'jacker'){ /* says nothing - too busy jackhammering */ }
        else if (c.type === 'hooker') Voice.say('Want a date?', 3, 1.2, c.wx, c.wy, c.gender);
        else if (c.type === 'skater') Voice.say('Whoa! Like, watch it bro!', 3, 1.15, c.wx, c.wy, c.gender);
        else if (c.type === 'escooter') Voice.say("I'm calling a lawyer!", 3, 1.0, c.wx, c.wy, c.gender);
        else if (c.type === 'yeller') Voice.say('Damn fentanyl addicts!', 4, 0.9, c.wx, c.wy, c.gender);
        else Voice.say('Hey! Watch it!', 4, 1.1, c.wx, c.wy, c.gender);
      }
      return;
    }
    if (c.type === 'rat'){
      c.flee = 1.6; c.dir = dx >= 0 ? -1 : 1;
      Voice.say('Eeek!', 1.2, 1.5, c.wx, c.wy);
      if (carry !== 'none' && Math.random() < 0.45) dropCarried();
      doStun(0.5, 'trip');
    } else if (c.type === 'squirrel' || c.type === 'raccoon'){
      c.flee = 1.8; c.dir = dx >= 0 ? -1 : 1;
      if (carry !== 'none' && Math.random() < 0.4) dropCarried();
      doStun(0.5, 'trip');
    } else {
      // vehicles: knockback + drop + stun + i-frames
      const nl = Math.sqrt(d2) || 1;
      p.wx -= (dx / nl) * 1.6;
      p.wy = clamp(p.wy - (dy / nl) * 1.6, -9.4, 4.5);
      dropCarried();
      p.invuln = 1.6;
      doStun(1.2, 'hit');
      if (c.type === 'car' || c.type === 'moto') Voice.say('Watch the road!', 4, 0.7, c.wx, c.wy, c.gender);
      else Voice.say('Hey! Hurry up!', 5, 0.85, c.wx, c.wy, c.gender);
    }
    return;
  }
}
// ==================== BROWN FOOTPRINT TRAIL (after stepping in dog shit) ====================
let footprints = [], footAlt = 1, footDist = 0;
function dropFootprint(){
  // alternate left / right of the walked axis, just behind the worker's feet
  const fx = Math.cos(p.facing || 0), fy = Math.sin(p.facing || 0);
  const off = 0.16 * footAlt; footAlt *= -1;
  const g = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.22, 0.02), new THREE.MeshLambertMaterial({ color: 0x3a2410, transparent: true, opacity: 0.85 }));
  g.position.set(p.wx - fx * 0.35 - fy * off, p.wy - fy * 0.35 + fx * off, GZ + 0.02);
  dynamicGroup.add(g);
  footprints.push({ g: g, mat: g.material, life: 7 });
}
function updateFootprints(dt){
  for (let i = footprints.length - 1; i >= 0; i--){
    const f = footprints[i];
    f.life -= dt;
    if (f.life <= 0){ if (f.g.parent) f.g.parent.remove(f.g); disposeObj(f.g); footprints.splice(i, 1); }
    else if (f.life < 3) f.mat.opacity = Math.max(0, f.life / 3) * 0.85; // oldest prints fade out
  }
}
// ==================== PLAYER UPDATE ====================
function updatePlayer(dt){
  // 8-way, 100% player-driven movement (keyboard OR gamepad OR touch pad):
  // W/Up = forward, S/Down = back along the route, A/D = strafe, combos = diagonals; no input = stands still
  let fwd  = !!(keys['KeyW'] || keys['ArrowUp']   || gp.fwd  || vt.fwd);
  let back = !!(keys['KeyS'] || keys['ArrowDown'] || gp.back || vt.back);

  //     (eases off as it closes in — it never zooms past the worker);
  //   hopper within the dead zone      -> stop dead and let the worker load;

  //     rolling off ahead of him.

          }
          v.wy += Math.sign(targetLane - v.wy) * Math.min(dt * pushSpeed, Math.abs(targetLane - v.wy));
          v.targetWy = targetLane;
          if (v._baseWy !== undefined) v._baseWy = targetLane;
        } else {
          v.curSp = Math.min(v.curSp, distToHopperFace * 2.5);
        }
      }
    }
  }
}

function updateCreatures(dt){
  for (let i = 0; i < creatures.length; i++){
    const c = creatures[i];
    if (c.vcd > 0) c.vcd -= dt; // voice cooldown so bumping a person doesn't spam audio every frame
    const tx = c.wx - p.wx;
    switch (c.type){
      case 'ped': case 'lady': case 'dogwalker':{
        const sprintPed = npcRoadRules(c, dt); // yield to closing traffic: steer aside or sprint
        const pedSp = Math.max(c.sp, sprintPed || 0);
        c.wx += pedSp * dt;
        animParts(c, pedSp * dt * 2.2);
        if (tx > 55){ c.wx = p.wx - 38; c.wy = R(1, 4); }
        else if (tx < -58){ c.wx = p.wx + 42; c.wy = R(1, 4); }
        c.cd -= dt;
        if (state === 'play' && c.cd <= 0 && Math.abs(tx) < 5){
          Voice.say('Hey! Hurry up!', 6, 1.1, c.wx, c.wy, c.gender);
          c.cd = 6;
        }
        break;
      }
      case 'rat':{
        const sprintRat = npcRoadRules(c, dt); // scurry out of the way of closing traffic
        if (c.flee > 0){ c.flee -= dt; c.wx += c.dir * 10 * dt; animParts(c, dt * 30); }
        else {
          c.wx += c.dir * Math.max(c.sp, sprintRat || 0) * dt;
          if (Math.random() < dt * 0.8) c.dir *= -1;
          c.wy = clamp(c.wy + R(-1, 1) * dt * 3, 0.8, 2.2);
        }
        c.g.rotation.z = c.dir >= 0 ? 0 : Math.PI;
        if (tx > 58){ c.wx = p.wx - 35; c.dir = 1; }
        if (tx < -58) c.wx = p.wx + 42;
        break;
      }
      case 'raccoon':{
        const sprintRac = npcRoadRules(c, dt); // scurry out of the way of closing traffic
        if (c.flee > 0){
          c.flee -= dt;
          const away = c.wx >= p.wx ? 1 : -1;
          c.wx += away * 7 * dt;
          c.wy = clamp(c.wy + (Math.random() - 0.5) * 8 * dt, 0.8, 7.5);
          c.g.rotation.z = away >= 0 ? R(-0.25, 0.25) : Math.PI + R(-0.25, 0.25); // face the direction it scurries
          animParts(c, dt * 25);
        } else if (c.t > 0){
          c.t -= dt;
        } else {
          const racSp = Math.max(c.sp, sprintRac || 0);
          const dx = c.tx - c.wx, dy = c.ty - c.wy;
          const dl = Math.hypot(dx, dy) || 1;
          c.wx += (dx / dl) * racSp * dt;
          c.wy = clamp(c.wy + (dy / dl) * racSp * dt, 0.8, 7.5);
          c.g.rotation.z = Math.atan2(dy, dx); // always face the direction it walks — never backwards
          if (dl < 0.6){ c.t = R(1, 3); c.tx = R(p.wx - 30, p.wx + 40); c.ty = R(1, 7.5); }
          animParts(c, dt * 12);
        }
        c.g.position.z = c.g.position.z; // keep
        break;
      }
      case 'squirrel':{
        c.wx += c.sp * dt;
        c.wy = 6.5 + Math.sin(c.wx * 0.5) * 1.6;
        c.g.position.z = GZ + Math.max(0, Math.sin(c.wx * 2.2)) * 0.3;
        if (tx > 55) c.wx = p.wx - 38;
        break;
      }
      case 'pigeon':{
        if (c.flyT > 0){
          // Scared off: flapping wings, climbing into the sky on this bird's OWN escape heading
          c.flyT -= dt;
          c.wx += Math.cos(c.fleeAng) * 7 * dt;
          c.wy += Math.sin(c.fleeAng) * 7 * dt;
          c.gz = Math.min(9, c.gz + 9 * dt);
          c.g.rotation.y = 0.5; // nose-down glide
          const fl = Math.sin(performance.now() * 0.045) * 0.9;
          c.wingL.rotation.x = -fl; c.wingR.rotation.x = fl;
          if (c.flyT <= 0){
            c.g.visible = false;
            c.returnT = R(5, 10); // gone for a while — the bird comes back to peck again
          }
        } else if (c.g.visible === false){
          // gone: come back and land somewhere on the sidewalk, so the birds keep
          // being around all shift instead of disappearing forever
          if (state === 'play'){
            c.returnT = (c.returnT || 5) - dt;
            if (c.returnT <= 0){
              c.g.visible = true;
              c.wx = R(-45, 60); c.wy = R(1.2, 4.8); // re-land on the concrete
              c.gz = 0; c.peck = R(0, 6.28);
            }
          }
        } else if (state === 'play' && Math.abs(tx) < 3.2 && Math.abs(c.wy - p.wy) < 2.5){
          // Worker gets close → take flight, flapping, with a yell
          c.flyT = 1.1; c.gz = 0.5;
          c.fleeAng = Math.atan2(c.wy - p.wy, c.wx - p.wx) + R(-1.8, 1.8); // every bird picks a DIFFERENT scatter direction
          Voice.say('scram birds!', 2.2, 0.95, p.wx, p.wy, WORKER_GENDER);
        } else {
          // Pecking at seed on the sidewalk: hop-bob + slight body sway
          c.peck += dt * 7;
          c.gz = Math.abs(Math.sin(c.peck)) * 0.07;
          c.g.rotation.z = Math.sin(c.peck * 0.5) * 0.2;
          c.wingL.rotation.x = 0.05; c.wingR.rotation.x = -0.05;
        }
        c.g.position.z = GZ + (c.gz || 0);
        break;
      }
      case 'tric':{
        const sprintTric = npcRoadRules(c, dt); // yield to closing traffic: steer aside or sprint
        c.stop -= dt;
        if (c.stop <= 0){
          const obstT = findVehicleAhead(c, creatures);
          let tSp = c.sp;
          if (obstT){
            tSp = Math.min(c.sp, obstT.sp + 1); // slightly faster than leader to not bottleneck
            // Hard speed cap based on distance to prevent overshoot/crash
            const minSafeSpeedT = Math.max(0.5, obstT.dist * 3.5);
            tSp = Math.min(tSp, minSafeSpeedT);
            if (c.curSp > obstT.sp + 0.5 && c.detourTimer === undefined){
              c.detourY = c.wy >= -1 ? R(-2.5, -1.5) : R(4, 6); // go into bike lane or sidewalk gap
              c.detourTimer = R(0.3, 0.5);
            }
          } else if (c.detourTimer !== undefined){
            c.detourTimer -= dt;
            if (c.detourTimer <= 0) c.detourTimer = undefined;
          }
          tSp = Math.max(tSp, sprintTric || 0); // never crawl in front of closing traffic
          const aT = 7 * dt;
          c.curSp += (tSp - c.curSp) * aT;
          // Safety clamp
          if (!isFinite(c.curSp) || c.curSp < 0) c.curSp = 0;
          c.wx += c.curSp * dt;
          if (c.detourTimer !== undefined){
            c.wy += (c.detourY - c.wy) * 2.5 * dt;
          } else {
            c.g.rotation.x = Math.sin(c.wx * 3) * 0.08;
          }
          animParts(c, c.curSp * dt * 3);
          if (Math.random() < dt * 0.3) c.stop = R(0.5, 2.5);
        } else {
          c.wx += (c.sprintT > 0 ? (c._sprintBoost || c.sp * 2) : c.sp * 0.1) * dt; // sprint out of traffic, else crawl
        }
        if (tx > 55){ c.wx = p.wx - 38; c.wy = R(1.2, 4.2); c.stop = 0; c.curSp = 0; }
        else if (tx < -58){ c.wx = p.wx + 42; c.wy = R(1.2, 4.2); c.stop = 0; c.curSp = 0; }
        break;
      }
      case 'rc':{
        const sprintRc = npcRoadRules(c, dt); // yield to closing traffic: steer aside or sprint
        c.flip -= dt;
        if (c.flip <= 0){
          // Smoothly decelerate to near-zero before turning around
          const accelT = 6 * dt;
          c.curSp += (0.5 - c.curSp) * accelT;
          if (!isFinite(c.curSp) || c.curSp < 0) c.curSp = 0;
          // Only flip direction once speed is very low
          if (c.curSp < 1.0){
            c.dir *= -1;
            c.flip = R(3, 5); // longer interval between turns for smoothness
          }
        }
        const obstRc = findVehicleAhead(c, creatures);
        let spRc = c.sp;
        if (obstRc){
          spRc = Math.min(c.sp, obstRc.sp + 2); // RC is fast, can go slightly faster than leader
          // Smooth speed cap based on distance — lerp gradually instead of hard cutoff
          const minSafeSpeedRc = Math.max(0.5, obstRc.dist * 3.5);
          spRc = Math.min(spRc, minSafeSpeedRc);
          if (c.detourTimer === undefined && c.curSp > obstRc.sp + 1){
            c.detourY = c.dir > 0 ? R(-2.5, -1.5) : R(3, 5); // weave into gaps
            c.detourTimer = R(0.15, 0.3);
          }
        } else if (c.detourTimer !== undefined){
          c.detourTimer -= dt;
          if (c.detourTimer <= 0) c.detourTimer = undefined;
        }
        spRc = Math.max(spRc, sprintRc || 0); // never crawl in front of closing traffic
        const aRc = 12 * dt;
        c.curSp += (spRc - c.curSp) * aRc;
        // Safety clamp
        if (!isFinite(c.curSp) || c.curSp < 0) c.curSp = 0;
        c.wx += c.dir * c.curSp * dt;
        if (c.detourTimer !== undefined){
          c.wy += (c.detourY - c.wy) * 4 * dt;
        } else {
          // Smooth continuous sine weave for RC car — no per-frame random jumps
          c.wy = c.targetWy + Math.sin(performance.now() * 0.003 + c.wx) * 0.12;
        }
        c.g.rotation.z = c.dir >= 0 ? 0 : Math.PI;
        if (tx > 58) c.wx = p.wx - 35;
        if (tx < -58){ c.wx = p.wx + 42; c.dir = -1; c.curSp = 0; c.detourTimer = undefined; }
        break;
      }
      case 'bike': case 'ebike':{
        const sprintBe = npcRoadRules(c, dt); // yield to closing cars/motos: swerve or sprint
        const obstBe = findVehicleAhead(c, creatures);
        let spBe = c.sp;
        if (obstBe){
          // Check if obstacle is the truck — bike takes curb-side passing lane
          const isTruckObstacle = obstBe.isTruck;
          const distToObstacleB = obstBe.dist;

          if (isTruckObstacle){
            // === BIKES PASS THE TRUCK: Two lanes to prevent bunching at hopper ===
            // Use natural lane assignment to spread bikes laterally BEFORE they reach the truck
            const passLane = c._naturalLane; // pre-assigned: 0.5 (curb) or -8.5 (outer road)
            const isCurbSide = passLane > -2.0;
            
            // Steer toward our assigned passing lane if not yet there
            if (c.wy < -1.0 && c._naturalLane === 0.5){
              // Curb-side bike — steer up to sidewalk
              const toCurb = Math.min(passLane, -2.0); // stop at truck's 3D inner edge
              c.wy += Math.sign(toCurb - c.wy) * Math.min(Math.abs(toCurb - c.wy), 3 * dt);
            } else if (c.wy > -4.0 && passLane === -8.5){
              // Outer-road bike — steer left to outer lane
              const toOuter = Math.max(passLane, -6.4); // stop at truck's outer edge
              c.wy += Math.sign(toOuter - c.wy) * Math.min(Math.abs(toOuter - c.wy), 3 * dt);
            }

            const distToTruckRear = obstBe.dist;
            // Truck rear (hopper end) is at truck.wx - boxL; cab is at truck.wx + boxL
            // Require BOTH X and Y clearance to consider ourselves alongside the truck
            const passedHopperX = c.wx >= truck.wx - truck.boxL;  // past hopper in X
            const inSafeLane = (passLane > -2.0) ? c.wy > -1.8 : c.wy < -6.4;
            const passedHopper  = passedHopperX && inSafeLane;      // AND clear of truck's Y-path
            const pastCab      = c.wx > truck.wx + (truck.cabOff || 6.0);           // clear of front cab

            if (distToTruckRear > 12.0){
              // Haven't reached truck yet — approach at full speed, lane is clear
              spBe = c.sp;
            } else if (pastCab && inSafeLane){
              // Fully past the cab — resume normal cruising lane, full speed
              const homeLanes = c.type === 'bike' ? [-1.0] : [-0.8];
              if (!c._homeLane) c._homeLane = homeLanes[0];
              c.targetWy += (c._homeLane - c.wy) * 2 * dt;
              spBe = c.sp;
            } else if (passedHopper){
              // In safe lane alongside truck body — full speed, no braking!
              spBe = c.sp;
            } else {
              // Behind the hopper or not yet in safe lane
              if (c.wy <= -2.0 && distToTruckRear < 5.0){
                // === EMERGENCY: Too close to rear hopper and NOT in safe lane! ===
                spBe = Math.max(spBe, distToTruckRear * 1.2);
              } else {
                spBe = c.sp;
              }
              // Keep steering toward safe lane
              if (passLane === 0.5){
                const toCurb = Math.min(passLane, -1.9);
                c.wy += Math.sign(toCurb - c.wy) * Math.min(Math.abs(toCurb - c.wy), 4 * dt);
              } else {
                const toOuter = Math.max(passLane, -6.4);
                c.wy += Math.sign(toOuter - c.wy) * Math.min(Math.abs(toOuter - c.wy), 4 * dt);
              }
            }
          } else {
            // Obstacle is another vehicle (bike/moto/car), not the truck
            // But check if the truck is ALSO nearby — bikes should still join curb lane!
            const distToTruckNearby = Math.abs(truck.wx - c.wx) < 20.0 ? Math.abs((truck.wx - truck.boxL) - c.wx) : 999;
            const bikeNearTruck = distToTruckNearby < 15.0 && (c.type === 'bike' || c.type === 'ebike');

            spBe = Math.min(c.sp, obstBe.sp + 1.5);
            const minSafeSpeedBe = Math.max(0.5, distToObstacleB * 3.5);
            spBe = Math.min(spBe, minSafeSpeedBe);

            if (bikeNearTruck){
              // Detect if the lead vehicle is another bike also near the hopper — that means we're in a bike queue!
              const leadIsVehicle = obstBe && obstBe.dist < 6.0;
              let leaderAtHopper = false;
              if (leadIsVehicle && c.type === 'bike'){
                // Check creatures ahead to see if the lead vehicle is another bike
                for (let i = 0; i < creatures.length; i++){
                  const other = creatures[i];
                  if (other === c || !other.wx) continue;
                  const dxa = other.wx - c.wx;
                  if (dxa < 0.5 || dxa > 6.0) continue;
                  const dyo = Math.abs(other.wy - c.wy);
                  if (dyo > (other.boxW + c.boxW + 0.3)) continue;
                  // Check: is this vehicle actually near the truck's rear?
                  const distToRear = Math.abs((truck.wx - truck.boxL) - other.wx);
                  if (distToRear < 10.0 && (other.type === 'bike' || other.type === 'ebike')){
                    leaderAtHopper = true;
                    break;
                  }
                }
              }

              if (leaderAtHopper){
                // There's a bike queue — follow the lead bike but brake to maintain spacing
                spBe = Math.max(0.5, obstBe.sp + 1.0); // keep a gap behind lead
                const toCurb = 0.5 - c.wy;
                c.wy += Math.sign(toCurb) * Math.min(Math.abs(toCurb), 3 * dt);
              } else if (c.wy > -2.0){
                // Already in curb lane — follow lead bike's speed, stay in lane
                spBe = c.curSp;
              } else if (c.wy <= -2.0){
                // In road lane but truck is nearby — merge to curb lane to pass alongside lead bike
                // Don't brake for the lead bike; just steer up and follow its speed
                spBe = Math.max(spBe, obstBe.sp); // match lead bike's speed instead of braking below it
                const toCurb = 0.5 - c.wy;
                c.wy += Math.sign(toCurb) * Math.min(Math.abs(toCurb), 4 * dt);
              }
            } else {
              // Not near truck — normal obstacle avoidance with escape routes
              // If stuck behind another vehicle, swerve into gaps
              if (c.curSp > obstBe.sp && c.detourTimer === undefined){
                const escapeY = clamp(c.wy + (c.wy < 0 ? 4 : -3), -1.5, 6);
                if (isLaneClear(escapeY, c.wx, c.boxW, creatures)){
                  c.detourY = escapeY;
                  c.detourTimer = R(0.2, 0.4);
                }
              }
            }
          }

        // === GLOBAL ESCAPE MODE: always check, regardless of what obstacle we see ===
        const distToHopperAlways = (truck.wx - truck.boxL) - c.wx;
        if (distToHopperAlways > 0 && distToHopperAlways < 8.0){
          // We're behind the hopper — track how long we've been stuck
          if (!c._stuckTimer) c._stuckTimer = 0;
          // Count as "stuck" if not already making progress past it
          if (c.wx < truck.wx - truck.boxL + 2.0 && !c._escapeMode){
            c._stuckTimer += dt;
            if (c._stuckTimer > 1.0 && c.wy > -7.5){
              // Have been waiting behind hopper too long — go around the FRONT!
              c._escapeMode = true;
              c._escapeTarget = -6.5;
              c._homeLane = null;
            }
          }
        } else {
          if (c._stuckTimer) c._stuckTimer = 0;
          c._escapeMode = false;
        }

        if (c._escapeMode){
          // === ESCAPE: Speed up toward outer road lanes to pass the front of the truck ===
          spBe = c.sp * 1.5; // accelerate!
          const toOuter = c._escapeTarget - c.wy;
          c.wy += Math.sign(toOuter) * Math.min(Math.abs(toOuter), 6 * dt); // strong lateral move
          // Once in road lane, target front-of-truck clearance
          if (c.wy <= -4.0){
            const escapeForward = truck.wx + 12.0; // pass well clear of cab
            if (c.wx < escapeForward && c.curSp > 8){
              spBe = c.sp * 1.6; // full throttle past the front
            } else if (c.wx >= escapeForward){
              c._escapeMode = false;
              const homeLanes = c.type === 'bike' ? [-1.0] : [-0.8];
              if (!c._homeLane) c._homeLane = homeLanes[0];
              c.targetWy += (c._homeLane - c.wy) * 2 * dt;
            }
          }
        }
        } else if (c.detourTimer !== undefined){
          c.detourTimer -= dt;
          if (c.detourTimer <= 0) c.detourTimer = undefined;
        }
        spBe = Math.max(spBe, sprintBe || 0); // never crawl in front of closing traffic
        const aBe = 9 * dt;
        c.curSp += (spBe - c.curSp) * aBe;
        // Safety clamp
        if (!isFinite(c.curSp) || c.curSp < 0) c.curSp = 0;
        c.wx += c.curSp * dt;
        if (c.detourTimer !== undefined){
          c.wy += (c.detourY - c.wy) * 3 * dt;
        } else {
          // Smooth lane interpolation — no per-frame random jumps that cause jitter
          const wobbleAmp = c.type === 'bike' ? 0.08 : 0.10; // fixed amplitude, set once at spawn
          if (!c._wobbleAmp) c._wobbleAmp = wobbleAmp;
          if (!c._baseWy) c._baseWy = c.targetWy;
          c.wy += (c._baseWy - c.wy) * 3 * dt;
          c.wy += Math.sin(c.wx * 0.4 + (c.type === 'bike' ? 1.0 : 2.0)) * c._wobbleAmp;
        }
        animParts(c, c.curSp * dt * 1.2);
        if (tx > 55){ c.wx = p.wx - 40; c._baseWy = clamp(R(-1.5, -0.3) + R(-0.3, 0.3), -2, 0); c.targetWy = c._baseWy; c.curSp = 0; }
        else if (tx < -58){ // Recycle vehicles that fall far behind the player
          c.wx = p.wx + 42;
          c.wy = clamp(R(-3.5, -6.5), -8.5, -1.5);
          c._baseWy = c.targetWy = c.wy;
          c.curSp = c.sp;
          c.detourTimer = undefined;
        }
        break;
      }
      case 'car':{
        // Check for obstacles ahead (truck + other vehicles)
        let obstacle = findVehicleAhead(c, creatures);
        // NO CRAWLING: a car always moves at least at the worker's walk pace (8.5).
        // Hard brakes for the truck hopper / point-blank vehicles are re-applied below.
        let desiredSp = Math.max(c.sp, CAR_MIN_SP);

        // === CRITICAL: Direct hopper proximity check — prevents driving into the truck ===
        // If car's Y overlaps truck's body AND car is approaching from behind, must brake/steer
        const tYMin = -4.5 - truck.boxW; // ≈ -6.75 (truck 3D body outer edge)
        const tYMax = -4.5 + truck.boxW; // ≈ -2.25 (truck 3D body inner edge)
        const carBoxYMin = c.wy - c.boxW;
        const carBoxYMax = c.wy + c.boxW;
        const overlapsTruckY = carBoxYMax > tYMin && carBoxYMin < tYMax;
        const distToHopper = (truck.wx - truck.boxL) - c.wx; // distance to rear hopper face
        // "Approaching the hopper" only while the car's NOSE is still behind the rear face.
        // A car passing ALONGSIDE the truck (nose already past) must not be slammed
        // to a stop mid-pass — that was the wiggle/crawl right next to the truck's side.
        const nearHopperSide = distToHopper > c.boxL * 0.5 && distToHopper < 20.0;
        const directlyNearHopper = overlapsTruckY && nearHopperSide;
        const truckRear = truck.wx - truck.boxL; // distance to rear hopper face

        // Always enforce truck as obstacle when approaching from behind in its Y-zone
        if (directlyNearHopper && (!obstacle || !obstacle.isTruck)){
          obstacle = { isTruck: true, dist: Math.max(0.1, distToHopper) };
        }
        if (obstacle){
          const isTruckObstacle = obstacle.isTruck;
          const distToObstacle = obstacle.dist;

          // === TRAFFIC FLOW: pass the truck on the side you're already on ===
          // 3D body extent (street height): wy ≈ -6.75 .. -2.25 (truck center -4.5 ± bodyW 2.25).
          // Both sides have a pass lane:
          //  - road side (wy < -4.5): OUTER lane -9.0 — plenty of room
          //  - curb side (wy > -4.5): CURB lane -0.9 — car hugs the curb (0.16u clear
          //    of the truck's real 3D side at the 5%-smaller 1.19 half-width)
          // Passing on YOUR side means no car ever crosses the truck's lane, and both
          // sides flow instead of queueing behind a single pass lane.
          const OUTER_PASS_LANE = -9.0;
          const CURB_PASS_LANE = -0.9;
          const inPassLane = c.wy <= -8.3 || c.wy >= -1.0; // fully clear of the truck's Y
          const sideLane = c.wy > -4.5 ? CURB_PASS_LANE : OUTER_PASS_LANE; // pass on my side

          // Check if car is in the truck's Y-zone — MUST NOT enter hopper area
          const inTruckYZone = overlapsTruckY && nearHopperSide;
          
          if (inTruckYZone){
            // === IN THE TRUCK'S Y-ZONE: steer to the pass lane on MY side — don't sit, don't crawl ===
            const distAhead = truckRear - (c.wx + c.boxL);
            if (isLaneClear(sideLane, c.wx, c.boxW, creatures)){
              c.targetWy = sideLane; // decisive: pass on my side, never cross the truck's lane
              if (distAhead <= 0.3){
                desiredSp = 0; // nose at the hopper — hold until the lane change gets going
              } else {
                desiredSp = Math.max(CAR_MIN_SP, Math.min(desiredSp, distAhead * 3.0)); // keep moving
              }
            } else {
              // My pass lane is occupied — wait BEHIND the truck, not in front of it
              desiredSp = Math.min(desiredSp, Math.max(0, distAhead * 2.0));
            }
          } else if (isTruckObstacle && distToObstacle > 3.0){
            // === PASSING THE TRUCK: my-side lane at full speed ===
            const pastCab = c.wx > truck.wx + (truck.cabOff || 6.0);

            if (inPassLane){
              desiredSp = c.sp; // already clear of the truck's Y — full speed
            } else if (!pastCab){
              if (isLaneClear(sideLane, c.wx, c.boxW, creatures)){
                c.targetWy = sideLane; // single consistent target — no zig-zag
                desiredSp = Math.max(desiredSp, CAR_MIN_SP); // pass at pace, no crawl
              } else {
                desiredSp = Math.min(desiredSp, Math.max(CAR_MIN_SP, distToObstacle * 2.0));
              }
            } else {
              // Past the cab: ease back into a normal lane (the truck is now behind us)
              if (!c._homeLane) c._homeLane = -6.5; // normal car lane
              c.targetWy += (c._homeLane - c.targetWy) * 1.5 * dt;
              desiredSp = c.sp; // full speed after passing
            }

          } else if (isTruckObstacle){
            // Very close to the truck's rear: brake to control the approach, and start
            // the merge into my-side pass lane NOW — never sit point-blank in its lane.
            desiredSp = Math.min(desiredSp, Math.max(0, distToObstacle * 1.5));
            if (isLaneClear(sideLane, c.wx, c.boxW, creatures)){
              c.targetWy = sideLane; // escape lane is open — begin the lane change
              desiredSp = Math.max(CAR_MIN_SP, desiredSp); // keep moving while we do
            }
          } else {
            // Obstacle is another vehicle — slow down normally
            desiredSp = Math.min(c.sp, obstacle.sp);
            if (distToObstacle < 1.5){
              desiredSp = Math.max(0, distToObstacle * 1.5);
            } else if (distToObstacle < 3.0){
              desiredSp = Math.min(desiredSp, distToObstacle * 2.0);
            } else if (distToObstacle < 6.0){
              desiredSp = Math.min(desiredSp, distToObstacle * 1.5);
            }
            // Try to change lane around slower vehicles
            let canDetour = false;
            if (c.curSp > obstacle.sp + 0.5 && c.detourTimer === undefined){
              if (isLaneClear(sideLane, c.wx, c.boxW, creatures)){
                canDetour = true;
                c.detourY = sideLane;
                c.detourTimer = R(0.4, 0.7);
              }
            }
          }

        } else if (c.detourTimer !== undefined){
          c.detourTimer -= dt;
          if (c.detourTimer <= 0) c.detourTimer = undefined;
        }

        // === YIELD TO FAST TWO-WHEELERS: cars let bikes / e-bikes / motos pass ===
        const riderThreat = findFastRiderBehind(c, creatures);
        if (riderThreat){
          // Steer aside into a clear road lane (away from the rider's lane first)
          if (c.riderLane === undefined){
            const away = (c.wy - riderThreat.v.wy) >= 0 ? 1 : -1;
            const steps = [away * 1.8, -away * 1.8, away * 3.2, -away * 3.2];
            for (let i = 0; i < steps.length; i++){
              const cand = c.wy + steps[i];
              if (cand < -8.8 || cand > -0.6) continue; // stay on the roadway
              if (isLaneClear(cand, c.wx, c.boxW, creatures)){ c.riderLane = cand; break; }
            }
          }
          desiredSp = Math.max(desiredSp, 15); // full throttle to clear the rider quickly
        }
        if (c.riderLane !== undefined){

        }

        // then re-apply the emergency stop right at the truck hopper (safety first).
        // Only while the nose is still BEHIND the rear face (approaching) and in the
        // truck's Y zone — a car alongside/past it must not be braked just for being
        // next to the truck (that pinned it in the middle lane with no escape).
        if (desiredSp < CAR_MIN_SP) desiredSp = CAR_MIN_SP;
        if (truck.active && overlapsTruckY && nearHopperSide){
          const dtTruck = (truck.wx - truck.boxL) - c.wx;
          if (dtTruck > 0 && dtTruck < 14){

          }
        }

        // Smooth speed change — never overshoot desired speed
        const accel = 8 * dt;

        c.wx += c.curSp * dt;

          c.wy += (c.detourY - c.wy) * 3 * dt;
        } else {
          c.wy += (c.targetWy - c.wy) * 2 * dt; // smooth lane targeting
          c.wy += Math.sin((c.wx * 0.15) + c.sway) * 0.02;
        }
        if (tx > 58) {
          c.wx = p.wx - 38;
          c.curSp = 0;
          c.detourTimer = undefined;
          c.targetWy = clamp(R(-3.5, -6.5), -8.5, -1.5);
          if (!c._homeLane) c._homeLane = c.targetWy;
        } else if (tx < -58) { // Recycle vehicles that fall far behind the player
          c.wx = p.wx + 42;
          c.curSp = 0;
          c.detourTimer = undefined;
          c.targetWy = clamp(R(-3.5, -6.5), -8.5, -1.5);

        const tYMax2 = -4.5 + truck.boxW;
        const motoBoxYMin = c.wy - c.boxW;
        const motoBoxYMax = c.wy + c.boxW;
        const overlapsMotoTruckY = motoBoxYMax > tYMin2 && motoBoxYMin < tYMax2;
        const distToHopperM = (truck.wx - truck.boxL) - c.wx;
        const nearHopperSideM = distToHopperM > c.boxL * 0.5 && distToHopperM < 20.0; // only while the nose is still behind the rear face
        const directlyNearHopperM = overlapsMotoTruckY && nearHopperSideM;
        const truckRear = truck.wx - truck.boxL;

        // Always enforce truck as obstacle when moto approaches from behind in its Y-zone

          obstacleM = { isTruck: true, dist: Math.max(0.1, distToHopperM) };
        }
        if (obstacleM){
          const isTruckObstacle = obstacleM.isTruck;
          const distToObstacleM = obstacleM.dist;
          // Pass on MY side: curb lane if I'm on the curb half, outer road otherwise.
          const sideLaneM = c.wy > -4.5 ? -0.9 : -9.0;
          const inPassLaneM = c.wy <= -7.2 || c.wy >= -1.8; // clear of the truck's Y on either side

          const inTruckYZoneM = overlapsMotoTruckY && nearHopperSideM;

          if (inTruckYZoneM){
            // === IN THE TRUCK'S Y-ZONE: steer to the pass lane on MY side — don't sit, don't crawl ===
            const distAheadM = truckRear - (c.wx + c.boxL);
            if (isLaneClear(sideLaneM, c.wx, c.boxW, creatures)){
              c.targetWy = sideLaneM;
              if (distAheadM <= 0.3) desiredSpM = 0;
              else desiredSpM = Math.max(c.sp * 0.5, Math.min(desiredSpM, distAheadM * 3.0));

            } else {

              desiredSpM = c.sp;

          } else if (isTruckObstacle){

            } else if (distToObstacleM < 3.0){

            } else if (distToObstacleM < 6.0){

        } else {

          c.wy += Math.sin(c.wx * 0.3) * 0.08; // tiny wobble for realism
        }
        animParts(c, c.curSp * dt * 0.8, 0.2);
        if (tx > 55){ c.wx = p.wx - 38; c.curSp = 0; c.detourTimer = undefined; }
        else if (tx < -58) { // Recycle vehicles that fall far behind the player

          c.curSp = 0;
          c.detourTimer = undefined;
        }

      }
      case 'breaker':{

        if (tx > 58){ c.wx = p.wx - 38; c.wy = R(1.2, 4.2); }

        break;

        if (c.parts){ const tr = Math.sin(c.hamT * 40) * 0.05; c.parts.armL.rotation.x = tr; c.parts.armR.rotation.x = -tr; }

        if (state === 'play' && Math.abs(tx) < 13 && c.gravCd <= 0){

          const hx = c.wx + Math.cos(az) * 0.45, hy = c.wy + Math.sin(az) * 0.45; // chisel tip
          spawnGravelBits(hx, hy);
          if (Math.random() < 0.3) spawnDustEffect(hx, hy); // occasional bigger dust puff
        }
        if (tx < -55){ c.wx = p.wx + 42; c.wy = R(1.2, 4.2); c.g.rotation.z = R(-0.55, 0.55); }
        break;
      }
      case 'hooker':{
        // standing the corner: slow hip sway with a little side-to-side shimmy
        c.swayT += dt;
        c.g.rotation.z = -Math.PI / 2 + Math.sin(c.swayT * 1.3) * 0.1;
        c.g.rotation.y = Math.sin(c.swayT * 2.2) * 0.14; // hips rocking
        if (tx < -55){ c.wx = p.wx + 42; c.wy = R(1.2, 4.2); }
        break;
      }
      case 'skater':{

        // crouch -> POP (the bright board flips a full 360 while he launches)
        // -> land -> repeat. Every 3rd trick he adds a 360 body spin.

          c.flipT = 1.1;
          c.trickT = R(0.8, 1.6); // re-arm the countdown ONCE (was the bug: it ran every idle frame forever)
          c.nth = (c.nth || 0) + 1;
          c.doSpin = (c.nth % 3 === 0);

        if (c.flipT > 0){

          const t = 1 - Math.max(0, c.flipT) / 1.1; // 0..1 through the trick
          const pop = Math.sin(t * Math.PI);        // 0 -> 1 -> 0
          if (c.board){
            c.board.rotation.x = t * Math.PI * 2;   // full kickflip, board spins end over end
            c.board.position.z = 0.04 + pop * 0.9;  // board lifts a FULL meter off his feet
          }
          const crouch = Math.max(0, 1 - t * 3);    // knees bend through the first third
          c.g.position.z = GZ - 0.3 * crouch + 0.6 * pop; // crouch low, launch high, land
          c.g.rotation.z = c.doSpin ? t * Math.PI * 2 : 0; // 360 body spin every 3rd trick
          if (c.parts){ const aw = Math.sin(t * Math.PI) * 0.7; c.parts.armL.rotation.z = aw; c.parts.armR.rotation.z = -aw; }
        } else {
          // idle between tricks: the countdown genuinely reaches zero here
          c.trickT -= dt;
          if (c.board){ c.board.rotation.x = 0; c.board.position.z = 0.04; }
          c.g.position.z = GZ;
          c.g.rotation.z = 0;
          if (c.parts){ c.parts.armL.rotation.z = 0; c.parts.armR.rotation.z = 0; }
        }
        if (tx < -55){ c.wx = p.wx + 42; c.wy = R(4.3, 4.9); }
        break;
      }
      case 'escooter':{
        // cruising the sidewalk in the traffic direction, wheels rolling
        c.wx += c.sp * dt;
        if (c._lane === undefined) c._lane = c.wy;
        c.wy += (c._lane - c.wy) * 1.5 * dt;
        c.wy += Math.sin(c.wx * 0.4) * 0.015; // subtle wobble while riding
        const wspin = c.sp * dt * 7;
        if (c.wheelF) c.wheelF.rotation.y += wspin;
        if (c.wheelR) c.wheelR.rotation.y += wspin;
        if (tx > 58){ c.wx = p.wx - 38; c._lane = R(1.4, 3.8); }
        else if (tx < -58){ c.wx = p.wx + 42; c._lane = R(1.4, 3.8); }
        break;
      }
      case 'leashdog':{
        // Guard dog on a chain: worker gets close -> barks and lunges at him,
        // but the chain (radius chainR around the stake) stops the run.
        // Walks back to its spot on the lawn once the worker moves on.
        const dwx = p.wx - c.wx, dwy = p.wy - c.wy;
        const dWorker = Math.sqrt(dwx * dwx + dwy * dwy);
        if (dWorker < 6.5) c.agro = Math.max(c.agro || 0, 2.2);
        else if (c.agro > 0) c.agro -= dt;
        // target: worker (clamped to the chain circle) while aggro, else its home spot
        let gx, gy;
        if (c.agro > 0){
          gx = p.wx; gy = p.wy;
          const ox = gx - c.anchorX, oy = gy - c.anchorY;
          const ol = Math.sqrt(ox * ox + oy * oy) || 1;
          if (ol > c.chainR){ gx = c.anchorX + (ox / ol) * c.chainR; gy = c.anchorY + (oy / ol) * c.chainR; }
          c.barkCd = (c.barkCd || 0) - dt;
          if (c.barkCd <= 0 && dWorker < 9){
            c.bark = 0.9; c.barkCd = R(1.0, 1.7);
            Voice.say('WOOF! WOOF! WOOF!', 1.5, 1.0, c.wx, c.wy);
          }
        } else { gx = c.homeX; gy = c.homeY; }
        const mvx = gx - c.wx, mvy = gy - c.wy;
        const ml = Math.sqrt(mvx * mvx + mvy * mvy);
        if (ml > 0.06){
          const step = Math.min(ml, (c.agro > 0 ? 5.0 : 2.6) * dt);
          c.wx += (mvx / ml) * step;
          c.wy += (mvy / ml) * step;
          c.phase += step * 8; // drives the shared dogParts trot cycle (legs animate)
          c.g.rotation.z = Math.atan2(mvy, mvx); // dog faces +X - point it along its travel
        }
        // chain: stake -> dog, kept taut
        if (c.chain){
          const cx2 = c.anchorX - c.wx, cy2 = c.anchorY - c.wy;
          const cl = Math.sqrt(cx2 * cx2 + cy2 * cy2);
          c.chain.scale.x = Math.max(0.02, cl);
          c.chain.position.set(c.wx + cx2 / 2, c.wy + cy2 / 2, 0.38); // ABOVE the grass top (ground solid to z 0.3)
          c.chain.rotation.z = Math.atan2(cy2, cx2);
        }
        if (tx < -55){
          // recycle the whole set-up ahead of the route so it keeps showing up
          c.anchorX = p.wx + 44 + R(0, 10); c.anchorY = R(7.4, 8.2);
          c.homeX = c.anchorX + R(-0.4, 0.8); c.homeY = c.anchorY - R(0.9, 1.5);
          c.wx = c.homeX; c.wy = c.homeY; c.agro = 0;
          if (c.houseG) c.houseG.position.set(c.anchorX, c.anchorY, GZ);
        }
        break;
      }
    }
    c.g.position.x = c.wx;
    c.g.position.y = c.wy;
    if (c.type !== 'squirrel' && c.type !== 'yeller' && c.type !== 'raccoon' && c.type !== 'pigeon' && c.type !== 'skater' && c.type !== 'jacker') c.g.position.z = GZ;
    // dog walk cycle: trotting leg swing (diagonal pairs) + subtle body bob
    if (c.dogParts){
      const ds = Math.sin(c.phase) * 0.55;
      c.dogParts.legFL.rotation.y = ds;
      c.dogParts.legHR.rotation.y = ds;
      c.dogParts.legFR.rotation.y = -ds;
      c.dogParts.legHL.rotation.y = -ds;
      // standalone dogs (the root IS c.g) bob around GZ; companion dogs (a child
      // of their walker) bob around their local origin
      c.dogParts.root.position.z = (c.dogParts.root === c.g ? GZ : 0) + Math.abs(Math.sin(c.phase)) * 0.015;
    }
    // dog bark animation: tail wags and the head lifts/shakes while the bark timer runs
    if (c.bark > 0){
      c.bark -= dt;
      const dgp = c.dogParts;
      if (dgp){
        const t = performance.now();
        dgp.tailPivot.rotation.z = Math.sin(t * 0.025) * 0.7;
        dgp.headPivot.rotation.y = -0.5 + Math.sin(t * 0.03) * 0.08; // head up, barking
        dgp.headPivot.rotation.z = Math.sin(t * 0.02) * 0.15;        // head shake
      }
    }
    if (c.type === 'raccoon') c.g.position.z = (c.t > 0 && c.flee <= 0) ? GZ + Math.abs(Math.sin(performance.now() * 0.01)) * 0.04 : GZ;
  }
  // Separate overlapping vehicles after all movement is done this frame
  const vehicleList = creatures.filter(v => v.boxW !== undefined && v.type !== 'ped' && v.type !== 'lady');
  separateVehicles(vehicleList, dt);
  // Enforce truck's physical body as immovable solid wall — NO clipping
  resolveTruckCollisions(vehicleList, dt);
}

const hudCache = {};
function setTxt(el, v){
  if (!el) return;
  if (hudCache[el.id] !== v){ hudCache[el.id] = v; el.textContent = v; }
}
function updateHUD(){
  setTxt($('score'), pad(score));
  setTxt($('bonus'), pad(bonusTally));
  const carryTxt = carry === 'none' ? 'HANDS FREE' :
    carry === 'bag' ? 'CARRYING HEAVY BAG' :
    carry === 'canFull' ? 'CARRYING METAL CAN' : 'HANDS FREE';
  setTxt($('carry'), carryTxt);
  const pips = $('pips').children;

// ==================== COMIC SPEECH BUBLES ====================
// Small comic-strip text bubbles that float over whoever is talking (worker or NPC),
// projected from world space to screen space, and fade out after ~2 seconds.
let speechBubbles = [];
const _bubVec = new THREE.Vector3();
function worldToScreen(wx, wy, wz){
  if (!camera || !worldGroup) return null;
  if (typeof wx !== 'number' || typeof wy !== 'number' || !isFinite(wx) || !isFinite(wy)) return null;
  _bubVec.set(wx, wy, wz).applyMatrix4(worldGroup.matrixWorld).project(camera);
  if (!isFinite(_bubVec.x) || !isFinite(_bubVec.y) || _bubVec.z > 1 || _bubVec.z < -1) return null;
  return { x: (_bubVec.x * 0.5 + 0.5) * innerWidth, y: (-_bubVec.y * 0.5 + 0.5) * innerHeight };
}
function spawnBubble(text, wx, wy){
  const el = document.createElement('div');
  el.className = 'bubble';
  el.textContent = text;
  document.body.appendChild(el);
  speechBubbles.push({ el: el, wx: wx, wy: wy, life: 1.9, max: 1.9 });
}
function updateBubbles(dt){
  for (let i = speechBubbles.length - 1; i >= 0; i--){
    const b = speechBubbles[i];
    b.life -= dt;
    if (b.life <= 0){ b.el.remove(); speechBubbles.splice(i, 1); continue; }
    b.el.style.opacity = b.life > (b.max - 0.3) ? (b.max - b.life) / 0.3 : Math.min(1, b.life / 0.45);
    const s = worldToScreen(b.wx, b.wy, GZ + 2.35) || { x: innerWidth / 2, y: innerHeight * 0.3 }; // never let a bubble sit off-screen
    b.el.style.left = s.x + 'px';
    b.el.style.top = s.y + 'px';
  }
}
// ==================== GAME FLOW ====================
function gameOver(){
  state = 'over';
  SFX.playGameOver();
  Voice.say('Suspended! Report to the borough office!', 1, 0.7, p.wx, p.wy, WORKER_GENDER);
  if (score > hi){ hi = score; try { localStorage.setItem('dsnysweep_hi', String(hi)); } catch (e) {} }
  setTxt($('finalscore'), pad(score));
  setTxt($('hiscore2'), pad(hi));
  $('over').classList.remove('hidden');
  radioMode(); // NOW PLAYING bar parks back in the top-right corner
  $('vpad').classList.remove('on'); // hide the touch pad; drop any held touch state
  vt.left = vt.right = vt.fwd = vt.back = vt.act = false;
  joyPid = null;
}
function startGame(){
  enterLandscapeFullscreen();
  SFX.ensure();
  if (SFX.ctx && SFX.ctx.state === 'suspended') SFX.ctx.resume();
  SFX.radioStart(); // radio station: random songs from music/, 2s gap between tracks, forever
  resetWorldState(); // always start fresh: worker at route beginning (menu drift no longer carries over)
  $('menu').classList.add('hidden');
  $('over').classList.add('hidden');
  state = 'play';
  radioMode(); // NOW PLAYING bar moves from the top-right corner (menu) to top-center (game)
  lastT = performance.now(); // the sim idled on the menu: don't let the first frame see a huge dt
  $('vpad').classList.add('on'); // show the on-screen pad (keyboard / gamepad input mirrors onto it too)
}
// ==================== INPUT ====================
// ---- gamepad (polled every frame; works in parallel with the keyboard) ----
function pollGamepad(){
  gp.left = gp.right = gp.fwd = gp.back = gp.act = false;
  let pad = null;
  try {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (let i = 0; i < pads.length; i++) if (pads[i] && pads[i].buttons) { pad = pads[i]; break; }
  } catch (err) { pad = null; }
  if (pad){
    const b  = i => !!(pad.buttons[i] && pad.buttons[i].pressed);
    const ax = i => (pad.axes[i] || 0);
    gp.left   = b(14) || ax(0) < -0.4;   // d-pad left  / stick left
    gp.right  = b(15) || ax(0) >  0.4;   // d-pad right / stick right
    gp.fwd    = b(12) || ax(1) < -0.4;   // d-pad up    / stick up   = run forward
    gp.back   = b(13) || ax(1) >  0.4;   // d-pad down  / stick down = back up the route
    gp.act    = b(0) || b(2) || b(1) || b(3); // A / X / B / Y = action
    gp.start  = b(9);
  } else { gp.start = false; }
  if (gp.act && !gp.pAct){
    if (state === 'play') tryInteract();
    else startGame();
  }
  if (gp.start && !gp.pStart && state !== 'play') startGame();
  gp.pAct = gp.act;
  gp.pStart = !!gp.start;
}
window.addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].indexOf(e.code) >= 0) e.preventDefault();
  keys[e.code] = true;
  if (e.repeat) return;
  if (e.code === 'Space' || e.code === 'KeyE'){
    if (state === 'play') tryInteract();
    else startGame();
  }
  if (e.code === 'Enter' && state !== 'play') startGame();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
// ==================== VIRTUAL PAD (MOBILE) ====================
// Bottom-left: 8-way joystick — the large translucent circle is the travel radius,
// the small translucent circle is the stick; the finger snaps to one of 8 directions.
// The pad is rotated 45° CCW from the worker: DOWN = S+D, DOWN-RIGHT = D, RIGHT = W+D,
// UP = W+A, and so on (center = stand still; keyboard / gamepad mapping is unchanged).
// Bottom-right: translucent action button = SPACE (pick up trash / dump it into the truck).
// The stick visually follows the finger (snapped to the 8 directions); when the input
// comes from the keyboard or gamepad, the stick is mirrored onto that direction.
// The action button shows its pressed state from ANY input source.
const vt = { left:false, right:false, fwd:false, back:false, act:false }; // touch-pad state
const joy = $('joy'), joyStick = $('joy-stick'), actBtn = $('actbtn');
let joyPid = null, lastStickT = '', joyVisX = 0, joyVisY = 0; // joyVis = the stick's visual (finger) direction
function joyDirFromPoint(e){
  const r = joy.getBoundingClientRect();
  const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  if (Math.hypot(dx, dy) < r.width * 0.15){ vt.fwd = vt.back = vt.left = vt.right = false; joyVisX = 0; joyVisY = 0; return; } // dead zone: stand still
  // Stick shows WHERE the finger is (nearest of the 8 directions)...
  const raw = Math.round(Math.atan2(dy, dx) / (Math.PI / 4)) * (Math.PI / 4);
  joyVisX = Math.round(Math.cos(raw)); joyVisY = Math.round(Math.sin(raw));
  // ...while the worker moves the direction one step COUNTER-CLOCKWISE from that push
  // (DOWN = S+D, DOWN-RIGHT = D, RIGHT = W+D, UP = W+A, and so on; keyboard / gamepad unchanged).
  const snapped = raw - Math.PI / 4;
  const vx = Math.round(Math.cos(snapped)), vy = Math.round(Math.sin(snapped)); // each in {-1, 0, 1}
  vt.fwd = vy < 0; vt.back = vy > 0; vt.left = vx < 0; vt.right = vx > 0;
}
joy.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  e.preventDefault();
  joyPid = e.pointerId;
  try { joy.setPointerCapture(e.pointerId); } catch (err) {}
  joyDirFromPoint(e);
});
joy.addEventListener('pointermove', e => { if (e.pointerId === joyPid) joyDirFromPoint(e); });
function joyRelease(e){
  if (e.pointerId !== joyPid) return;
  joyPid = null;
  joyVisX = 0; joyVisY = 0;
  vt.fwd = vt.back = vt.left = vt.right = false;
}
joy.addEventListener('pointerup', joyRelease);
joy.addEventListener('pointercancel', joyRelease);
actBtn.addEventListener('pointerdown', e => {
  e.preventDefault();
  vt.act = true;
  if (state === 'play') tryInteract(); // SPACE: pick up the trash / dump it into the truck hopper
  else startGame();
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => actBtn.addEventListener(ev, () => { vt.act = false; }));
[joy, actBtn].forEach(el => el.addEventListener('contextmenu', e => e.preventDefault()));
// Stick: while a finger is on the pad it shows the finger's own 8-way position;
// otherwise it mirrors the keyboard / gamepad direction (touch acts as one of those sources).
function updateVirtualPad(){
  let ax, ay;
  if (joyPid !== null){ ax = joyVisX; ay = joyVisY; }
  else {
    ax = ((keys['KeyD'] || keys['ArrowRight'] || gp.right || vt.right) ? 1 : 0)
       - ((keys['KeyA'] || keys['ArrowLeft']  || gp.left  || vt.left)  ? 1 : 0);
    ay = ((keys['KeyS'] || keys['ArrowDown']  || gp.back  || vt.back)  ? 1 : 0)
       - ((keys['KeyW'] || keys['ArrowUp']    || gp.fwd   || vt.fwd)   ? 1 : 0);
  }
  const m = Math.hypot(ax, ay);
  const travel = (joy.clientWidth - joyStick.clientWidth) / 2;
  const t = m > 0
    ? 'translate(calc(-50% + ' + (ax / m * travel).toFixed(1) + 'px), calc(-50% + ' + (ay / m * travel).toFixed(1) + 'px))'
    : 'translate(-50%, -50%)';
  if (t !== lastStickT){ joyStick.style.transform = t; lastStickT = t; }
  actBtn.classList.toggle('pressed', !!(keys['Space'] || keys['KeyE'] || gp.act || vt.act));
}
// ==================== END VIRTUAL PAD ====================
$('btnStart').addEventListener('click', startGame);
$('btnRestart').addEventListener('click', startGame); // startGame() already resets the world
// Click outside the logo on the start screen → enter fullscreen (landscape)
$('menu').addEventListener('click', function(e){
  if (!e.target.closest('.menu-logo-wrap')) enterLandscapeFullscreen();
});
// ==================== MAIN LOOP ====================
// While the start menu / game-over screen is up, the sim + WebGL renderer stay ASLEEP:
// one static backdrop frame is drawn, then the loop does no per-frame work. That is
// what keeps mobile devices from running hot and draining battery before a shift
// begins. The radio is pure audio + CSS animation, so the music player keeps working
// on the menu at zero rendering cost.
let needsIdleRender = true;
function positionCamera(){
  // worldGroup is rotated +45deg: local (x, y) -> world (c45*(x - y), c45*(x + y)).
  // The camera sits ISO_A behind the target and ISO_A above it, exactly on the
  // isometric axis, so the worker is ALWAYS at screen center as it moves.
  const c45 = Math.SQRT1_2;
  // The light + shadow frustum must be centered on the player's TRUE world position.
  // p.wx/p.wy are LOCAL route coordinates inside the rotated worldGroup, while dirLight
  // lives in unrotated scene space. Without the +45deg transform the shadow box drifts
  // off the player as the route scrolls and shadows clip once the drift exceeds the
  // +/-45 frustum half-size.
  const plWx = c45 * (p.wx - p.wy);
  const plWy = c45 * (p.wx + p.wy);
  dirLight.position.set(plWx - 25, plWy + 28, 58);
  dirLight.target.position.set(plWx, plWy, 0);
  groundGroup.position.x = p.wx;
  const camTX = c45 * (p.wx - CAM_Y);
  const camTY = c45 * (p.wx + CAM_Y);
  camera.position.set(camTX, camTY - 1.4142 * ISO_A, ISO_A);
  camera.up.set(0, 0, 1);
  camera.lookAt(camTX, camTY, 0);
}
function loop(now){
  requestAnimationFrame(loop);
  if (window.innerHeight > window.innerWidth){ lastT = now; return; } // portrait mode: freeze the sim; the CSS overlay prompts the player to rotate to landscape
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;
  updateBubbles(dt); // speech bubbles always tick so they fade out even on menus / game over
  pollGamepad();     // cheap input poll: on the menu, gamepad START / ACT still begins the shift
  updateVirtualPad();// keep the on-screen pad mirroring keyboard / gamepad / touch (cheap)
  if (state !== 'play'){
    // IDLE on the menu / game-over: render ONE static backdrop frame, then do no work.
    if (needsIdleRender){ needsIdleRender = false; positionCamera(); renderer.render(scene, camera); }
    return;
  }
  if (state === 'play'){
    updatePlayer(dt);
    updateTruck(dt);
    updateCreatures(dt);
    updateBonuses(dt);
    updateFlyingCans(dt);
    updateDustParticles(dt);
    updateBlocks(dt);
    cleanupLandedCans();
    updateFootprints(dt);
    collideStatic(dt);
    collideLandedCans();
    collideCreatures();
    updateHUD();
  }
  positionCamera();
  renderer.render(scene, camera);
}
// ==================== FBX ASSET SWAP-IN ====================
// When the 3D model finishes loading in the background, swap the live truck (and any
// currently-visible curb bags/cans) from the procedural fallback to the FBX model.
function rebuildTruckFromFbx(){
  if (!FBX_TPL.truck) return;
  const wx = truck.wx, hidden = truck.hidden;
  const oldG = truck.g;
  if (oldG && oldG.parent) oldG.parent.remove(oldG);
  if (oldG) disposeObj(oldG);
  const nt = buildTruck(); // buildTruck() now takes the FBX path
  nt.wx = wx; nt.hidden = hidden; nt.g.visible = (hidden <= 0);
  truck = nt;
  for (let i = 0; i < blocks.length; i++){
    const h = blocks[i].house;
    (h.bags || []).forEach(bag => {
      if (bag.state === 'curb' && bag.g && bag.g.parent){
        const pg = bag.g.parent;
        pg.remove(bag.g); disposeObj(bag.g);
        bag.g = makeBag(); bag.g.position.set(bag.wx, bag.wy, GZ); pg.add(bag.g);
      }
    });
    if (h.can && (h.can.state === 'curb' || h.can.state === 'droppedEmpty') && h.can.g && h.can.g.parent){
      const pg = h.can.g.parent;
      pg.remove(h.can.g); disposeObj(h.can.g);
      h.can.g = makeCan(true); h.can.g.position.set(h.can.wx, h.can.wy, GZ); pg.add(h.can.g);
    }
  }
}
// ==================== BOOT ====================
initThree();
worker = buildWorker();
worldGroup.add(worker.group);
wparts = worker;
truck = buildTruck();
spawnWorld();
updateHUD();
radioMode(); // initial placement: we're on the start menu, so the NOW PLAYING bar parks top-right
requestAnimationFrame(loop);
// Load the 3D truck / can / bag model in the background and swap it in when ready.
if (typeof THREE.FBXLoader !== 'undefined'){
  loadFbxTemplates()
    .then(() => rebuildTruckFromFbx())
    .catch(err => console.warn('[FBX] using procedural assets:', err && err.message));
}
// Load car.glb in the background and swap traffic cars to the real model when ready.
if (typeof THREE.GLTFLoader !== 'undefined'){
  loadCarGltf()
    .catch(err => console.warn('[GLTF] using procedural cars:', err && err.message));
}
</script>
