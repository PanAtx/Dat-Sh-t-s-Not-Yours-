<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100vw; height:100vh; overflow:hidden; background:#0a0d12; user-select:none; -webkit-user-select:none; }
#game { position:fixed; inset:0; }
#game canvas { display:block; }
#haze { position:fixed; inset:0; z-index:5; pointer-events:none;
  background:linear-gradient(315deg, rgba(255,255,255,.22) 0%, rgba(255,255,255,.07) 22%, transparent 45%); }
#scanlines { position:fixed; inset:0; z-index:6; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(6,10,14,.20) 0px, rgba(6,10,14,.20) 1px, transparent 1px, transparent 3px);
  animation:crt 4s steps(60) infinite; }
@keyframes crt { 0%,100% { opacity:.9 } 50% { opacity:.72 } }
#vignette { position:fixed; inset:0; z-index:7; pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%, transparent 52%, rgba(0,0,0,.42) 100%); }
#hud { position:fixed; inset:0; z-index:10; pointer-events:none; font-family:"Courier New", Courier, monospace; color:#eaf6ff; }
.hudbox { text-shadow:0 0 8px rgba(46,224,144,.55), 2px 2px 0 rgba(0,0,0,.85); }
#tl { position:absolute; top:16px; left:20px; font-size:20px; letter-spacing:2px; }
#tl .sub { font-size:14px; color:#9fe8b8; margin-top:4px; }
#route { position:absolute; top:14px; left:50%; transform:translateX(-50%);
  border:2px solid rgba(46,224,144,.7); background:rgba(4,18,10,.66); padding:6px 22px;
  font-size:16px; letter-spacing:3px; color:#bfe9ff; white-space:nowrap; }
#tr { position:absolute; top:16px; right:20px; text-align:right; font-size:13px; letter-spacing:1px; }
#pips { margin-top:6px; }
.pip { display:inline-block; width:14px; height:14px; margin-left:6px; border:2px solid #ffb84d; transform:rotate(45deg); }
.pip.on { background:#ff3b3b; box-shadow:0 0 10px #ff3b3b; }
#carry { position:absolute; bottom:66px; left:50%; transform:translateX(-50%); font-size:18px; letter-spacing:2px; color:#7dff9e; white-space:nowrap; }
#hint { position:absolute; bottom:34px; left:50%; transform:translateX(-50%); font-size:15px; letter-spacing:1px; color:#ffd66b; white-space:nowrap; }
#flash { position:fixed; inset:0; z-index:9; pointer-events:none; background:rgba(255,40,40,.3); opacity:0; transition:opacity .5s; }
.modal { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; padding:10px; background:rgba(3,7,10,.82); }
.panel { border:3px solid #2ee090; background:linear-gradient(180deg, #07130d, #040a07);
  padding:clamp(14px,2.8vh,34px) clamp(16px,4vw,48px); text-align:center;
  box-shadow:0 0 34px rgba(46,224,144,.4), inset 0 0 60px rgba(0,0,0,.65);
  width:min(94vw,680px); max-width:94vw; max-height:calc(100vh - 24px); max-height:100%; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.panel h1 { font-family:"Courier New", monospace; font-size:clamp(18px,4.4vw,34px); letter-spacing:5px; color:#2ee090; text-shadow:0 0 14px rgba(46,224,144,.8); }
.title-text { font-family:"Arial Black", Impact, sans-serif; font-size:clamp(18px,4.4vw,36px); font-weight:bold; color:#ffffff; text-align:center; display:block; margin:0 auto clamp(6px,1.4vh,12px); line-height:1.1; letter-spacing:2px; }
.panel h2 { font-family:"Courier New", monospace; font-size:clamp(16px,4vw,26px); letter-spacing:4px; color:#ff5252; text-shadow:0 0 14px rgba(255,82,82,.8); }
.panel .tag { font-family:"Courier New", monospace; color:#9fe8b8; letter-spacing:2px; font-size:clamp(10px,1.7vw,13px); margin-top:8px; }
.panel .ctl { font-family:"Courier New", monospace; color:#cfe6ff; font-size:clamp(11px,1.8vw,14px); line-height:clamp(1.45,2.3vh,1.9); margin:clamp(10px,2vh,20px) 0; text-align:left; display:inline-block; }
.panel .score { font-family:"Courier New", monospace; font-size:clamp(14px,2.6vw,20px); color:#ffd66b; margin:clamp(8px,1.6vh,14px) 0 4px; letter-spacing:2px; }
.panel button { font-family:"Courier New", monospace; font-size:clamp(14px,2.6vw,20px); letter-spacing:4px; padding:clamp(10px,2vh,14px) clamp(28px,6vw,44px); margin-top:clamp(10px,2vh,18px); cursor:pointer;
  color:#04140c; background:#2ee090; border:none; box-shadow:0 0 18px rgba(46,224,144,.7); pointer-events:auto; }
.panel button:hover { background:#5cf0ad; }
.hidden { display:none !important; }
.kbd { color:#7dff9e; }
/* ===== Menu logo screen ===== */
#menu .panel { background:none; border:none; box-shadow:none; padding:0; max-width:none; width:auto; }
.menu-logo-wrap { position:relative; display:inline-block; line-height:0; overflow:hidden;
  border:3px solid #2ee090; border-radius:14px;
  box-shadow:0 0 28px rgba(46,224,144,.55), 0 0 60px rgba(46,224,144,.2), 0 0 50px rgba(0,0,0,.8); }
.menu-logo-wrap img { max-width:82vw; max-height:84vh; width:auto; height:auto; display:block; }
.menu-bottom { position:absolute; bottom:3%; left:0; right:0; text-align:center; padding:0 0 2%;
  display:flex; flex-direction:column; align-items:center; gap:clamp(8px,1.4vh,14px); }
.menu-bottom .score { font-family:"Courier New",monospace; font-size:clamp(14px,3vw,24px); color:#fff; letter-spacing:3px;
  animation:hiGlow 2.2s ease-in-out infinite; }
@keyframes hiGlow {
  0%,100% { text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000, 0 0 8px rgba(255,255,255,.3); }
  50%      { text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000, 0 0 22px rgba(255,255,255,.95), 0 0 40px rgba(255,255,255,.4); }
}
.menu-bottom button { font-family:"Arial Black",Impact,sans-serif; font-weight:bold; font-size:clamp(16px,2.8vw,24px); letter-spacing:5px;
  padding:clamp(12px,2.2vh,16px) clamp(32px,7vw,52px); cursor:pointer;
  color:#fff; text-shadow:1.5px 1.5px 0 #000,-1.5px -1.5px 0 #000,1.5px -1.5px 0 #000,-1.5px 1.5px 0 #000;
  border:2px solid rgba(46,224,144,.85); border-radius:4px;

@keyframes btnPulse {

  50%      { background:rgba(46,224,144,.7);  box-shadow:0 0 30px rgba(46,224,144,.75), 0 4px 18px rgba(0,0,0,.4); }
}
.menu-bottom button:hover { animation:none; color:#fff; background:rgba(92,240,173,.8); border-color:rgba(92,240,173,.95); box-shadow:0 0 32px rgba(46,224,144,.8), 0 4px 20px rgba(0,0,0,.4); }
/* ===== Security-camera DVR overlay (bottom-right, clears the HUD / score) ===== */
#camfeed { position:fixed; right:18px; bottom:16px; z-index:11; pointer-events:none;
  font-family:'Press Start 2P','Courier New',monospace; text-align:right; line-height:2.3;
  text-shadow:1px 1px 0 rgba(0,0,0,.95), 0 0 4px rgba(0,0,0,.7); }
#camfeed .rec { color:#ff3b3b; font-size:14px; text-shadow:1px 1px 0 rgba(0,0,0,.95), 0 0 10px rgba(255,59,59,.85);
  animation:recblink 1.15s infinite; }
#camfeed .dot { display:inline-block; width:11px; height:11px; background:#ff3b3b;
  box-shadow:0 0 10px #ff3b3b; margin-right:10px; vertical-align:-1px; }
#camfeed .cam { color:#eafff2; font-size:12px; }
#camfeed .ts { color:#bfeed4; font-size:11px; }
@keyframes recblink { 0%,50% { opacity:1; } 50.1%,100% { opacity:.12; } }
/* ===== Landscape-only / fullscreen gate (no portrait mode) ===== */
.rotate-overlay { position:fixed; inset:0; z-index:60; display:none; flex-direction:column;
  align-items:center; justify-content:center; gap:22px; background:rgba(3,7,10,.97);
  font-family:"Courier New",Courier,monospace; text-align:center; padding:24px; }
.rotate-overlay .icon { font-size:56px; line-height:1; animation:rotspin 2.2s ease-in-out infinite; }
.rotate-overlay .msg { font-size:22px; letter-spacing:3px; color:#2ee090; text-shadow:0 0 12px rgba(46,224,144,.7); }
.rotate-overlay .sub { font-size:14px; letter-spacing:2px; color:#9fe8b8; }
@keyframes rotspin { 0%,18% { transform:rotate(0deg); } 58%,100% { transform:rotate(90deg); } }
@media (orientation: portrait) { .rotate-overlay { display:flex !important; } }
/* ===== Animated reward popups (MONGO! / STREET CASH! / TREASURE!) ===== */
.popup { position:fixed; left:50%; top:26vh; z-index:55; pointer-events:none; white-space:nowrap; text-align:center;
  font-family:'Press Start 2P','Courier New',monospace; font-size:min(8.5vw,64px); font-weight:bold; letter-spacing:4px; }
.popup .pop-sub { display:inline-block; margin-top:16px; font-size:min(3vw,22px); letter-spacing:3px; color:#fff;
  background:rgba(0,0,0,.55); padding:6px 14px; border:2px solid rgba(255,255,255,.35); border-radius:4px; }
.pop-mongo    { color:#ffab45; text-shadow:4px 4px 0 rgba(0,0,0,.85), 0 0 22px rgba(255,160,60,.8); animation:popPunch 1.1s cubic-bezier(.2,1.5,.4,1) forwards; }
.pop-cash     { color:#54ff88; text-shadow:4px 4px 0 rgba(0,0,0,.85), 0 0 22px rgba(60,255,120,.8); animation:cashWobble 1.1s ease-out forwards; }
.pop-treasure { color:#ffd23a; text-shadow:4px 4px 0 rgba(0,0,0,.85), 0 0 28px rgba(255,210,60,.9); animation:treasureZoom 1.2s ease-out forwards; }
@keyframes popPunch {
  0% { transform:translateX(-50%) scale(.2); opacity:0; }
  30% { transform:translateX(-50%) scale(1.3); opacity:1; }
  50% { transform:translateX(-50%) scale(.94); }
  68% { transform:translateX(-50%) scale(1.1); }
  85% { transform:translateX(-50%) scale(1); opacity:1; }
  100% { transform:translateX(-50%) scale(1.02); opacity:0; }
}
@keyframes cashWobble {
  0% { transform:translateX(calc(-50% - 55vw)) rotate(-10deg); opacity:0; }
  38% { transform:translateX(-50%) rotate(6deg); opacity:1; }
  58% { transform:translateX(calc(-50% - 18px)) rotate(-4deg); }
  76% { transform:translateX(calc(-50% + 10px)) rotate(2deg); }
  100% { transform:translateX(-50%) rotate(0); opacity:0; }
}
@keyframes treasureZoom {
  0% { transform:translateX(-50%) scale(.1) rotate(-28deg); opacity:0; }
  42% { transform:translateX(-50%) scale(1.35) rotate(9deg); opacity:1; }
  64% { transform:translateX(-50%) scale(.97) rotate(-4deg); }
  84% { transform:translateX(-50%) scale(1.06) rotate(0); opacity:1; }
  100% { transform:translateX(-50%) scale(1) rotate(0); opacity:0; }
}
</style>

</div></div>

<script>
'use strict';
// ==================== HELPERS & CORE STATE ====================
const $ = id => document.getElementById(id);
const R = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const dist = (x, y) => Math.hypot(x - p.wx, y - p.wy);
const pad = n => String(Math.max(0, Math.floor(n))).padStart(6, '0');
const TILE = 144, NB = 18, BW = 8;
const RUN_SPEED = 8.5;    // worker speed while W / UP / stick is held (no input = stands still)
const CAR_MIN_SP = RUN_SPEED; // no slow traffic: cars never crawl below the worker's walk pace
const TRUCK_SPEED = 0.8;  // the DSNY truck crawls very slowly (half walking pace, pedestrians are 1.0-2.2)
const TEST_KEEP_PLAYING = true; // TEMP (testing): missed garbage stops still give write-ups, but NEVER suspend you. Set false to restore 3-strike game over.
const GZ = 0.3;
const ISO_A = 26; // isometric camera arm length
const CAM_Y = 2.0; // camera's locked lateral centerline (middle of the street strip) so the view never veers off the playfield

let state = 'menu', score = 0, bonusTally = 0, complaints = 0;
let p = { wx: 0, wy: 2.5, phase: 0, stunT: 0, stunDur: 1, invuln: 0, shake: 0, facing: 0 };
let carry = 'none', carried = null, hopperAnim = 0;
let hopperLoad = 0, hopperCycling = false, hopperCycleT = 0;
let hopperTrash = null, hopperLumps = [];
let routeIdx = 0, routeDist = 0;
const ROUTES = ['ROUTE 1 - MANHATTAN UPTOWN', 'ROUTE 2 - BRONX DEPOT', 'ROUTE 3 - BROOKLYN DEPOT', 'ROUTE 4 - QUEENS YARD', 'ROUTE 5 - STATEN ISLAND'];
let hi = 0; try { hi = parseInt(localStorage.getItem('dsnysweep_hi') || '0', 10) || 0; } catch (e) {}

// Security-camera DVR clock (bottom-right #camfeed): live 24-hour time + date, updated every second.
const camDateEl = document.getElementById('camdate');
const camTimeEl = document.getElementById('camtime');
const cam2 = n => String(n).padStart(2, '0');
function camTick(){
  const d = new Date();
  if (camDateEl) camDateEl.textContent = cam2(d.getDate()) + '/' + cam2(d.getMonth() + 1) + '/' + d.getFullYear();
  if (camTimeEl) camTimeEl.textContent = cam2(d.getHours()) + ':' + cam2(d.getMinutes()) + ':' + cam2(d.getSeconds());
}
camTick();
setInterval(camTick, 1000);

// ===== Landscape-only / fullscreen gate: enter on START (a user gesture). =====
// Fullscreen is requested first; the orientation lock is attempted after it is granted
// (and falls back to the older API). All calls are best-effort: iOS/Safari can't lock
// orientation from the web, so we also rely on the viewport hint + the portrait overlay.
function enterLandscapeFullscreen(){
  function tryLock(){
    const o = (typeof screen !== 'undefined' && screen.orientation) ? screen.orientation : null;
    if (o) {
      if (typeof o.lock === 'function') { try { o.lock('landscape').catch(function(){}); } catch (e) {} }
      else if (typeof o.requestLock === 'function') { try { o.requestLock('landscape').catch(function(){}); } catch (e) {} }
    }
    try { window.focus(); } catch (e) {}
  }
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (req) {
    try {
      const r = req.call(el);
      if (r && typeof r.then === 'function') r.then(tryLock).catch(tryLock); else tryLock();
    } catch (e) { tryLock(); }
  } else {
    tryLock();
  }
}
window.addEventListener('orientationchange', function(){ try { window.focus(); } catch (e) {} });

// ===== Big animated "reward" popups (MONGO! / STREET CASH! / TREASURE!) =====
function showPopup(kind){
  document.querySelectorAll('.popup').forEach(function(n){ n.remove(); }); // never let two stack
  const cfg = ({
    mongo:    { text: 'MONGO!',       cls: 'pop-mongo',    sub: '+$50'  },
    cash:     { text: 'STREET CASH!', cls: 'pop-cash',     sub: '+$100' },
    treasure: { text: 'TREASURE!',    cls: 'pop-treasure', sub: '+$250' }
  }[kind]) || { text: 'BONUS!', cls: 'pop-mongo', sub: '' };
  const el = document.createElement('div');
  el.className = 'popup ' + cfg.cls;
  el.innerHTML = cfg.text + (cfg.sub ? '<span class="pop-sub">' + cfg.sub + '</span>' : '');
  document.body.appendChild(el);
  setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 1350);
}
let blocks = [], creatures = [], bonuses = [], pendingHouses = [];
let flyingCans = [], dustParticles = [], landedCans = [];
let worker = null, wparts = null, truck = null;
let worldGroup, dynamicGroup, groundGroup, scene, camera, renderer, dirLight;
const keys = {};
const gp = { left:false, right:false, fwd:false, back:false, act:false, pAct:false, pStart:false };
let lastT = performance.now();
$('hiscore').textContent = pad(hi);
$('hiscore2').textContent = pad(hi);

// ==================== THREE SETUP (diagonal top-right matrix) ====================
function makeFrustum(){
  const a = innerWidth / innerHeight;
  const s = 4.5;
  if (a >= 1) return { l: -s * a, r: s * a, t: s, b: -s };
  return { l: -s, r: s, t: s / a, b: -s / a };
}
function initThree(){
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  $('game').appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9fb6c9);
  scene.fog = new THREE.Fog(0x9fb6c9, 60, 160); // NYC haze with real depth falloff

  const f = makeFrustum();
  camera = new THREE.OrthographicCamera(f.l, f.r, f.t, f.b, 1, 400);
  camera.up.set(0, 0, 1); // world vertical is the screen-up axis
  scene.add(camera); // root-level camera: its position is computed explicitly every frame

  scene.add(new THREE.AmbientLight(0xffffff, 0.78));
  dirLight = new THREE.DirectionalLight(0xfff2dd, 0.75);
  dirLight.position.set(-25, 28, 58);
  dirLight.castShadow = true;
  dirLight.shadow.bias = -0.0006;
  dirLight.shadow.mapSize.set(2048, 2048);
  const sc = dirLight.shadow.camera;
  sc.left = -45; sc.right = 45; sc.top = 45; sc.bottom = -45; sc.near = 1; sc.far = 220;
  scene.add(dirLight); scene.add(dirLight.target);

  // Rotate the whole world +45deg so local +X (route forward) points to the
  // TOP-RIGHT of the screen: the classic Paperboy diagonal axis.
  worldGroup = new THREE.Group();
  worldGroup.rotation.z = Math.PI / 4;
  scene.add(worldGroup);
  dynamicGroup = new THREE.Group();
  worldGroup.add(dynamicGroup);
  groundGroup = new THREE.Group();
  worldGroup.add(groundGroup);
  buildGround();
}
function groundStrip(w, h, d, y, col){
  const q = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color: col }));
  q.position.set(0, y, 0.15);
  q.receiveShadow = true;
  groundGroup.add(q);
  return q;
}
function buildGround(){
  groundStrip(240, 10, 0.3, -4.5, 0x3a4046);   // asphalt
  groundStrip(240, 4.5, 0.3, 2.75, 0x8d949c);  // sidewalk
  groundStrip(240, 3.5, 0.3, 6.75, 0x4d7a3a);  // front lawns
  groundStrip(240, 16, 0.3, 16, 0x35522c);     // park beyond the blocks
  const curb = new THREE.Mesh(new THREE.BoxGeometry(240, 0.5, 0.5), new THREE.MeshLambertMaterial({ color: 0xaab2ba }));
  curb.position.set(0, 0.5, 0.1);
  curb.receiveShadow = true;
  groundGroup.add(curb);
  const edgeL = new THREE.Mesh(new THREE.BoxGeometry(240, 0.22, 0.05), new THREE.MeshLambertMaterial({ color: 0xd8dde2 }));
  edgeL.position.set(0, -9.2, 0.31);
  groundGroup.add(edgeL);
  const edgeR = edgeL.clone();
  edgeR.position.y = 0.2;
  groundGroup.add(edgeR);
}
window.addEventListener('resize', () => {
  const f = makeFrustum();
  camera.left = f.l; camera.right = f.r; camera.top = f.t; camera.bottom = f.b;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
// ==================== PROCEDURAL AUDIO (Web Audio API) ====================
const SFX = {
  ctx: null, master: null, introBuf: null, introSrc: null,
  ensure(){
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.5;
    this.master.connect(this.ctx.destination);
  },
  tone(type, f0, f1, dur, gain, when){
    if (!this.ctx) return;
    const t = this.ctx.currentTime + (when || 0);
    const o = this.ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(Math.max(1, f0), t);

// ==================== VOICE SYNTHESIS (queue-managed) ====================
const Voice = {
  enabled: typeof window !== 'undefined' && 'speechSynthesis' in window,
  busy: false, queue: [], last: {},
  say(text, gap, pitch, rate){
    if (!this.enabled) return;
    const now = performance.now();
    gap = gap || 1.4;
    if (this.last[text] && now - this.last[text] < gap * 1000) return;
    this.last[text] = now;
    // Most-recent action wins: if something is speaking, cut it off and drop the
    // queued backlog so the new line starts immediately instead of playing last.
    const interrupt = this.busy;
    if (interrupt){
      this.busy = false;
      this.queue.length = 0;
      try { window.speechSynthesis.cancel(); } catch (e) {}
    }
    this.queue.push({ text: text, pitch: pitch || 0.8, rate: rate || 1.08 });
    if (interrupt) setTimeout(() => this.pump(), 30); // small delay to dodge the Chrome cancel/speak race
    else this.pump();
  },
  pump(){
    if (this.busy || !this.queue.length || !this.enabled) return;
    const item = this.queue.shift();
    const u = new SpeechSynthesisUtterance(item.text);
    u.pitch = item.pitch; u.rate = item.rate; u.volume = 0.9;
    let vs = [];
    try { vs = window.speechSynthesis.getVoices(); } catch (e) {}
    const en = vs.find(v => v.lang && v.lang.indexOf('en') === 0);
    if (en) u.voice = en;
    u.onend = () => { this.busy = false; setTimeout(() => this.pump(), 140); };
    u.onerror = () => { this.busy = false; setTimeout(() => this.pump(), 140); };
    this.busy = true;
    try { window.speechSynthesis.speak(u); } catch (e) { this.busy = false; }
  },
  cancel(){
    this.queue.length = 0;
    this.busy = false;
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }
};

// ==================== FBX 3D ASSET PIPELINE (DSNY truck / can / bag) ====================
// truck.fbx is a POSED asset: it is NOT axis-aligned in native space, so instead of a fixed axis
// permutation we SOLVE each asset's orientation from its own geometry (wheels / lid / base) at load
// time and store a per-asset rotation matrix on the template (tpl.orient). The game uses X = route
// (front +X, rear -X), Y = lateral, Z = up. Verified in node against the real truck.fbx: the truck
// stands upright (L 7.33 > H 2.99), grounded, hopper at -X (rear), front at +X.
const TRUCK_SCALE = 0.4394, CAN_SCALE = 0.325, BAG_SCALE = 0.24;
let FBX_TPL = { truck: null, can: null, bag: null };

function fbxFind(root, re){ let r = null; root.traverse(o => { if (o.name && re.test(o.name) && (!r || r.name.length < o.name.length)) r = o; }); return r; }

function partBox(obj, re){
  const o = fbxFind(obj, re);
  if (!o) return null;
  o.updateWorldMatrix(true, true);
  return new THREE.Box3().setFromObject(o);
}
function partCenter(obj, re){ const b = partBox(obj, re); return b ? b.getCenter(new THREE.Vector3()) : null; }

// Rotation matrix (native->game) mapping native 'front'->+X, 'right'->+Y, 'up'->+Z (as rows, det +1).
function rotFromUpFront(up, front){
  up = up.clone().normalize();
  front = front ? front.clone() : new THREE.Vector3();
  if (front.lengthSq() > 1e-10) front.addScaledVector(up, -up.dot(front)); // drop the up component
  if (front.lengthSq() < 1e-10){
    const a = Math.abs(up.y) < 0.99 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
    front.crossVectors(up, a);
  }
  front.normalize();
  const right = new THREE.Vector3().crossVectors(up, front).normalize();
  return new THREE.Matrix4().set(
    front.x, front.y, front.z, 0,
    right.x, right.y, right.z, 0,
    up.x, up.y, up.z, 0,
    0, 0, 0, 1
  );
}
// Generic fallback: UP = the asset's longest axis (used for the bag and any part-less asset).
function defaultOrient(tpl){
  tpl.updateWorldMatrix(true, true);
  const s = new THREE.Box3().setFromObject(tpl).getSize(new THREE.Vector3());
  const up = new THREE.Vector3(); up.setComponent([s.x, s.y, s.z].indexOf(Math.max(s.x, s.y, s.z)), 1);
  return rotFromUpFront(up, null);
}
// TRUCK: UP = thinnest axis of the wheel cloud; FRONT = centroid(front wheels) - centroid(rear wheels).
function orientTruck(tpl){
  const wheels = [];
  tpl.updateWorldMatrix(true, true);
  tpl.traverse(o => { if (o.isMesh && o.name && /wheel/i.test(o.name)) wheels.push(o); });
  if (wheels.length){
    const box = new THREE.Box3();
    wheels.forEach(w => { w.updateWorldMatrix(true, true); box.union(new THREE.Box3().setFromObject(w)); });
    const sp = [box.max.x - box.min.x, box.max.y - box.min.y, box.max.z - box.min.z];
    const up = new THREE.Vector3(); up.setComponent(sp.indexOf(Math.min(...sp)), 1);
    let F = new THREE.Vector3(), R = new THREE.Vector3(), nf = 0, nr = 0;
    wheels.forEach(w => {
      const c = new THREE.Box3().setFromObject(w).getCenter(new THREE.Vector3());
      if (/front/i.test(w.name)){ F.add(c); nf++; }
      else if (/rear/i.test(w.name)){ R.add(c); nr++; }
    });
    if (nf) F.multiplyScalar(1/nf);
    if (nr) R.multiplyScalar(1/nr);
    return rotFromUpFront(up, (nf && nr) ? F.sub(R) : null);
  }
  return defaultOrient(tpl);
}
// CAN: UP = lid center - base center (a bin standing on its base).
function orientCan(tpl){
  const lid = partCenter(tpl, /lid/i);
  const base = partCenter(tpl, /bin_base/i);
  if (lid && base) return rotFromUpFront(lid.clone().sub(base), null);
  return defaultOrient(tpl);
}

// Deep-clone a group into a fully independent, self-contained copy (own geo + materials),
// baking its FULL world transform so it has no dependency on the source scene graph.
function fbxExtract(src){
  src.updateWorldMatrix(true, true);
  const world = new THREE.Matrix4().copy(src.matrixWorld);
  const c = src.clone();
  c.position.setFromMatrixPosition(world);
  c.quaternion.setFromRotationMatrix(world);
  c.scale.setFromMatrixScale(world);
  c.traverse(o => {
    if (!o.isMesh) return;
    if (o.geometry) o.geometry = o.geometry.clone();
    if (o.material){ const ms = Array.isArray(o.material) ? o.material : [o.material]; o.material = (ms.length === 1 ? ms[0].clone() : ms.map(m => m.clone())); }
  });
  return c;
}

// Turn a template into an independent, oriented, grounded, game-sized instance (origin at
// center-bottom, local z=0 at the ground). Every mesh gets its own geometry+material so
// disposeObj() on this instance never touches the shared template.
function fbxInstance(tpl, scale){
  const c = tpl.clone();
  const rotGrp = new THREE.Group();
  rotGrp.quaternion.setFromRotationMatrix(tpl.orient || new THREE.Matrix4());
  rotGrp.scale.setScalar(scale);
  rotGrp.add(c);
  const holder = new THREE.Group();
  holder.add(rotGrp);
  holder.updateWorldMatrix(true, true);
  const box = new THREE.Box3().setFromObject(rotGrp);
  const ctr = box.getCenter(new THREE.Vector3());
  rotGrp.position.set(-ctr.x, -ctr.y, -box.min.z); // center XY, bottom -> local z=0
  holder.updateWorldMatrix(true, true);
  holder.traverse(o => {
    if (!o.isMesh) return;
    if (o.geometry) o.geometry = o.geometry.clone();
    if (o.material){ const ms = Array.isArray(o.material) ? o.material : [o.material]; o.material = (ms.length === 1 ? ms[0].clone() : ms.map(m => m.clone())); }
    o.castShadow = true; o.receiveShadow = true;
  });
  return holder;
}

// Load truck.fbx once and extract the three named asset groups into FBX_TPL.
function loadFbxTemplates(){
  if (FBX_TPL.truck) return Promise.resolve(true);
  if (typeof THREE.FBXLoader === 'undefined') return Promise.reject(new Error('FBXLoader not available'));
  return new Promise((resolve, reject) => {
    new THREE.FBXLoader().load('truck.fbx', (root) => {
      try {
        const truck = fbxFind(root, /garbageTruck_geo_grp/i);
        const can   = fbxFind(root, /garbageBin_geo_grp/i);
        const bag   = fbxFind(root, /truck_trash_grp/i) || fbxFind(root, /trash_bag_side_ply$/i);
        if (!truck || !can || !bag) throw new Error('FBX asset groups not found');
        FBX_TPL.truck = fbxExtract(truck); FBX_TPL.truck.orient = orientTruck(FBX_TPL.truck);
        FBX_TPL.can   = fbxExtract(can);   FBX_TPL.can.orient   = orientCan(FBX_TPL.can);
        FBX_TPL.bag   = fbxExtract(bag);   FBX_TPL.bag.orient   = defaultOrient(FBX_TPL.bag);
        root.traverse(o => { if (o.isMesh && o.geometry) o.geometry.dispose(); });
        resolve(true);
      } catch (e){ console.error('[FBX] template build failed:', e); reject(e); }
    }, undefined, (err) => { console.error('[FBX] load failed:', err); reject(err); });
  });
}

function loadCarGltf(){
  if (CAR_TPL) return Promise.resolve(true);

    new THREE.GLTFLoader().load('car.glb', (gltf) => {

function makeCarGltf(colorHex){
  const g = new THREE.Group();
  const model = CAR_TPL.template.clone(true);
  model.traverse(o => {

      // clone so every car keeps its OWN paint color (instances share the template otherwise)
      o.material = o.material.clone();
      o.material.color.setHex(colorHex);
    }
  });
  model.rotation.z = Math.PI / 2; // native front (-Y) → game forward (+X), rear → -X, Z stays up

function rebuildCarsFromGltf(){

    const c = creatures[i];

    const old = c.g;
    if (old.parent) old.parent.remove(old);
    if (!old.userData.isGltfCar) disposeObj(old); // procedural fallback had private geometry; GLTF shares template resources
    c.g = makeCarGltf(c.colorHex || pick(CAR_COLORS));
    c.g.position.set(c.wx, c.wy, GZ);
    dynamicGroup.add(c.g);
  }

// ==================== HOPPER TRASH PILE & CYCLE ====================
// The truck is heavy: it never bounces when loaded. Instead, each deposited bag/can
// visibly piles up in the rear hopper. After HOPPER_CYCLE_AT items the hopper "cycles" —
// the pile shrinks + fades away (compacted/loaded), the worker scores a bonus, jingle plays.
const HOPPER_CYCLE_AT = 5, HOPPER_CYCLE_DUR = 0.75, HOPPER_CYCLE_BONUS = 200;
function hopperWorldX(){ return truck.wx + (truck.hopperOff != null ? truck.hopperOff : -4.3); }
function hopperWorldY(){ return -4.5 + (truck.hopperY != null ? truck.hopperY : 0); }
function hopperTopZ(){ return (truck.hopperZ != null ? truck.hopperZ : 2.4); }
function addHopperLump(){
  if (!hopperTrash){ hopperTrash = new THREE.Group(); worldGroup.add(hopperTrash); }
  const idx = hopperLoad; // 1..HOPPER_CYCLE_AT
  const palette = [0x23272e, 0x1b1f24, 0x2c3138, 0x30363d, 0x3a4048, 0x454b52];
  const mat = M(palette[(Math.random() * palette.length) | 0], { transparent: true, opacity: 1 });
  const g = new THREE.Group();
  const body = SP(0.4, mat); body.scale.set(1.1, 0.9, 1.2); g.add(body);
  const neck = CY(0.14, 0.19, 0.22, mat); neck.position.z = 0.44; g.add(neck);
  const knot = SP(0.13, mat, 6); knot.position.z = 0.58; g.add(knot);
  // Pile the bag INSIDE the open rear scoop (not on the roof): low base height,
  // spreading out and stacking a little higher with each deposit.
  const localX = R(-0.3, 0.5);
  const localY = R(-0.5, 0.5);
  const localZ = hopperTopZ() + Math.min(idx, HOPPER_CYCLE_AT) * 0.22 + R(-0.05, 0.05);
  g.position.set(localX, localY, localZ);
  g.rotation.z = R(-0.5, 0.5);
  const baseScale = R(0.9, 1.2);
  g.scale.setScalar(baseScale);
  hopperTrash.add(g);
  hopperLumps.push({ g: g, mat: mat, baseScale: baseScale, baseX: localX, baseZ: localZ });
}
function hopperDeposit(){
  if (hopperCycling) return; // mid-cycle (emptying) — skip buildup this time
  hopperLoad++;
  addHopperLump();
  if (hopperLoad >= HOPPER_CYCLE_AT){ hopperCycling = true; hopperCycleT = HOPPER_CYCLE_DUR; }
}
function clearHopperTrash(){
  if (!hopperTrash){ hopperLumps.length = 0; return; } // nothing has been deposited yet
  if (hopperTrash.parent) hopperTrash.parent.remove(hopperTrash);
  disposeObj(hopperTrash);
  hopperTrash = null;
  hopperLumps.length = 0;
}
function finishHopperCycle(){
  clearHopperTrash();
  hopperLoad = 0;
  hopperCycling = false;
  addScore(HOPPER_CYCLE_BONUS, true);
  SFX.playHopperJingle();
  Voice.say('Hopper full, compacting!', 2.5, 0.9);
}
function updateHopperTrash(dt){
  if (!hopperTrash || hopperLumps.length === 0) return;
  hopperTrash.position.set(hopperWorldX(), hopperWorldY(), GZ); // keep the pile planted in the rear hopper
  if (hopperCycling){
    hopperCycleT -= dt;
    const k = Math.max(0, hopperCycleT / HOPPER_CYCLE_DUR); // 1 -> 0
    for (let i = 0; i < hopperLumps.length; i++){
      const L = hopperLumps[i];
      L.g.scale.setScalar(Math.max(0.0001, L.baseScale * k));   // get smaller
      L.g.position.z = L.baseZ * (0.5 + 0.5 * k);               // sink toward the floor
      L.g.position.x = L.baseX + (1 - k) * 0.5;                 // slide forward into the compactor
      L.mat.opacity = k;                                        // fade out
    }
    if (hopperCycleT <= 0) finishHopperCycle();
  }
}

// ==================== WORLD SPAWNING & BLOCK RECYCLING ====================
function makeCurbBag(wx, wy, house){
  const g = makeBag();
  const bag = { kind: 'bag', state: 'curb', wx: wx, wy: wy, h: house, g: g };
  g.position.set(wx, wy, GZ);
  dynamicGroup.add(g);
  house.bags.push(bag);
  return bag;
}
function makeCurbCan(wx, wy, house){
  const g = makeCan(true);
  const can = { kind: 'can', state: 'curb', wx: wx, wy: wy, h: house, g: g, home: { wx: wx, wy: wy } };
  g.position.set(wx, wy, GZ);
  dynamicGroup.add(g);
  return can;
}
function makeBlockContents(b, baseX){
  while (b.group.children.length){ const c = b.group.children.pop(); disposeObj(c); }
  b.hazards = [];
  const hg = makeHouse();
  hg.position.y = 10.5;
  b.group.add(hg);
  const house = { serviced: false, lamp: hg.userData.lamp, bags: [], can: null };
  b.house = house;
  // curb trash layout (every house has something to collect)
  const r = Math.random();
  let nBags = 0, hasCan = false;
  if (r < 0.40) nBags = 1;
  else if (r < 0.70) nBags = 2;
  else if (r < 0.86){ nBags = 1; hasCan = true; }
  else hasCan = true;
  if (nBags === 2){
    makeCurbBag(baseX + R(1.5, 3), R(1.0, 2.4), house);
    makeCurbBag(baseX + R(4.8, 6.6), R(1.0, 2.4), house);
  } else if (nBags === 1){
    makeCurbBag(baseX + R(2, 6), R(1.0, 2.4), house);
  }
  if (hasCan) house.can = makeCurbCan(baseX + R(2, 6), R(1.0, 2.2), house);
  // pre-spawned bonus (copper / street cash / treasure) placed in the world from the start
  if (Math.random() < 0.40) spawnBonus(baseX + R(1.5, 6.0), R(-1.0, 1.5));
  // lane markings & sidewalk joints (scroll with the block)
  const dashM = M(0xcfd5da);
  for (let i = 0; i < 2; i++){
    const dash = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.16, 0.04), dashM);
    dash.position.set(2 + i * 4, -4.5, 0.31);
    b.group.add(dash);
  }
  const joint = new THREE.Mesh(new THREE.BoxGeometry(0.1, 7.6, 0.03), M(0x79818a));
  joint.position.set(0.2, 2.75, 0.31);
  b.group.add(joint);
  // static hazards
  const hr = Math.random();
  if (hr < 0.28) addBottles(b, baseX + R(1, 6), R(1.5, 4.5));
  else if (hr < 0.46) addPothole(b, baseX + R(1.5, 6), R(-8, -3));
  else if (hr < 0.58) addHydrant(b, baseX + R(1.5, 6), 0.8);
  else if (hr < 0.68) addManhole(b, baseX + R(1.5, 6), R(-7.5, -3.5));
  // loose food wrappers on the street next to the sidewalk (litter dressing)
  if (Math.random() < 0.65) addWrapper(b, baseX + R(1, 6), R(-2.5, -0.7));
  // sidewalk trees
  if (Math.random() < 0.5){
    const t = makeTree();
    t.position.set(R(1, 6), R(6, 7.5), 0);
    b.group.add(t);
  }
}
function spawnWorld(){
  for (let i = 0; i < NB; i++){
    const g = new THREE.Group();
    const worldX = p.wx - TILE / 2 + i * BW;
    const b = { group: g, worldX: worldX, house: null, hazards: [] };
    g.position.x = worldX;
    dynamicGroup.add(g);
    makeBlockContents(b, worldX);
    blocks.push(b);
  }
  const counts = { ped: 2, lady: 1, rat: 5, raccoon: 1, squirrel: 2, tric: 2, rc: 1, bike: 1, ebike: 1, moto: 1, car: 2, breaker: 2, yeller: 2, dogwalker: 2 };
  for (const t in counts) for (let i = 0; i < counts[t]; i++) addCreature(t);
}
function recycleBlock(b){
  const h = b.house;
  if (h && !h.serviced){
    const inFlight = h.bags.some(x => x.state === 'carried') || (h.can && (h.can.state === 'carried' || h.can.state === 'carriedEmpty'));
    if (inFlight){ h.pending = 1; pendingHouses.push(h); }
    else addWriteUp();
  }
  if (h){
    for (let i = 0; i < h.bags.length; i++){
      const bag = h.bags[i];
      if (bag.state === 'curb' && bag.g.parent){ bag.g.parent.remove(bag.g); disposeObj(bag.g); }
    }
    if (h.can && (h.can.state === 'curb' || h.can.state === 'droppedEmpty') && h.can.g && h.can.g.parent){
      h.can.g.parent.remove(h.can.g);
      disposeObj(h.can.g);
    }
  }
}
function updateBlocks(dt){
  for (let i = 0; i < blocks.length; i++){
    const b = blocks[i];
    if (b.worldX - p.wx < -TILE / 2){
      recycleBlock(b);
      b.worldX += TILE;
      b.group.position.x = b.worldX;
      makeBlockContents(b, b.worldX);
    }
  }
  for (let i = pendingHouses.length - 1; i >= 0; i--){
    const h = pendingHouses[i];
    if (h.serviced){ pendingHouses.splice(i, 1); continue; }
    h.pending--;
    if (h.pending <= 0){ pendingHouses.splice(i, 1); addWriteUp(); }
  }
}
// ==================== CLEAN UP LANDED CANS (OFF-SCREEN RECYCLING) ====================
function cleanupLandedCans(){
  for (let i = landedCans.length - 1; i >= 0; i--){
    const lc = landedCans[i];
    if (!lc.g || !lc.g.parent) { 
      // already disposed - remove from array to prevent memory leak
      landedCans.splice(i, 1); 
      continue; 
    }
    // Off-screen behind player
    if (lc.wx < p.wx - 70){
      lc.g.parent.remove(lc.g); disposeObj(lc.g);
      landedCans.splice(i, 1);
    }
    // Off-screen far ahead (shouldn't happen normally, but safety net)
    else if (lc.wx > p.wx + 80){
      lc.g.parent.remove(lc.g); disposeObj(lc.g);
      landedCans.splice(i, 1);
    }
  }
}

function addScore(n, isBonus){

// ==================== FLYING CAN SYSTEM ====================
function spawnDustEffect(wx, wy){
  const count = 14;
  for (let i = 0; i < count; i++){
    const angle = (i / count) * Math.PI * 2 + R(-0.3, 0.3);
    const speed = 0.6 + R(0, 1.8);
    const g = new THREE.Group();
    // Create small flat dust particles
    const pGeo = new THREE.PlaneGeometry(0.15, 0.15);
    const pMat = new THREE.MeshLambertMaterial({ color: 0x9a9a8a, transparent: true, opacity: 0.7, side: THREE.DoubleSide });
    const pMesh = new THREE.Mesh(pGeo, pMat);
    g.add(pMesh);
    dynamicGroup.add(g);
    dustParticles.push({
      g: g,
      wx: wx,
      wy: wy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      vz: 0.3 + R(0, 1.2), // initial upward velocity
      life: 1.0,
      decay: 0.8 + R(0, 0.6),
      rotSpeed: R(-6, 6)
    });
  }
}
function updateFlyingCans(dt){
  for (let i = flyingCans.length - 1; i >= 0; i--){
    const fc = flyingCans[i];
    fc.progress += dt / fc.duration;
    if (fc.progress >= 1){
      // Landed - check NPC collision and spawn dust at target position
      const hitNPC = checkFlyingCanNpcHit(fc.tx, fc.ty);
      if (hitNPC){
        // Can hits an NPC - they react with a random complaint
        const npcVoices = [
          'Hey! Watch it!',
          'Ow! That hurt!',
          "I'm calling 3-1-1!"
        ];
        Voice.say(npcVoices[(Math.random() * npcVoices.length) | 0], 2.5, 1.1);
        hitNPC.vcd = 3; // longer cooldown so they don't repeat immediately
      } else {
        // Spawn dust effect at landing spot
        spawnDustEffect(fc.tx, fc.ty);
      }
      
      // Mark house as serviced (in case not already done)
      checkHouse(fc.h);
      
      // Lay the can sideways on the sidewalk and make it a persistent solid obstacle
      if (fc.g){
        // GZ + 0.43 raises the group center so the cylinder bottom (at center - 0.425) 
        // rests exactly on the sidewalk surface at GZ, preventing ground clipping
        fc.g.position.set(fc.tx, fc.ty, GZ + 0.43);
        fc.g.rotation.z = R(-0.1, 0.1); // slight random tilt for natural look
        fc.g.rotation.x = Math.PI / 2; // lay flat sideways
        fc.g.visible = true;
      }
      
      // Add to landed cans array for collision
      landedCans.push({ wx: fc.tx, wy: fc.ty, g: fc.g });
      
      // Remove from flyingCans immediately — can persists on sidewalk as solid obstacle
      flyingCans.splice(i, 1);
    } else {
      // Interpolate along parabolic arc from start to target
      const t = fc.progress;
      const easeT = -Math.cos(t * Math.PI) * 0.5 + 0.5; // ease in-out
      const curX = fc.sx + (fc.tx - fc.sx) * easeT;
      const curY = fc.sy + (fc.ty - fc.sy) * easeT;
      // Arc height: peaks at midpoint
      const arcHeight = Math.sin(t * Math.PI) * 3.5;
      if (fc.g){
        fc.g.position.set(curX, curY, GZ + arcHeight);
        // Spin the can during flight
        fc.g.rotation.z += dt * 8;
        fc.g.rotation.x += dt * 3;
        
        // Mid-air NPC collision check
        if (!fc.landed && Math.sin(t * Math.PI) > 0.1){
          const hitNPC = checkFlyingCanNpcHit(curX, curY);
          if (hitNPC){
            const npcVoices = ['Hey! Watch it!', 'Ow! That hurt!', "I'm calling 3-1-1!"];
            Voice.say(npcVoices[(Math.random() * npcVoices.length) | 0], 2.5, 1.1);
            hitNPC.vcd = 3;
          }
        }
      }
    }
  }
}
function checkFlyingCanNpcHit(fcx, fcy){
  for (let i = creatures.length - 1; i >= 0; i--){
    const c = creatures[i];
    if (c.type === 'ped' || c.type === 'lady' || c.type === 'breaker' || c.type === 'yeller' || c.type === 'dogwalker'){
      const dx = fcx - c.wx, dy = fcy - c.wy;
      if (dx * dx + dy * dy < 0.8){
        return c;
      }
    }
  }
  return null;
}
// ==================== DUST PARTICLE SYSTEM ====================
function updateDustParticles(dt){
  for (let i = dustParticles.length - 1; i >= 0; i--){
    const p = dustParticles[i];
    p.life -= dt * p.decay;
    if (p.life <= 0){
      if (p.g.parent) { p.g.parent.remove(p.g); disposeObj(p.g); }
      dustParticles.splice(i, 1);
      continue;
    }
    p.wx += p.vx * dt;
    p.wy += p.vy * dt;
    p.vz -= dt * 2.5; // gravity pulls dust down
    if (p.g){
      p.g.position.set(p.wx, p.wy, GZ + Math.max(0, p.vz));
      p.g.scale.setScalar(Math.max(0.1, 1 - p.life * 0.5) * (2 - p.life));
      // Fade opacity
      const mesh = p.g.children[0];
      if (mesh && mesh.material){
        mesh.material.opacity = p.life * 0.7;
        mesh.rotation.z += p.rotSpeed * dt;
      }
    }
  }
}
function checkHouse(h){
  if (!h || h.serviced) return;
  const bagsOK = h.bags.every(b => b.state === 'dumped');
  const canOK = !h.can || h.can.state === 'returned' || h.can.state === 'dumped';
  if (bagsOK && canOK){
    h.serviced = true;
    addScore(50);
    if (h.lamp && h.lamp.material){
      h.lamp.material.color.set(0x4dff88);
      h.lamp.material.emissive.set(0x1f7a44);
    }
  }
}
function addWriteUp(){
  if (state !== 'play') return;
  complaints++;
  SFX.playComplaintSound();
  Voice.say('I\'m calling your supervisor!', 3, 1.0);
  const f = $('flash');
  f.style.opacity = 1;
  setTimeout(() => { f.style.opacity = 0; }, 500);
  if (complaints >= 3 && !TEST_KEEP_PLAYING) gameOver();
}
function nearHopper(){
  if (!truck || truck.hidden > 0) return false;
  const hx = truck.wx + (truck.hopperOff != null ? truck.hopperOff : -4.3), hy = -4.5;
  const dx = hx - p.wx, dy = hy - p.wy;
  return dx > -1.5 && dx < 5.0 && Math.abs(dy) < 8.0;
}
function attachCarried(item){

}
function pickUp(item){
  if (item.kind === 'can' && item.state === 'droppedEmpty'){
    carry = 'canEmpty';
    item.state = 'carriedEmpty';
  } else {
    carry = item.kind === 'bag' ? 'bag' : 'canFull';
    item.state = 'carried';
    Voice.say('This bag is heavy!', 3.5, 0.8);
  }
  carried = item;
  attachCarried(item);

}
function tossBag(bag){
  bag.state = 'dumped';
  if (bag.g.parent) bag.g.parent.remove(bag.g);
  disposeObj(bag.g);
  addScore(25);
  hopperDeposit();
  SFX.playTossSound();
  checkHouse(bag.h);
  carried = null; carry = 'none';
}
function dumpCan(){
  const c = carried;
  c.state = 'dumped'; // mark can as dumped for checkHouse recognition
  // Immediately toss can to sidewalk from where worker is standing - worker is free to service another item right away
  addScore(30);
  hopperDeposit();
  SFX.playCanDropSound();
  SFX.playTossSound();
  carry = 'none';
  
  const targetWy = 1.8 + R(-0.4, 1.2); // toss to sidewalk area
  const targetWx = c.home.wx + R(0.5, 3.5);
  
  flyingCans.push({
    g: c.g,
    sx: p.wx, sy: p.wy, // START from worker's current position
    tx: targetWx,
    ty: clamp(targetWy, 1.5, 4.0),
    progress: 0,
    duration: 0.7,
    landed: false,
    home: c.home,
    h: c.h
  });
  
  // Detach from worker and add to world for animation
  if (c.g.parent) { c.g.parent.remove(c.g); }
  dynamicGroup.add(c.g);
  
  // Reset can reference - worker free to pick up again immediately
  carried = null;
  checkHouse(c.h);
}
function returnCan(){
  const c = carried;
  c.state = 'returned';
  c.wx = c.home.wx; c.wy = c.home.wy;
  worker.group.remove(c.g);
  dynamicGroup.add(c.g);
  c.g.position.set(c.wx, c.wy, GZ);
  addScore(15);
  SFX.playCanDropSound();
  checkHouse(c.h);
  carried = null; carry = 'none';
}
function dropCarried(){
  if (carry === 'none' || !carried) return;
  const item = carried;
  item.wx = p.wx - 0.4 + R(-0.3, 0.3);
  item.wy = clamp(p.wy + R(0.6, 1.0), -2, 4.5);
  if (item.kind === 'can' && item.state === 'carriedEmpty'){
    item.state = 'droppedEmpty';
    item.home.wx = item.wx; item.home.wy = item.wy;
  } else {
    item.state = 'curb';
  }
  worker.group.remove(item.g);
  dynamicGroup.add(item.g);
  item.g.position.set(item.wx, item.wy, GZ);
  carried = null; carry = 'none';
  SFX.playDropSound();
}
function spawnBonus(wx, wy){

function doStun(dur, type){

function collideStatic(dt){

// ==================== LANDED CAN COLLISION (SOLID OBSTACLE) ====================
function collideLandedCans(){
  if (state !== 'play' || p.invuln > 0 || p.stunT > 0) return;
  for (let i = landedCans.length - 1; i >= 0; i--){
    const lc = landedCans[i];
    const dx = lc.wx - p.wx, dy = lc.wy - p.wy;
    const d2 = dx * dx + dy * dy;
    if (d2 > 0.85) continue; // collision radius ~0.92
    const d = Math.sqrt(d2) || 0.001;
    const nx = -dx / d, ny = -dy / d; // push outward
    const pen = Math.sqrt(0.85) - d;
    p.wx += nx * (pen + 0.05);
    p.wy = clamp(p.wy + ny * (pen + 0.05), -9.4, 4.5);
  }
}
function collideCreatures(){
  if (state !== 'play' || p.invuln > 0 || p.stunT > 0) return;
  for (let i = 0; i < creatures.length; i++){
    const c = creatures[i];
    const dx = c.wx - p.wx, dy = c.wy - p.wy;
    const d2 = dx * dx + dy * dy;
    let rad = 1.0;
    if (c.type === 'rat' || c.type === 'squirrel') rad = 0.9;
    else if (c.type === 'raccoon') rad = 1.0;
    else if (c.type === 'rc') rad = 0.7;
    else if (c.type === 'tric' || c.type === 'bike') rad = 1.1;
    else if (c.type === 'ebike' || c.type === 'moto') rad = 1.3;
    else if (c.type === 'car') rad = 2.85; // scaled with the 1.124 car.glb model (5% smaller)
    else if (c.type === 'ped' || c.type === 'lady') rad = 0.85;
    else if (c.type === 'dogwalker') rad = 0.95;
    else if (c.type === 'breaker') rad = 1.2;
    else if (c.type === 'yeller') rad = 0.95;
    if (d2 > rad * rad) continue;
    if ((c.type === 'ped' || c.type === 'lady' || c.type === 'breaker' || c.type === 'yeller' || c.type === 'dogwalker')){
      // People are SOLID: push the worker out so they can't walk through, but NEVER stun
      // (a stun here caused an infinite stun-lock loop when the worker was stuck against them)
      const d = Math.sqrt(d2) || 0.001;
      const nx = -dx / d, ny = -dy / d; // from person toward worker
      const pen = rad - d;             // push out to just touching (small gap)
      p.wx += nx * (pen + 0.05);
      p.wy = clamp(p.wy + ny * (pen + 0.05), -9.4, 4.5);
      if (c.vcd <= 0){
        c.vcd = 2.5;
        if (c.type === 'dogwalker'){ c.bark = 2.2; Voice.say('WOOF! WOOF! WOOF!', 2.5, 1.0); }
        else if (c.type === 'yeller') Voice.say('Damn fentanyl addicts!', 4, 0.9);
        else Voice.say('Hey! Watch it!', 4, 1.1);
      }
      return;
    }
    if (c.type === 'rat'){
      c.flee = 1.6; c.dir = dx >= 0 ? -1 : 1;
      Voice.say('Eeek!', 1.2, 1.5);
      if (carry !== 'none' && Math.random() < 0.45) dropCarried();
      doStun(0.5, 'trip');
    } else if (c.type === 'squirrel' || c.type === 'raccoon'){
      c.flee = 1.8; c.dir = dx >= 0 ? -1 : 1;
      if (carry !== 'none' && Math.random() < 0.4) dropCarried();
      doStun(0.5, 'trip');
    } else {
      // vehicles: knockback + drop + stun + i-frames
      const nl = Math.sqrt(d2) || 1;
      p.wx -= (dx / nl) * 1.6;
      p.wy = clamp(p.wy - (dy / nl) * 1.6, -9.4, 4.5);
      dropCarried();
      p.invuln = 1.6;
      doStun(1.2, 'hit');
      if (c.type === 'car' || c.type === 'moto') Voice.say('Watch the road!', 4, 0.7);
      else Voice.say('Hey! Hurry up!', 5, 0.85);
    }
    return;
  }
}
// ==================== PLAYER UPDATE ====================
function updatePlayer(dt){
  // 4-way, 100% player-driven movement (keyboard OR gamepad):
  // W/Up = forward, S/Down = back along the route, A/D = strafe; no input = stands still
  let fwd  = !!(keys['KeyW'] || keys['ArrowUp']   || gp.fwd);
  let back = !!(keys['KeyS'] || keys['ArrowDown'] || gp.back);
  let lat = 0;
  if (keys['KeyA'] || keys['ArrowLeft']  || gp.left) lat = 1;
  if (keys['KeyD'] || keys['ArrowRight'] || gp.right) lat = -1;
  if (p.stunT > 0){
    p.stunT -= dt;
    fwd = false; back = false; lat = 0;
  }
   // ===== dynamic facing: worker turns to match walk direction =====
   let moveX = 0, moveY = 0;
   if (fwd) moveX += 1;
   if (back) moveX -= 1;
   moveY += lat;
   if (moveX !== 0 || moveY !== 0){
     const target = Math.atan2(moveY, moveX);
     let diff = target - p.facing;
     while (diff >  Math.PI) diff -= 2 * Math.PI;
     while (diff < -Math.PI) diff += 2 * Math.PI;
     p.facing += diff * Math.min(1, dt * 22);
   }
  const dir = fwd ? 1 : (back ? -1 : 0);
  const speed = dir !== 0 ? RUN_SPEED * (dir < 0 ? 0.75 : 1) : 0; // backing up is a touch slower
  if (dir !== 0) p.wx += dir * speed * dt;
  p.wy = clamp(p.wy + lat * 5.5 * dt, -9.4, 4.5);
  // === Truck body collision: worker can't clip through the truck, but can walk freely
  // around the front AND along BOTH sides. The push runs along the CLOSEST point of the
  // box (rounded corners), so rounding the cab or the hopper never teleports the worker
  // "forward" — the old min-edge push did exactly that and pinned him at the truck. ===
  if (truck && truck.hidden <= 0){
    const tCx = truck.wx, tCy = -4.5;
    const tHalfL = truck.boxL, tHalfW = truck.boxW;
    const WR = 0.45; // worker collision radius (visual body half-width is 0.28 — vest 0.56 lateral)
    const cx = Math.min(Math.max(p.wx, tCx - tHalfL), tCx + tHalfL);
    const cy = Math.min(Math.max(p.wy, tCy - tHalfW), tCy + tHalfW);
    const dx = p.wx - cx, dy = p.wy - cy;
    const d2 = dx * dx + dy * dy;
    if (d2 < WR * WR){
      if (d2 > 1e-8){
        const d = Math.sqrt(d2);
        const push = WR - d;
        p.wx += (dx / d) * push;
        p.wy = clamp(p.wy + (dy / d) * push, -9.4, 4.5);
      } else {
        // Degenerate (worker inside the box): eject toward the nearer side
        const dBot = Math.abs(p.wy - (tCy - tHalfW));
        const dTop = Math.abs(p.wy - (tCy + tHalfW));
        p.wy = (dBot < dTop) ? tCy - tHalfW - WR : tCy + tHalfW + WR;
      }
    }
  }
  p.invuln = Math.max(0, p.invuln - dt);
  p.shake = Math.max(0, p.shake - dt * 1.3);
  routeDist += speed * dt;
  if (routeDist > 150){
    routeDist = 0;
    routeIdx = (routeIdx + 1) % ROUTES.length;
    setTxt($('route'), ROUTES[routeIdx]);
  }
  // animation (legs pump only while the player is actually moving)
  const amp = (dir !== 0 ? 0.7 : (lat !== 0 ? 0.35 : 0));
  const s = Math.sin(p.phase) * amp;
  p.phase += Math.max(speed, Math.abs(lat) * 4.5) * dt * 1.5;
  if (p.stunT > 0){
    const k = p.stunT / p.stunDur;
    wparts.legL.rotation.y *= 0.9; wparts.legR.rotation.y *= 0.9;
    wparts.armL.rotation.y = 0.6 * k * Math.sin(p.phase * 3);
    wparts.armR.rotation.y = -0.6 * k * Math.sin(p.phase * 3);
    worker.group.rotation.x = Math.sin(performance.now() * 0.03) * 0.3 * k;
  } else {
    worker.group.rotation.x = 0;
    wparts.legL.rotation.y = s;
    wparts.legR.rotation.y = -s;
    wparts.armL.rotation.y = -s * 0.8;
    wparts.armR.rotation.y = s * 0.8;
  }
   // face the direction walked (z-axis = screen-plane rotation in isometric space)
   worker.group.rotation.z = p.facing;
  const sx = p.shake > 0 ? R(-0.3, 0.3) * p.shake : 0;
  const sy = p.shake > 0 ? R(-0.3, 0.3) * p.shake : 0;
  worker.group.position.set(p.wx + sx, p.wy + sy, GZ);
  // invulnerability flashing
  const vis = p.invuln > 0 ? (Math.floor(p.invuln * 12) % 2 === 0) : true;
  worker.group.traverse(o => { if (o.isMesh) o.visible = vis; });
}
// ==================== TRUCK UPDATE ====================
function updateTruck(dt){

  // circulating around the worker, so there is always a hopper nearby to deposit in

// ==================== VEHICLE OBSTACLE DETECTION & COLLISION PREVENTION ====================
function findVehicleAhead(vehicle, allCreatures){
  // Returns the closest vehicle/truck directly ahead within detection range
  let best = null;
  const detRange = 15.0; // extended range for early obstacle awareness
  for (let i = 0; i < allCreatures.length; i++){
    const other = allCreatures[i];
    if (other === vehicle) continue;
    // Must be ahead (positive X relative to us, since everyone moves +X)
    const dxAhead = other.wx - vehicle.wx;
    if (dxAhead < 0.5 || dxAhead > detRange) continue;
    // Check Y overlap using bounding boxes
    let otherBoxL = other.boxL || 1.4;   // default to car size
    let otherBoxW = other.boxW || 0.35;
    const yOverlap = Math.abs(other.wy - vehicle.wy) < (otherBoxW + vehicle.boxW + 0.5); // wider Y overlap for bikes
    if (!yOverlap) continue;
    // NO SLOW TRAFFIC: vehicles NEVER brake for NPCs (pedestrians, animals, dog walkers...).
    // Those creatures clear the way themselves via npcRoadRules(). Only real vehicles block.
    if (!VEHICLE_TYPES[other.type]) continue;
    // Same-type bike detection removed - bikes should all detect the truck ahead independently
    // Previous check caused them to ignore each other and pile up at the hopper
    
    // Prefer closer vehicles
    if (best === null || dxAhead < best.dist){
      best = { wx: other.wx, wy: other.wy, sp: other.curSp || other.sp, dist: dxAhead };
    }
  }
  // Check the garbage truck as an obstacle — ALWAYS check regardless of best
  const tBoxYMin = -4.5 - truck.boxW;
  const tBoxYMax = -4.5 + truck.boxW;
  const vBoxYMin = vehicle.wy - vehicle.boxW;
  const vBoxYMax = vehicle.wy + vehicle.boxW;
  if (vBoxYMax > tBoxYMin && vBoxYMin < tBoxYMax){
    // Truck rear (hopper end) is at truck.wx - boxL; front cab is at truck.wx + boxL
    const truckRear = truck.wx - truck.boxL;
    const dxT = truckRear - (vehicle.boxL + vehicle.wx);
    if (dxT > 0 && dxT < detRange){
      // Update best if truck is closer than any other detected obstacle
      if (best === null || dxT < best.dist){
        best = { wx: truck.wx, wy: -4.5, sp: TRUCK_SPEED, dist: dxT, isTruck: true };
      }
    }
  }
    // Keep the truck as an obstacle only while the vehicle is still APPROACHING from
    // behind (nose behind the rear face) and laterally overlapping — extends the block
    // above a little further back. Once the nose is past the rear face, the truck is
    // alongside/BEHIND — not an obstacle ahead. (The old version fired here with dist 0.1
    // while a vehicle was finishing its pass, forcing a dead stop right at the truck's front.)
    if (best === null && vBoxYMax > tBoxYMin && vBoxYMin < tBoxYMax){
      const tRear2 = truck.wx - truck.boxL;
      const noseGap = tRear2 - (vehicle.wx + vehicle.boxL);
      if (noseGap > 0 && noseGap <= 16.0){
        best = { wx: truck.wx, wy: -4.5, sp: TRUCK_SPEED, dist: noseGap, isTruck: true };
      }
    }
  return best || null;
}
// ==================== CHECK IF A LANE IS CLEAR FOR DETOUR ====================
function isLaneClear(checkWy, checkWx, checkBoxW, allCreatures){
  // Returns true if no other vehicle or the truck occupies the given Y position in the detection zone ahead
  for (let i = 0; i < allCreatures.length; i++){
    const other = allCreatures[i];
    if (other === undefined || other.type === 'ped' || other.type === 'lady') continue;
    if (!other.boxW) continue;
    const dy = Math.abs(other.wy - checkWy);
    const boxOverlap = (other.boxW + checkBoxW + 0.2);
    if (dy < boxOverlap){
      // Check X proximity — this vehicle is in the way
      const dx = other.wx - checkWx;
      if (dx > -1 && dx < ((other.boxL || 1.4) + 2.5)) return false; // occupied
    }
  }

  const tBoxYMin = -4.5 - truck.boxW;   // -6.4
  const tBoxYMax = -4.5 + truck.boxW;   // -2.6
  if (checkWy >= tBoxYMin && checkWy <= tBoxYMax){ return false; } // inside truck Y — blocked

  // Other vehicles in those lanes are already handled by the vehicle loop above (lines 1462-1471).

// ==================== NPC ROAD RULES: YIELD TO TRAFFIC — NO SLOW TRAFFIC ====================
// Any NPC that is in front of a closing vehicle (car / moto / bike / ebike / RC / tric)
// must clear the way for it: steer LEFT or RIGHT into a clear lane, or SPRINT straight
// ahead when the path is clear. Vehicles NEVER slow down for NPCs — the NPC always
// moves out of the way, so traffic never crawls.
const VEHICLE_TYPES = { car: 1, moto: 1, bike: 1, ebike: 1, rc: 1, tric: 1 };
function findClosingVehicle(c, all){
  // Closest moving vehicle behind us in our lane (we are ahead of it, it is catching up)
  let best = null;
  for (let i = 0; i < all.length; i++){
    const v = all[i];
    if (v === c || !VEHICLE_TYPES[v.type] || !v.boxW) continue;
    const vSp = (v.curSp !== undefined ? v.curSp : (v.sp || 0));
    if (vSp < 2) continue; // only live, moving traffic is a threat
    const dx = c.wx - v.wx; // positive = NPC is ahead
    if (dx < -1.5 || dx > 30) continue;
    if (Math.abs(v.wy - c.wy) > v.boxW + 0.45) continue; // different lane — not a threat
    if (!best || dx < best.dx) best = { v: v, dx: dx };
  }
  return best;
}
function findFastRiderBehind(c, all){
  // Fast two-wheelers (bike / ebike / moto) closing from behind in our lane.
  // Cars must let these riders past — steer aside or speed up.
  let best = null;
  for (let i = 0; i < all.length; i++){
    const v = all[i];
    if (v === c) continue;
    if (v.type !== 'bike' && v.type !== 'ebike' && v.type !== 'moto') continue;
    const vSp = (v.curSp !== undefined ? v.curSp : (v.sp || 0));
    if (vSp < 6) continue; // only actually-moving riders count
    const ourSp = (c.curSp !== undefined ? c.curSp : (c.sp || 0));
    if (vSp <= ourSp + 0.5) continue; // only a threat if the rider can actually overtake us
    const dx = c.wx - v.wx; // positive = we (the car) are ahead
    if (dx < -2 || dx > 25) continue;
    if (Math.abs(v.wy - c.wy) > (v.boxW || 0.3) + 0.5) continue; // different lane
    if (!best || dx < best.dx) best = { v: v, dx: dx };
  }
  return best;
}
function npcLaneFree(wy, wx, all, self){
  // True if no vehicle occupies the candidate lateral lane near the NPC, and it's not the truck
  for (let i = 0; i < all.length; i++){
    const v = all[i];
    if (v === self || !VEHICLE_TYPES[v.type] || !v.boxW) continue;
    if (Math.abs(v.wy - wy) > v.boxW + 0.6) continue;
    const dx = v.wx - wx;
    if (dx > -8 && dx < 15) return false; // a vehicle occupies that lane nearby
  }
  const tYMin = -4.5 - truck.boxW, tYMax = -4.5 + truck.boxW;

}
function npcRoadRules(c, dt){
  // Run for every NPC each frame. Steers the NPC out of a closing vehicle's lane
  // (c.yieldLane) and/or flags a sprint boost (c.sprintT) to outrun it.
  // Returns the minimum forward speed the NPC should use this frame (or null).
  if (c.sprintT > 0) c.sprintT -= dt;
  if (c.yieldLane !== undefined){
    c.wy += (c.yieldLane - c.wy) * Math.min(1, 5.5 * dt); // move left/right to the escape lane
    if (Math.abs(c.yieldLane - c.wy) < 0.08) c.yieldLane = undefined;
  }
  const threat = findClosingVehicle(c, creatures);
  if (!threat) return null;
  const vSp = (threat.v.curSp !== undefined ? threat.v.curSp : (threat.v.sp || 0));
  if (c.yieldLane === undefined){
    // Pick a clear lateral escape: steer AWAY from the vehicle's lane first, then the other way
    const away = (c.wy - threat.v.wy) >= 0 ? 1 : -1;
    const steps = [away * 1.5, -away * 1.5, away * 3.0, -away * 3.0];
    for (let i = 0; i < steps.length; i++){
      const cand = c.wy + steps[i];
      if (cand < -8.6 || cand > 7.8) continue; // stay on street + sidewalk
      if (npcLaneFree(cand, c.wx, creatures, c)){ c.yieldLane = cand; break; }
    }
  }
  if (c.yieldLane !== undefined){
    return Math.max(c.sp || 0, vSp * 0.7); // keep running while steering out of the way
  }
  // No clear lane beside us — sprint straight ahead (path is clear: that's the escape)
  c.sprintT = Math.max(c.sprintT || 0, 0.9);
  c._sprintBoost = vSp * 1.15 + 1.0;

}
// ==================== VEHICLE COLLISION SEPARATION ====================
function separateVehicles(vehicles, dt){
